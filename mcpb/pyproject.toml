[project]
name = "tooluniverse-mcpb-native"
version = "1.5.5"
description = "ToolUniverse MCP Server (Native MCPB bundle)"
# This bound and manifest.json's compatibility.runtimes.python look like the
# same fact stated twice. They are not:
#
#   manifest.json  -- Desktop's install gate, checked against the Python the
#                     *user* happens to have. The bundle never runs that
#                     interpreter, because uv provisions its own.
#   this file      -- the range uv resolves and provisions *for the bundle*.
#                     It must exclude any interpreter the locked graph cannot
#                     install on.
#
# They agree again as of 1.5.4. The cap was "<3.14" because markitdown pulled
# magika 0.6.3, which asks for onnxruntime with no per-version markers and so
# resolved to 1.20.1 -- a release with no cp314 wheels. 1.5.4 moved markitdown
# behind the `documents` extra, which the bundle does not ask for, so magika
# and onnxruntime are no longer in the lock at all and 3.14 installs. Verified
# against the published 1.5.4: `uv sync --frozen --python 3.14` installs and
# `import tooluniverse` succeeds on 3.14.7.
#
# Keeping the cap honest still matters, because --python 3.12 in the manifest
# is not guaranteed to be applied -- the MCPB spec calls mcp_config optional
# for server.type "uv" ("host manages execution"), so this bound is what makes
# uv pick a working interpreter when nothing else is consulted. Re-check before
# changing it; the cap is a property of the resolved graph, not of ToolUniverse:
#   uv lock && uv sync --frozen --python 3.14
requires-python = ">=3.10,<3.15"

# The bundle declares ToolUniverse as a dependency instead of carrying its
# source. This is the shape the MCPB docs describe for `server.type = "uv"`
# ("include pyproject.toml with dependencies, no bundled packages needed") and
# the shape of the official hello-world-uv example, whose bundle holds its own
# entry point and nothing else.
#
# The reason is the update path. A bundle that carries the source has to be
# rebuilt and resubmitted to the Claude Desktop extensions directory for every
# change, and a desktop extension has no self-serve update: remote servers get
# a submissions dashboard, MCPB submissions go through a form and a manual
# review. With the dependency declared here, src/run_stdio.py can move the
# install forward on its own (at most once a day, bounded, never fatal) and a
# user picks up each release without another submission.
#
# The upgrade has to be asked for explicitly -- it is not a side effect of
# dropping --frozen. Verified: with a lock pinning 1.4.1 and the constraint
# relaxed to >=1.4.0,<2, a plain `uv run` re-used 1.4.1 and left the lock
# untouched, because uv only re-resolves a lock that no longer satisfies
# pyproject.toml. That is also why the lock ships: --frozen keeps the launch
# itself off the network, so a hostile or absent index cannot delay startup.
#
# The floor is the release that introduced this bundle shape; the ceiling keeps
# a future major version from arriving unreviewed. Everything ToolUniverse
# needs at runtime is declared by its own package metadata, so the long list
# that used to live here is gone.
# The openai and gemini extras are deliberate. They are optional in the root
# package, because a downstream resolver should not be forced onto
# google-genai's websockets bound (issue #526), but this bundle is a sealed
# runtime: a user has no way to install an extra into it, so leaving them out
# would make the OpenAI and Gemini clients permanently unavailable in Desktop.
# The old bundled dependency list carried both unconditionally for the same
# reason; naming the extras here preserves that exactly.
# The stats extra is named for the same reason as openai and gemini: scipy and
# networkx left the package's base dependencies, and in a sealed bundle their
# absence would silently take 15 tools off Desktop at the next self-update --
# survival analysis, Cox regression, dose-response and synergy fitting,
# enrichment, per-gene ANOVA, co-expression, network proximity -- with no way
# for a user to add them back. 128 MB for those 15.
# chem is named too: 23 MB buys back ChEMBL_search_similar_molecules, which a
# Desktop user cannot obtain any other way, and it is the cheapest of the four.
#
# browser, documents and websearch are deliberately NOT named
# here, unlike openai and gemini. They are 275 MB of the install for a handful
# of tools, and what a Desktop user actually loses was measured rather than
# assumed, in a lean environment:
#   get_webpage_text_from_url / get_webpage_title  gone (playwright, 141 MB);
#       Claude Desktop can already fetch a URL itself.
#   *_get_pdf_snippets / CORE_get_fulltext_snippets  report that markitdown is
#       needed (91 MB). ArXiv_search_papers, CORE_search_papers and
#       SemanticScholar_search_papers keep working; only extraction stops.
#   web_search  keeps working -- DDGS is one backend of several, and `auto`
#       returned results with ddgs absent.
# That is five tools of 2717, against 288 MB off the first launch (775 -> 487,
# measured). Adding documents costs 121 MB more and puts onnxruntime back, which
# is what holds requires-python at <3.14. Each is one name in the list above.
dependencies = [
    "tooluniverse[openai,gemini,stats,chem]>=1.5.3,<2",
]

[tool.uv]
# Nothing here is a package to build; the directory exists to declare what the
# launcher needs. Without this uv tries to build "tooluniverse-mcpb-native"
# itself and fails once there is no source tree under src/.
package = false
