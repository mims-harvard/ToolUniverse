[project]
name = "tooluniverse-mcpb-native"
version = "1.5.4"
description = "ToolUniverse MCP Server (Native MCPB bundle)"
# Upper bound tracks the tightest Requires-Python among the resolved
# dependencies, currently youtube-transcript-api (>=3.8,<3.15) pulled in by
# markitdown's youtube-transcription extra. It is NOT a ToolUniverse limit --
# the root pyproject declares ">=3.10" with no cap. Claude Desktop shows this
# range as an install requirement (mcpb/manifest.json keeps the same bounds),
# so leaving it stale blocks users on a Python we actually support: a stale
# "<3.14" did exactly that after issue #527 lifted the real cap. Re-check with
#   uv pip compile mcpb/pyproject.toml --python-version 3.X
# before widening, and keep manifest.json in sync. The manifest uses semver
# syntax (">=3.10 <3.15", space-separated); this file uses PEP 440 syntax
# (">=3.10,<3.15", comma-separated). A comma in the manifest fails Desktop's
# runtime version check even when a compatible Python is installed.
requires-python = ">=3.10,<3.15"

# The bundle declares ToolUniverse as a dependency instead of carrying its
# source. This is the shape the MCPB docs describe for `server.type = "uv"`
# ("include pyproject.toml with dependencies, no bundled packages needed") and
# the shape of the official hello-world-uv example, whose bundle holds its own
# entry point and nothing else.
#
# The reason is the update path. A bundle that carries the source has to be
# rebuilt and resubmitted to the Claude Desktop extensions directory for every
# change, and a desktop extension has no self-serve update: each submission is
# a manual review. With the dependency declared here and
# `--upgrade-package tooluniverse` in the launch command, a user picks up each
# release at the next launch. Measured on the prototype: a plain launch keeps
# the resolved version, the flag moves 1.5.1 to 1.5.2, it costs about 0.2 s per
# launch, and an offline launch still starts from the cached environment.
#
# The floor is the release that introduced this bundle shape; the ceiling keeps
# a future major version from arriving unreviewed. Everything ToolUniverse
# needs at runtime is declared by its own package metadata, so the long list
# that used to live here is gone.
# The openai and gemini extras are deliberate. They are optional in the root
# package, because a downstream resolver should not be forced onto
# google-genai's websockets bound (issue #526), but this bundle is a sealed
# runtime: a user has no way to install an extra into it, so leaving them out
# would make the OpenAI and Gemini clients permanently unavailable in Desktop.
# The old bundled dependency list carried both unconditionally for the same
# reason; naming the extras here preserves that exactly.
dependencies = [
    "tooluniverse[openai,gemini]>=1.5.3,<2",
]

[tool.uv]
# Nothing here is a package to build; the directory exists to declare what the
# launcher needs. Without this uv tries to build "tooluniverse-mcpb-native"
# itself and fails once there is no source tree under src/.
package = false
