[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "colabfold"
sparse = ["colabfold", "common"]
package = "colabfold_opt"
# `off` -- the kit's stock route -- and the reason is ARCHITECTURAL here rather
# than a card question, which makes it a different answer from af3_jax's even
# though the word is the same. Three findings, in the order they bind:
#
#  1. THE KIT'S ACTIVATION POINT IS `colabfold.batch.run`, AND A RESIDENT WORKER
#     DOES NOT CALL IT. `colabfold_opt/_autoload.py` arms a meta-path finder on
#     the module `colabfold.batch` and `stack.hook_run` wraps the `run` FUNCTION;
#     the activation happens at the `run` call, with that run's queries and its
#     data_dir. This worker holds the model that `run` rebuilds on every call --
#     `load_models_and_params` is called inside `run` -- so under a kit mode the
#     levers would attach to a function nothing invokes, and the worker would
#     report a mode while running stock. Reporting a mode that did not engage is
#     the one thing this kit's own hook exists to prevent, and it is worth more
#     than the levers.
#  2. THE ALTERNATIVE WAS PRICED, NOT ASSUMED. A worker could call `run()` per
#     request and get the levers. It would also re-read 1.86 GB of parameters and
#     re-trace the model every time, because nothing memoises either: the kit's
#     `weights.py` is a DIGEST memo for the parameter check, not a parameter
#     cache, and the kit's own README puts a fresh process at ">= 25-35 s tracing
#     and loading the model before its first structure (stock behaviour, every
#     mode)" plus "about 2 min" of compilation per new length. Measured here, the
#     held worker answers a repeated request in a few seconds (see verified_on).
#     The levers' advertised gain is "prediction time per model" against a
#     per-call cost of 40-50 s that residency removes outright.
#  3. AND THE LEVERS ARE NOT WHAT RULES THEM OUT ON THIS CARD, which is the
#     honest shape of this entry and the difference from af3_jax. af3_jax's
#     `fast` REFUSES on cc 12.1 by name, because opt_core's FlashPairformer has
#     no tile row for it. This kit's shared-core provider has an explicit
#     inheritance rule for exactly this case (`PALLAS_CELLS.json`
#     `unmeasured_cc_rule`): its 1,794 measured cells cover cc 8.0 and 9.0 only,
#     and a part with major >= 9 inherits the nearest measured column at or below
#     it, so cc 12.1 would be served H100's rows with the census token
#     `inherited_cc:unmeasured(from 9.0)` -- source-compiled Pallas rows
#     inherited, the prebuilt per-arch bridge rows (the sm_90a triangle kernels)
#     deliberately NOT. So `fast` is plausibly reachable on this card THROUGH THE
#     KIT'S OWN CLI, and an operator who wants the levers should use
#     `bash run.sh pred`, which is a different deployment with a different cost
#     model. Except that on this card that CLI cannot fold at all -- see the
#     bfloat16 section in the header -- which is why this provider is the only
#     working route here and why `off` costs nothing that is currently available.
mode = "off"
env_row = "none"
# A SEVENTH SPELLING, and the first that is a KEY NAME rather than a signature.
# `kit_launch.ask_kit` reads the child's variables from `resolve(...)`'s `env`
# or `exports`. This kit's `modes.resolve(mode)` takes exactly one positional
# argument (so the probe's plain `resolve(mode)` call SUCCEEDS) and returns
# {"mode", "levers", "kit_env", "tier"} -- the row is spelled `kit_env`, which
# is neither of the two the probe knows, so the probe would read an empty row
# and nothing would say why. Under `off` that row is `{}` in any case
# (`TABLE["off"] = ((), {}, "stock")`), and the kit asserts that emptiness
# itself before launching stock. So "none" here means "this MODE has no row,
# and must not" -- af3_jax's third sense of empty -- with a fourth fact beside
# it: the key the probe would have to read is `kit_env`. Moot for this
# provider, like af3_jax's, because [runtime] launch is this provider's own
# module and never calls the build_command that reads these keys; recorded so
# that the next JAX kit's agent does not spend an hour on it. The model
# process's non-lever environment lives in `stock/PINS.json image.env`, which no
# probe reads either -- [kit.env] below is where this provider states it.
env_row_reason = "the row is empty because the MODE is `off` (modes.TABLE[\"off\"] = ((), {}, \"stock\"); mode_env is {}), not because the kit keeps none -- `fast` carries AF_PALLAS_ATTN=1. And the key resolve() returns it under is spelled `kit_env`, which is neither of the two spellings kit_launch's probe reads (`env`, `exports`), so a probe here would read an empty row for a second, unrelated reason. Moot: [runtime] launch is tooluniverse.remote.colabfold.launch:build_command."
# THE KIT'S OWN INSTALL COMMAND, RUN UNMODIFIED FIRST -- and then one named
# exception, which is this provider's only deviation from "the kit's gate is the
# gate".
#
# `bash run.sh install` does three things: `pip install -e ../common/opt_core -e
# opt`, then `stock/check_pins.py --checks packages,files`, then (only with
# `--weights DIR`) the parameter fetch. The fetch is deliberately NOT asked for
# here: it belongs to the weights step, which has the deep digest check and the
# named refusal. `--weights` is also the only thing in this command that would
# touch the network.
#
# THE ONE EXCEPTION. `check_pins.py` compares `importlib.metadata.version(name)`
# against the KIT's own requirements.lock for its nineteen `check_packages`, and
# one of them is `tensorflow_cpu`, which publishes no aarch64 wheel at any
# version. On this architecture that check CANNOT pass, however correct the
# environment is: `tensorflow` 2.21.0 -- the same release, CPU-only here because
# NVIDIA ships no aarch64 CUDA TensorFlow -- is what is installed, and
# `md.version("tensorflow_cpu")` is None. So the gate is run, and its refusal is
# accepted ONLY when re-reading its own JSON shows that the single failing
# package is `tensorflow_cpu` and that `tensorflow` is present at the pinned
# version. Any other mismatch, and any failure of the `files` check (the three
# stock files byte-compared against the kit's own copies), still exits 3 with
# the kit's words. That is the rosettafold3 precedent -- a provider may run what
# the kit's install runs when the kit's own command cannot be used verbatim --
# narrowed to one named package rather than to "ignore the gate".
install = """
set -u
PY={python}
export PATH="$(dirname "$PY"):$PATH"
cd {kit} || exit 1
bash run.sh install && exit 0
rc=$?
echo "[colabfold] run.sh install exited $rc; re-reading its own report to see whether its only complaint is this lock's one declared aarch64 substitution" >&2
R="$HOME/.cache/tooluniverse/colabfold-check-pins.json"
mkdir -p "$(dirname "$R")"
"$PY" -I stock/check_pins.py --checks packages,files --json > "$R" || true
REPORT="$R" "$PY" - <<'PINCHECK'
import importlib.metadata as md
import json
import os
import sys

report = json.load(open(os.environ["REPORT"]))
packages = report["packages"]["packages"]
bad = sorted(name for name, d in packages.items() if not d["ok"])
if not report["files"]["ok"]:
    sys.stderr.write("[colabfold] REFUSED: the kit's three pinned stock files are not "
                     "the installed ones; this is not an architecture question and "
                     "nothing here accepts it\\n")
    raise SystemExit(3)
if bad != ["tensorflow_cpu"]:
    sys.stderr.write("[colabfold] REFUSED: packages off their pins: " + ", ".join(bad) +
                     " -- only tensorflow_cpu is accepted, and only because it "
                     "publishes no aarch64 wheel at any version\\n")
    raise SystemExit(3)
want = packages["tensorflow_cpu"]["expected"]
have = md.version("tensorflow")
if have != want:
    sys.stderr.write("[colabfold] REFUSED: tensorflow_cpu " + str(want) + " is unpublished "
                     "for aarch64 and tensorflow is at " + str(have) + ", not " + str(want) +
                     "; the substitution environment/requirements.lock declares is one "
                     "release, not any release\\n")
    raise SystemExit(3)
print("[colabfold] kit installed; the kit's pin gate refused exactly one package and it is "
      "the declared substitution: tensorflow_cpu " + str(want) + " has no aarch64 wheel, "
      "tensorflow " + str(have) + " (the same release) is installed in its place. "
      "Everything else -- colabfold, alphafold-colabfold, the whole jax 0.5.3 stack, the "
      "three stock files byte for byte -- is at its pin.")
PINCHECK
"""

[kit.env]
XLA_PYTHON_CLIENT_PREALLOCATE = "false"
