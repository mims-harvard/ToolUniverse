# ColabFold provider -- the ColabFold optimization kit's own
# `colabfold/environment/requirements.lock` at commit f4f62fa6, with ONE
# substitution for this architecture. Installed with --no-deps.
#
# THE ONE DEVIATION, and it is a package NAME, not a version:
#
#   tensorflow_cpu==2.21.0  ->  tensorflow==2.21.0
#
# `tensorflow_cpu` 2.21.0 publishes cp310-cp313 wheels for
# `manylinux_2_27_x86_64` and `win_amd64` and NOTHING ELSE -- checked against
# the PyPI index, not assumed. `tensorflow` 2.21.0 publishes
# `tensorflow-2.21.0-cp311-cp311-manylinux_2_27_aarch64.whl` (281,828,020
# bytes), the same release, and on aarch64 that wheel IS the CPU build: NVIDIA
# ships no aarch64 `tensorflow[and-cuda]` and the aarch64 artifact carries no
# CUDA kernels. So the substitution changes the distribution name and neither
# the version nor what runs. It is the same move af3_jax's lock makes for
# torch, in the other direction (there an x86-64 URL was replaced by the
# aarch64 file of one release; here an x86-64-only NAME is replaced by the
# aarch64-publishing name of one release).
#
# Nothing else is touched. All 76 other pins resolve to an aarch64 cp311 or
# py3-none-any wheel at the kit's exact version -- including the whole jax
# stack: jax / jaxlib / jax-cuda12-plugin / jax-cuda12-pjrt 0.5.3 all publish
# `manylinux2014_aarch64` artifacts, which is worth stating because the round's
# brief said jaxlib's aarch64 wheels begin at 0.7.2. They do not; they begin at
# 0.4.18, and 0.5.3 is among them. The architecture is not what stops this
# provider -- see provider.toml.
#
# WHY TENSORFLOW IS IN THIS LOCK AT ALL, since 281 MB for an unused dependency
# would be worth removing: `alphafold.model.tf` (proteins_dataset,
# shape_placeholders, utils) is imported by `alphafold.model.features`, which
# `colabfold.batch` reaches through `model.config`/`model.model`. It is a
# feature-pipeline dependency of the stock release, not a second accelerator
# framework, and `pip check` is clean with it. Removing a pin the kit's own
# `check_pins.py` lists would make this a different stack than the measured
# one.
