# protenix_v1 — the model environment, installed --no-deps into the interpreter
# $TOOLUNIVERSE_PROTENIX_V1_PYTHON names. It is the kit's own
# protenix_v1/environment/requirements.lock with FOUR deviations, each named
# below; everything else is byte-identical to the kit's line, including
# torch 2.13.0 (PyPI's CUDA 13.0 build), triton 3.7.1, cuequivariance 0.11.1,
# numpy 2.4.1 and the whole nvidia-* pair of CUDA 12.9 / CUDA 13.0 runtimes.
#
# WHAT IS *NOT* A DEVIATION, because the obvious reading of the kit says it
# should be. `stock/PINS.json` has a "pinned_stack" block reading
# torch 2.7.1+cu126 / triton 3.3.1 / cuequivariance 0.8.0, and
# download.pytorch.org publishes no aarch64 file at torch 2.7.1+cu126. That
# block is not this kit's stack: it is the record of what UPSTREAM protenix
# 1.1.0 declares in its own wheel metadata, and PINS.json says so itself --
# its "tested_on" field ends "a documentation line: nothing reads or compares
# it", and STOCK.md's Stack section states the real one ("torch 2.13.0+cu130,
# triton 3.7.1 ... the full list is environment/requirements.lock"). The kit's
# only pin check, stock/check_pins.py, compares the installed `protenix`
# package's bytes against the shipped wheel's RECORD and NOTHING of the stack
# ("Software pins only ... no torch import"). Measured here: it returns
#   protenix 1.1.0 == pin 1.1.0; 138/138 package files are the pinned wheel's
#   bytes
# on this aarch64 torch 2.13.0+cu130 environment. So no torch substitution is
# needed and none is made.
#
# DEVIATION 1 and 2 -- torchvision and torchaudio. The kit's lock pins both by
# DIRECT URL to a PyTorch-index file whose name ends
# `manylinux_2_28_x86_64.whl` (torchvision 0.23.0+cu129, torchaudio 2.8.0+cu129),
# which is an architecture pinned by URL -- the shape STANDARD.md section 16
# records for enformer. They are pinned by VERSION here instead, against PyPI's
# own aarch64 cp311 wheels of the same two releases. The kit's own lock header
# explains why the pair is vestigial: they are "the CUDA 12.9 line this stack
# was upgraded from and stay installed beside it". protenix 1.1.0 imports
# neither -- `grep -rn "torchvision\|torchaudio"` over every .py in the shipped
# wheel returns nothing -- so this line keeps the freeze complete without
# claiming the two are the files the kit measured.
#
# DEVIATION 3 -- `protenix==1.1.0` is NOT installed from PyPI by this lock. It
# is installed, separately and --no-deps, from the wheel the kit ships
# (protenix_v1/stock/protenix-1.1.0-py3-none-any.whl), which is the same file
# PyPI serves and is what check_pins.py hashes against. It is therefore listed
# here as a comment rather than a line, exactly as the kit's own Dockerfile
# excludes it from both of its pip passes and installs the local wheel.
#
# DEVIATION 4 -- three CUDA 12 wheels are dropped, and this is the deviation
# that makes `tu remote setup` able to install this lock AT ALL.
# `nvidia-cudnn-cu12==9.10.2.21`, `nvidia-nccl-cu12==2.27.3` and
# `nvidia-cusparselt-cu12==0.7.1` are gone. They are the only three packages in
# the kit's lock that write files a CUDA 13 package also writes -- measured, by
# comparing every nvidia_*.dist-info RECORD in a built environment: 27 colliding
# paths, all of them under nvidia/cudnn/, nvidia/nccl/ and nvidia/cusparselt/,
# and no other pair collides anywhere. That collision is the reason the kit's
# own Dockerfile installs its lock in TWO pip passes, with the CUDA 13 line last
# ("one pass can leave torch unable to load").
#
# `tu remote setup`'s environment step installs a lock in ONE pass
# (`pip install --no-deps -r <lock>`), and pip does not honour file order:
# measured here, one pass over the kit's own ordering -- every cu12 line in its
# alphabetical place, every cu13 line at the end -- leaves
# nvidia/cudnn/lib/libcudnn.so.9 at 124,920 bytes, which is the CUDA 12 wheel's
# file, where the two-pass install leaves the CUDA 13 wheel's 6,328,728-byte
# one. torch 2.13.0+cu130 preloads that single path. So the cu12 copy wins a
# one-pass install and the stack is quietly not the measured one.
#
# Dropping the three removes the question instead of answering it: nothing in
# this environment loads them. torch 2.13.0+cu130 loads the cu13 copies;
# cuequivariance 0.11.1 is the one CUDA 12 consumer and its extension's DT_NEEDED
# list is `libcue_ops.so, libtorch*, libc10*, libnvrtc.so.12, libcuda.so.1` --
# nvrtc, which has its own non-colliding wheel (nvidia-cuda-nvrtc-cu12), and no
# cuDNN, NCCL or cuSPARSELt at all. Verified after removal: torch imports, sees
# the card, and cuequivariance's triangle_multiplicative_update and
# triangle_attention both run on it.
#
# APART FROM THOSE THREE there is no deviation in the package SET. Every
# other line of the
# kit's lock installs on aarch64 / cp311: SEVEN of them publish no aarch64
# wheel and build from sdist here (biotite 1.4.0, biotraj 1.2.2, gemmi 0.6.7,
# deepspeed 0.17.5, ihm 2.11, modelcif 1.4, scikit-learn-extra 0.3.0), and all
# seven built with the host's gcc 13.3 and nvcc 13.0 without a patch. They
# are kept rather than dropped even where
# protenix never imports them (deepspeed is reached only through
# `triangle_attention="deepspeed"`, which is not the default and which this
# provider does not offer; gemmi, pdbeccdutils and scikit-learn-extra are
# reached only from `scripts/gen_ccd_cache.py`, which inference never runs),
# because a lock that drops what it does not need stops being the stack that
# was measured.
#
# INSTALL ORDER MATTERS and is the kit's own, from environment/Dockerfile:
# everything except `torch==`, `triton==` and `nvidia-*-cu13==` first, then
# those -- the CUDA 13 cuDNN / NCCL / cuSPARSELt wheels share directories with
# their CUDA 12 namesakes and must be laid down last. `tu remote setup`
# installs this file in one `--no-deps` pass, which is safe only because pip
# installs in the order the file lists; the CUDA 13 block is therefore at the
# END of this file rather than in alphabetical position.
