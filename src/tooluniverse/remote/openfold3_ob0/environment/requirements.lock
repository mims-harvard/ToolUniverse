# OpenFold3 (OpenBind-0) model environment — the kit's own
# openfold3_ob0/environment/requirements.lock with the three linux-aarch64
# substitutions below applied. Python 3.11.12 (uv-managed CPython, installed
# with the STDLIB venv module), linux-aarch64.
#
# THE STACK IS openfold3's STACK. The ob0 kit's lock and the openfold3 kit's
# lock differ in exactly two of their 115 lines -- `openfold3` (0.5.0 against
# 0.4.1) and `rdkit` (2025.9.3 against 2026.3.3) -- so torch 2.10.0+cu128,
# triton 3.6.0, numpy 2.4.6, deepspeed 0.19.2, cuequivariance 0.10.0 and the
# rest are pin for pin the stack the openfold3 provider measured. What the two
# providers cannot share is an INTERPRETER: both pin the distribution named
# `openfold3`, at versions whose checkpoints are mutually incompatible
# (`version_compatibility` ">=0.5.0" against ">=0.4,<0.4.4dev0",
# openfold3/entry_points/parameters.py), and each kit installs its own
# autoload .pth whose hook refuses to share a process with the other's
# ("one route per process"). Two environments, two sockets.
#
# Rebuild (an NVIDIA driver that runs CUDA 12.8 -- 570 or newer -- and a C
# compiler on PATH for Triton and the kit's fused extensions):
#
#   uv python install 3.11
#   "$(uv python find --managed-python 3.11)" -m venv ~/openfold3_ob0-venv
#   ~/openfold3_ob0-venv/bin/python -m pip install --no-deps -r requirements.lock
#   export TOOLUNIVERSE_OPENFOLD3_OB0_PYTHON=~/openfold3_ob0-venv/bin/python
#   tu remote setup openfold3_ob0        # the kit, the CCD and the weights
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (openfold3_ob0_opt) and its shared core (opt_core) install editable on top
# and are not here.
#
# NOT `uv venv`, and this is not a style preference -- it is the openfold3
# provider's finding, and it applies here because the hook is the same shared
# core's. `uv venv` seeds `_virtualenv.pth`, which puts a class literally named
# `_Finder` on sys.meta_path, and `_Finder` is one of the names in the kit's
# HOOK_FINDER_CLASSES. The kit reads it as a rival kit hook and every mode
# refuses with "a kit hook is already installed in this process". The stdlib
# `venv` module run by the same uv-managed interpreter gives the same released
# CPython 3.11 without the hook.
#
# THREE DEVIATIONS from the kit's own environment/requirements.lock, all forced
# by linux-aarch64 and none of them a version change. They are the openfold3
# provider's three, re-verified against this kit's lock:
#
#  1. torch is pinned as `torch==2.10.0+cu128` against
#     `--extra-index-url https://download.pytorch.org/whl/cu128` rather than
#     the bare `torch==2.10.0` the kit writes. Same version, same CUDA build:
#     on x86-64 PyPI's torch 2.10.0 IS the +cu128 build, but PyPI's
#     linux-aarch64 wheel for 2.10.0 is `2.10.0+cpu` -- `torch.version.cuda`
#     is None and `get_arch_list()` is empty -- so the stack would install
#     perfectly and not drive the card. The aarch64 +cu128 wheel is published
#     on PyTorch's own index. It carries sm_80/sm_90/sm_100/sm_120, and an
#     sm_120 cubin runs on this box's sm_121.
#
#     The extra index is additive, so a handful of entries that exist on both
#     resolve from PyTorch's index rather than PyPI's: torch, triton,
#     cuda-python, Jinja2, MarkupSafe, colorama and the nvidia-*-cu12 runtime
#     wheels (which PyTorch's index links to pypi.nvidia.com). Same names, same
#     pinned versions.
#
#  2. Seven distributions of the kit's lock are omitted because they publish no
#     linux-aarch64 wheel at all: intel-cmplr-lib-ur, intel-openmp, mkl,
#     onemkl-license, tbb, tcmlib and umf. They are torch's Intel MKL/oneAPI
#     runtime on x86-64; the aarch64 torch wheel neither links against them nor
#     requires them. Without them removed the install stops at
#     `No matching distribution found for intel-cmplr-lib-ur==2026.0.0`.
#
#  3. `pip==24.0` appears here and not in the kit's lock, which subtracts the
#     interpreter's bundled pip. `tu remote setup` installs pip and wheel
#     first, so it is left in.
#
# Everything else is the kit's lock pin for pin: 108 of its 115 entries at the
# version it names. The kit's lock pins nothing by URL, so no name substitution
# was needed.
#
# `rdkit==2025.9.3` publishes a cp311 manylinux_2_28_aarch64 wheel; it is the
# one line of this file that differs from the openfold3 provider's lock besides
# `openfold3` itself, and it is the kit's own pin, not a downgrade chosen here.
--extra-index-url https://download.pytorch.org/whl/cu128
