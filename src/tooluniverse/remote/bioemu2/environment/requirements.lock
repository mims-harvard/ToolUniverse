# BioEmu-2's model environment — the exact stack the provider in
# ../provider.toml was installed and verified on, as
# `uv pip freeze --exclude-editable` of it with five prereleases corrected
# to their stable releases and one transitive dependency added.
#
# Python 3.12.13, torch 2.13.0+cu130, numpy 2.4.6. This stack coexists with
# none of the other providers' and none of ToolUniverse's, which is the whole
# reason for the two-environment split in STANDARD section 2.
#
# THE SECOND PROVIDER HERE WITH NOTHING EDITABLE ON TOP, after rfd4_proteina.
# There is no `anthropics/uplifting-biomolecular-modeling` kit for this model —
# upstream publishes the inference runtime itself — so this list is the whole
# environment rather than the base a kit is installed over.
#
# Rebuild (an NVIDIA driver the stack's CUDA build needs; no compiler. Every
# line below has an aarch64 wheel except `antlr4-python3-runtime`, which is
# published as an sdist at every version — it is pure Python, so setuptools
# builds it without a toolchain):
#
#   uv venv --seed --managed-python --python 3.12.13 ~/bioemu2-venv
#   export TOOLUNIVERSE_BIOEMU2_PYTHON=~/bioemu2-venv/bin/python
#   $TOOLUNIVERSE_BIOEMU2_PYTHON -m pip install --no-deps -r requirements.lock
#   tu remote setup bioemu2            # the checkpoint
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. It is
# load-bearing here for a second reason — see the prerelease note below.
#
# THREE THINGS A RESOLVER GETS WRONG HERE, recorded because each cost a run:
#
#  1. `bioemu2` is published only as `0.1.0rc0`, so any install of it needs
#     `--prerelease allow`. That flag is GLOBAL in uv, and with it the
#     resolver also takes prereleases of five packages that have perfectly
#     good stable releases: einops 0.9.0.dev0, hf-xet 1.8.0.dev0, hydra-core
#     1.4.0rc2, numba 0.68.1rc2 and omegaconf 2.4.1rc1. The first probe
#     environment here carried all five for no reason other than that flag.
#     The versions below are the stable ones, and `--no-deps` is what keeps a
#     resolver from reaching for the prereleases again.
#  2. `hydra-core` 1.3.7 declares `omegaconf<2.4`, so the stable pair is
#     1.3.7 + 2.3.0 and NOT 1.3.7 + 2.4.0. Taking the newest stable of each
#     independently produces a combination upstream's own metadata forbids.
#     Pinning omegaconf back to 2.3.0 then needs `antlr4-python3-runtime`
#     added BY HAND: 2.3.0 depends on it and 2.4.x dropped it, so under
#     `--no-deps` the downgrade silently leaves it out and every import of
#     hydra dies on `ModuleNotFoundError: No module named 'antlr4'`. That is
#     the cost of `--no-deps` and it is paid here rather than by a resolver.
#  3. The `cuda` extra's cuEquivariance packages are CUDA 13 builds, and the
#     ones that matter here (`cuequivariance-ops-cu13`,
#     `cuequivariance-ops-torch-cu13`) do publish aarch64 wheels —
#     `manylinux_2_26_aarch64` — so nothing is built from source. The GB10's
#     compute capability is covered by name: `cuobjdump --list-elf` on
#     `libcue_ops.so` reports an **sm_121a** cubin among sm_75 through sm_120.
#
# AND ONE THING THE PIN LOOKS LIKE A PROBLEM AND IS NOT. `bioemu2` requires
# `torch<2.14,>=2.11`, while every other provider on this card runs 2.14.x.
# PyPI's `torch==2.13.0` aarch64 wheel is a **+cu130** build whose arch list is
# sm_80, sm_90, sm_100, sm_110, sm_120 — it does not name sm_121 — and it
# drives this card anyway, through CUDA 13's family compatibility. That was
# measured (a 1024x1024 matmul on the device), not inferred, because the
# inference went the other way once before: see the aarch64-torch note that
# torch 2.5.1 reports `is_available True` and then raises "no kernel image is
# available" on the first device allocation.
