# ESM C -- protein language-model embeddings and masked-LM logits, held resident.
#
# The sixth provider on the standard and the second that answers with arrays
# rather than structure files (Enformer is the other). What it serves is one
# forward pass of ESM Cambrian over one protein sequence: the per-residue
# hidden states (the embedding) and the 64-way vocabulary logits.
#
# Two facts decided the shape of this provider.
#
# *The checkpoint is already on this machine.* ESMFold2 loads biohub/ESMC-6B as
# its language model, and its kit pins the SAME snapshot commit that this kit
# pins -- 45b0fa5d, with the same six shard digests. So [weights] points at the
# cache ESMFold2 already filled instead of fetching 25.4 GiB a second time. See
# [weights] for what a host without ESMFold2 does.
#
# *An embedding is a big array.* ESMC-6B's hidden size is 2560, so a
# per-residue matrix for a 300-residue protein is 768,000 floats. The MCP
# transport truncated Chai-1's oversized reply at exactly 100,000 characters,
# which produced invalid JSON rather than an honest refusal, so this provider's
# default reply is the mean-pooled vector and the full matrix is opt-in with an
# explicit residue bound (esmc_tool.py).
#
# MEASURED on the card named in `verified_on`, and running `off` rather than
# `exact` -- which is the one thing to understand about this provider before
# reading its numbers. Under `exact` the kit refuses to load at all here
# (flash-attn is not importable; see [kit]), and `off` costs 9.6 GiB of peak
# because the lever that goes with it, `pipe`, IS the device-side weight
# loader. So the derived reserve below was not wrong about `exact` -- it was
# measuring a mode this machine cannot run.

[provider]
slug = "esmc"
description = "ESM Cambrian protein language model: sequence embeddings and masked-LM logits"
operations = ["run_esmc_embed", "run_esmc_logits"]
status = "verified"
verified_on = """NVIDIA GB10 (aarch64, cc 12.1, 130.6 GB unified, driver
580.173.02), venv route, kit mode OFF -- stock ESM C, which is a supported mode
of this kit and not a workaround. The ESMC-6B snapshot is esmfold2's, the same
pin, so nothing was downloaded for this provider.

VERIFIED ON 4 CONSECUTIVE IDENTICAL REQUESTS IN ONE HELD WORKER, not on one
forward pass -- the standard's acceptance test since openfold3 passed a
one-request smoke and then could not answer a repeat. The 75-residue smoke,
four times, one worker held start to stop:

    build 141.7 s, then 0.69 / 0.076 / 0.074 / 0.074 s
    peak reserved 24.07 GiB, flat across all four

This is the most extreme residency case of the ten providers and the arithmetic
is worth stating: a per-request process would spend 141.7 s reading 23.7 GiB of
weights to do 0.076 s of work. Held, it does the 0.076 s. Nothing here is a
kernel optimisation; it is the difference between reading the model and not."""

[runtime]
mode = "resident"
worker = "resident/esmc_resident_worker.py"
launch = "tooluniverse.remote_resident.kit_launch:build_command"
# --variant is the kit's own rule, not ours. esmc_opt/stack.py refuses a second
# variant in the same process by name -- "one lever set per process" -- because
# the levers are resolved per variant (registry.levers_for). The variant also
# chooses the checkpoint, so it cannot come from the kit row; it is this
# worker's own argument. 6b is the size whose weights [weights] declares.
worker_args = ["--socket", "{socket}", "--slug", "{slug}", "--variant", "6b"]
# Eleven files, 25.4 GiB, read once per process. ESMFold2 measured ~25 s of
# start-up for the same checkpoint on this box; the ceiling is generous because
# a cold page cache reads all of it from disk.
start_timeout_s = 1800.0
request_timeout_s = 900.0
idle_timeout_s = 900.0
smoke = "smoke/input.txt"
smoke_timeout_s = 1800.0
# This provider writes no files, so there is nothing for [runtime] outputs to
# match. These are the keys a reply must carry for the smoke step to count as
# a model having run: the pooled embedding and the length it was taken over.
output_keys = ["mean_embedding", "sequence_length"]

[gpu]
policy = "required"
# MEASURED, and high for a reason this manifest has to state rather than let a
# scheduler discover: this provider runs `[kit] mode = "off"`, and the lever it
# gives up, `pipe`, is the kit's device-side weight loader. Stock ESM C stages
# the 25.4 GiB fp32 checkpoint before casting to bf16; the kit's loader does
# not. That is the whole of the 9.6 GiB gap between the derived reserve this
# line replaces (14.5, which was an honest estimate OF `exact`) and the 24.07
# measured here. If flash-attn is ever built for this card and `exact` becomes
# reachable, this number should drop by roughly that much -- re-measure, do not
# assume.
#
# Ladder, one held worker, steady state, one sequence per request:
#
#     residues   peak reserved
#          100      24.08 GiB
#          200      24.43 GiB
#          400      25.05 GiB
#          800      26.29 GiB
#         1600      28.75 GiB   <- the reference this budget declares
#
# NEARLY FLAT, exactly as predicted and for the predicted reason: 1600 residues
# costs 1.19x what 100 does, because the constant 6B parameter term dominates
# everything the input contributes. Contrast openfold3 (3.6x) and rosettafold3
# (3.7x), where an N^2 pair track dominates instead. A host can treat this
# provider as a fixed ~29 GiB tenant for any single sequence it is likely to
# see, which is unusual and useful.
#
# A host that switches to the 300m or 600m variant is in a completely different
# budget (0.6 / 1.1 GiB of parameters), must fetch those weights, and must
# re-measure rather than scale this number.
vram_budget_gb = 28.75
driver_min = 580
driver_min_reason = "its pinned stack is CUDA 13.0 (torch 2.11.0+cu130)"
shareable = true
isolation = "process"

[env]
kind = "venv"
python = "$TOOLUNIVERSE_ESMC_PYTHON"
lock = "environment/requirements.lock"
# esm and the Biohub transformers fork are what the kit's own pin check reads,
# at the versions stock/PINS.json names.
verify = "import torch, esm, transformers, esmc_opt; assert esm.__version__ == '3.4.0' and transformers.__version__ == '4.57.6'"

[weights]
# Hugging Face's own cache in its own layout, which is what upstream's resolver
# writes and reads: HF_HOME/hub/models--biohub--ESMC-6B/snapshots/<commit>/.
#
# THE DEFAULT IS ESMFOLD2'S CACHE, AND THAT IS DELIBERATE. This kit's
# stock/PINS.json pins biohub/ESMC-6B at snapshot 45b0fa5d7fb06faefbd5e3b89bdcef35d564e79a;
# so does esmfold2's, with byte-identical digests for all six shards. The
# 25.4 GiB is therefore already on a host that has ESMFold2 set up, and
# pointing at it costs nothing and downloads nothing. A host without ESMFold2
# sets HF_HOME wherever it likes and the fetch below fills it. The two
# providers share one variable because they want one directory; if that ever
# stops being true, the pins will differ and the digest check will say so.
root_env = "HF_HOME"
root_default = "~/.esmfold2"
# Upstream's own resolver -- the exact call the kit's downloader makes
# (opt/esmc_opt/weights.py: upstream_route -> esm.models.hub.resolve_model_dir,
# which runs huggingface_hub.snapshot_download for the repo's *.json and
# *.safetensors). No URL is restated in ToolUniverse. The kit's own
# `python -m esmc_opt.weights DIR VARIANT` is NOT used here because its DIR is
# the parent of the HF cache (it appends /hf), and HF_HOME is the variable the
# worker and every route actually read.
fetch = "HF_HUB_OFFLINE=0 {python} -c \"from esm.models.hub import resolve_model_dir; print(resolve_model_dir('biohub/ESMC-6B'))\""

# The eleven entries below are GENERATED from the kit's own stock/PINS.json
# "weights"["biohub/ESMC-6B"] by a script, not transcribed. The six shards
# carry a sha256 in PINS itself. The five .json files carry only a git
# blob_oid; for those the generator verified the blob_oid against the file on
# disk and emitted the sha256 it then read -- the same route ESMFold2's
# manifest took, and the five digests it produced match ESMFold2's line for
# line. README.md and images/contact_pal.png are in PINS but are NOT declared:
# resolve_model_dir fetches only *.json and *.safetensors, so declaring them
# would refuse a cache that upstream's own downloader had just filled
# correctly.
