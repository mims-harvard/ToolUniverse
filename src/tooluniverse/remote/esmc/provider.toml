[kit]
# No mode environment row: `modes.resolve(mode, variant, regime)` takes a
# required variant, so the probe's two shapes cannot call it -- and calling it
# correctly returns {mode, variant, regime, levers, levers_out} with no `env`
# key, so nothing is lost. Same shape as esmfold2.
env_row = "none"
env_row_reason = "modes.resolve(mode, variant, regime) returns no env key; a correct call would yield nothing either"
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "esmc"
# esmc/opt declares no dependency on common/ at all (opt/pyproject.toml:
# dependencies = []), so this kit needs only its own directory. The checkout is
# shared with every provider pinning this commit and the sparse set is the
# union of what its providers declare, so "common" is named here as the others
# name it.
sparse = ["esmc", "common"]
package = "esmc_opt"
# Activation is the common form -- the mode variable ESMC_OPT plus the kit's
# own esmc_opt_autoload.pth -- not boltz2's worker_launch. The variable's name
# is read off the kit by kit_launch's probe: _autoload.ENV = "ESMC_OPT". This
# kit's modes.py defines no ENV at all, so a probe that looked only there would
# have found nothing; nothing about the form is declared here.
#
# The modes are off | exact. THERE IS NO `fast` MODE FOR THIS MODEL and the
# kit says so in its README -- "no tier-2 composition". `exact` is two levers,
# pipe (device-side weight loading and an exact single-sequence tokenizer path)
# and fused (a fused residual+LayerNorm CUDA extension and a q/k-LayerNorm +
# rotary Triton kernel), and its outputs are byte-identical to stock.
# "off", not "exact", and the manifest's own paragraph below called this shot
# before the smoke ran. Under `exact` the kit refuses to load at all on this
# machine:
#
#   NOT ACTIVE: partial activation -- fused: PatchRefused: fused/_patch:
#   flash_attn is not importable (ModuleNotFoundError); r1 targets the
#   flash-attn (SDK) route; a mode is all of its levers: the load is refused
#
# flash-attn 2.7.4.post1 publishes no aarch64 wheel and predates this card. A
# single-architecture source build is running and, if it lands, `exact` becomes
# reachable and this line should go back -- the kit's speed claims are made for
# it. Until then `off` runs stock ESM C, which is a supported mode of this kit
# and not a workaround, and residency still holds the 6B model across requests,
# which is where most of this provider's cost is.
mode = "off"
# run.sh install does three things: pip install -e opt, the pin check
# (stock/check_pins.py), and one nvcc build of the fused residual+LayerNorm
# extension into ~/.cache/esmc_sdkfused for the visible GPU. No --weights here:
# the weights step owns that, and the kit's downloader wants a different root.
install = "bash run.sh install"
#
# WHAT HAS BEEN RUN HERE, AND WHAT IT IS AND IS NOT EVIDENCE FOR.
# `bash run.sh check --variant 6b --mode exact` on this GB10 exits 0 and prints
#
#   [esmc-opt] DRY-RUN mode=exact variant=6b regime=b1 levers=pipe,fused
#     levers_out=none esm=3.4.0 torch=2.11.0 flash_attn=None
#     transformer_engine=2.15.0 gpu=NVIDIA_GB10(sm121) package=0.4.0
#     drift=flash_attn:absent(pin_2.7.4.post1)
#
# so both levers of `exact` resolve on this card and none is out. The kit step
# also compiled the `fused` lever's CUDA extension here, natively rather than
# by PTX forward-compilation:
#
#   [residual_ln] extension torch2.11.0+cu130__cuda13.0__sm121__py3.12:
#     built from kernels.cu in 23.5s (cached at ~/.cache/esmc_sdkfused/...)
#
# THAT IS STILL A DRY RUN PLUS A COMPILE. It loads no model and launches no
# kernel, so it is not the smoke step and it is not evidence that the levers
# produce correct output on sm121 -- the Boltz-2 bring-up found a Triton
# kernel that compiled and then reported OutOfResources on this exact compute
# capability. levers_declined is therefore empty: nothing has declined, and
# nothing has succeeded either.
#
# A WARNING FOR WHOEVER RUNS THE SMOKE. This kit does not degrade: "a mode is
# all of its levers", and a lever of the mode that cannot be applied when the
# client is built makes ESMC.from_pretrained print
# `NOT ACTIVE: partial activation -- ...` and raise stack.PartialActivation
# (opt/esmc_opt/__init__.py). The `fused` lever needs the CUDA extension that
# run.sh install compiles for the visible card; the kit documents it as built
# "for sm80 and sm90" when no GPU is visible and for the visible GPU otherwise,
# and this card is sm_121, which nothing upstream has tried. If the smoke fails
# with a partial activation, set mode = "off" here -- the provider then runs
# stock ESM C, which is a supported mode of the kit and not a workaround -- and
# record which lever declined under levers_declined.
#
# The pin check exits 0 in this environment with one named drift: flash_attn
# absent (see the lock's DEVIATION 3). transformer_engine.pytorch DOES import
# here -- it was built from its sdist for sm_120 -- and the kit's own words
# for the remaining shortfall are "drift (named, not refused) ... a lever that
# needs it steps aside by name".
# `fused` is what took the whole mode down: it needs flash-attn, which is not
# importable here. `pipe` (device-side weight loading) had applied cleanly --
# the kit's own line read `levers_applied=pipe levers_fallback=fused` -- and is
# lost only because a mode is all of its levers.
levers_declined = ["fused"]
