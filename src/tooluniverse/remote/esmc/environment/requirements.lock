# ESM C's model environment -- the stack this provider was built against, as
# `pip freeze --all --exclude-editable` of it.
#
# Python 3.12.1, which is the interpreter version the kit's stock/PINS.json
# pins ("python": "3.12.1") and the one its own lock header describes
# (python-build-standalone 20240107). torch 2.11.0 from PyPI, which on this
# machine resolves to torch-2.11.0-cp312-cp312-manylinux_2_28_aarch64.whl and
# reports itself as 2.11.0+cu130 -- the CUDA 13.0 build the kit's pins name.
#
# The fifth distinct stack in this repository and it coexists with none of the
# others: ESM C pins torch 2.11.0+cu130 on Python 3.12.1 with numpy 2.5.2,
# ESMFold2 torch 2.13.0+cu130 on Python 3.12.10, Chai-1 torch 2.13.0+cu130 on
# Python 3.11.5, Boltz-2 torch 2.12.0+cu130 with numpy 1.26.4, Enformer torch
# 2.13.0 with numpy 2.4.6. One model, one environment, one socket each.
#
# CAN THE PINNED TORCH DRIVE THIS CARD? YES. Read off the installed build
# rather than inferred from the version:
#
#   torch 2.11.0+cu130  cuda 13.0
#   arch_list ['sm_80', 'sm_90', 'sm_100', 'sm_110', 'sm_120']
#   device NVIDIA GB10, capability (12, 1)
#
# sm_120 is binary compatible with sm_121, which is the rule
# remote_resident/setup.py's _check_torch_targets_this_gpu applies, so the
# environment step does not refuse torch_arch_unsupported here. The kit itself
# carries NO prebuilt host objects at all -- a scan of the whole esmc/
# subtree finds no .so, .a, .o, .cubin or .fatbin -- so kit_foreign_objects,
# which is what stops Enformer's kit on this architecture, cannot arise. Its
# one compiled piece, the fused residual+LayerNorm extension, is nvcc'd from
# kernels.cu by `run.sh install` for the card it sees.
#
# Rebuild (an NVIDIA driver >= 580, the CUDA 13.0 toolkit's nvcc on PATH, git,
# a C++ compiler; network for the index and for github.com):
#
#   uv venv --seed --managed-python --python 3.12.1 ~/esmc-venv
#   export TOOLUNIVERSE_ESMC_PYTHON=~/esmc-venv/bin/python
#   grep -v -E '^(#|flash_attn|transformer_engine_torch)' requirements.lock \
#       > /tmp/esmc-base.txt
#   $TOOLUNIVERSE_ESMC_PYTHON -m pip install --no-deps -r /tmp/esmc-base.txt
#   # then the two accelerator lines, from source -- see DEVIATION 2:
#   SPK=$(dirname $TOOLUNIVERSE_ESMC_PYTHON)/../lib/python3.12/site-packages
#   export CUDA_HOME=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH
#   export CPATH=$(find $SPK/nvidia -maxdepth 3 -type d -name include | tr '\n' :)
#   export LIBRARY_PATH=$(find $SPK/nvidia -maxdepth 3 -type d -name lib | tr '\n' :)
#   TORCH_CUDA_ARCH_LIST=12.0 MAX_JOBS=6 NVTE_FRAMEWORK=pytorch \
#       $TOOLUNIVERSE_ESMC_PYTHON -m pip install --no-build-isolation --no-deps \
#       transformer_engine_torch==2.15.0
#   cd <kit>/esmc && PATH=$(dirname $TOOLUNIVERSE_ESMC_PYTHON):$PATH \
#       bash run.sh install
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (esmc_opt) installs editable on top and is not here -- `--exclude-editable`
# leaves it out by construction.
#
# NOT `uv venv`? It IS uv venv here, and that was checked rather than assumed.
# uv seeds `_virtualenv.pth`, which puts a class named `_Finder` on
# sys.meta_path, and OpenFold3's kit reads any such name as a rival kit hook
# and refuses every mode. This kit has no such check: it scans no .pth file
# and inspects sys.meta_path only in its own `_OnImport` helper, which calls
# other finders rather than counting them (grep for HOOK_FINDER / meta_path in
# opt/esmc_opt/). The kit's own README route C uses `uv venv` too.
#
# DEVIATIONS from the kit's own esmc/environment/requirements.lock, which its
# header describes as the freeze of an x86-64 image. The two lock files were
# diffed line by line: 137 lines each, and 135 of the 137 are byte-identical
# -- IT IS NOT BYTE-IDENTICAL OVERALL, and these are the three differences.
#
# 1. TWO PINS ARE DIRECT x86-64 WHEEL URLS and cannot be installed on this
#    architecture at all:
#
#      flash_attn @ https://github.com/evolutionaryscale/wheels/releases/
#        download/py312-pt211-cu13-sm80-90/
#        flash_attn-2.7.4.post1-cp312-cp312-linux_x86_64.whl#sha256=94468e84...
#      transformer_engine_torch @ .../
#        transformer_engine_torch-2.15.0-cp312-cp312-linux_x86_64.whl#sha256=b8ad3d9a...
#
#    Both are substituted by NAME AND THE SAME VERSION, as the standard says
#    to. Neither version publishes a wheel of any kind on PyPI -- `pip
#    download --only-binary :all:` finds "no matching distribution" for both,
#    on x86-64 as well -- so by-name means the PyPI sdist, built here.
#
# 2. transformer_engine_torch==2.15.0 IS BUILT FROM ITS PyPI SDIST, for
#    compute capability 12.0 (TORCH_CUDA_ARCH_LIST=12.0; an sm_120 cubin runs
#    on this sm_121 card). Two things the sdist does not tell pip and that a
#    bare `pip install` therefore gets wrong: it needs cudnn.h and nccl.h,
#    which on this stack live inside the nvidia-* wheels rather than in
#    /usr/local/cuda, so CPATH and LIBRARY_PATH must name those wheels'
#    include/ and lib/ directories (the recipe above does). Without them the
#    build dies on `fatal error: cudnn.h: No such file or directory`, which
#    reads as a missing system package and is not one. A NOTE FOR WHOEVER
#    IMPORTS IT: `import transformer_engine.pytorch` fails on its own with
#    "undefined symbol: cublasLtGroupedMatrixLayoutInit_internal, version
#    libcublasLt.so.13" unless torch has been imported first -- torch is what
#    preloads the nvidia-cublas 13.6 wheel that carries that symbol. The
#    resident worker imports torch before esm, so this is a fact about
#    hand-running things, not about the provider.
#
# 3. FLASH-ATTENTION IS ABSENT, and its absence is named rather than hidden.
#    flash_attn 2.7.4.post1 predates CUDA 13 and predates this card; its
#    setup.py will emit an sm_120 cubin (the `arch=compute_120,code=sm_120`
#    branch, gated on CUDA >= 12.8, and 13.0 satisfies it) but upstream's own
#    prebuilt wheel is tagged sm80-90 and nothing upstream has run 2.7.x on
#    Blackwell. A FROM-SDIST BUILD WAS ATTEMPTED HERE AND ABANDONED. It
#    compiles: no error appeared in 45 minutes. It does not finish in a usable
#    time on this box, because flash-attn's setup.py ignores
#    TORCH_CUDA_ARCH_LIST and reads its own FLASH_ATTN_CUDA_ARCHS, which
#    defaults to "80;90;100;120" -- so every one of its ~84 translation units
#    was being built four times over, forward and backward kernels alike. At
#    MAX_JOBS=12 it had produced 5 of them; that is roughly twelve hours, on a
#    machine shared with other work. To finish it, narrow the arch list:
#
#      FLASH_ATTN_CUDA_ARCHS=120 MAX_JOBS=12 FLASH_ATTENTION_FORCE_BUILD=TRUE \
#        $TOOLUNIVERSE_ESMC_PYTHON -m pip install --no-build-isolation \
#        --no-deps flash_attn==2.7.4.post1
#
#    and add the resulting `flash_attn==2.7.4.post1` line to this file.
#    WHAT ITS ABSENCE COSTS, in the kit's own words rather than mine.
#    `stock/check_pins.py` exits 0 and prints
#      check_pins: drift (named, not refused): flash_attn: import fails on this
#        stack ... a lever that needs it steps aside by name
#    and esm degrades by design: `EsmcForMaskedLM.__init__` computes
#    `_use_flash_attn = on_cuda and FLASH_ATTN_INSTALLED and ...`
#    (esm/models/esmc/model.py:286-291), so the attention path becomes
#    F.scaled_dot_product_attention and the RoPE path becomes pure torch.
#    esm's own kernels.py quantifies the numerical difference: "~1 bf16 ULP
#    per attention block; compounded across the 80-block stack this reaches
#    ~O(100) max-diff on the unnormalized residual stream", with perplexity
#    within rounding noise. THE KIT'S `exact` MODE CLAIMS BYTE-IDENTICAL
#    OUTPUTS AGAINST STOCK ON THE SAME STACK, which still holds -- both sides
#    of that comparison run without flash-attention here -- but this stack is
#    not the stack the kit's numbers were taken on, which was an H100.
#
# 4. pip==26.2.1 IS HERE AND IS NOT IN THE KIT'S LOCK. The kit's header says
#    it excludes "the interpreter's bundled pip 23.3.2"; `uv venv --seed`
#    installs its own, and --exclude-editable does not drop it. It is listed
#    because this file is a freeze and pip is in the environment.
#
# 5. The kit's lock names three git URLs -- dockq, esm and the Biohub
#    transformers fork. Those are architecture-neutral and are reproduced
#    below exactly; both esm 3.4.0 and transformers 4.57.6 installed from
#    their pinned commits and the kit's own pin check confirms the commits.
