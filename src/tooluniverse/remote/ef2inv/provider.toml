[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "ef2inv"
# The checkout is shared with every provider pinning this commit; the sparse
# set is the union of what its providers declare.
sparse = ["ef2inv", "common"]
package = "ef2inv_opt"
# THIS KIT KEEPS NO MODE ENVIRONMENT ROW, and it is a fact about the kit rather
# than a gap in the probe. `modes.resolve(name)` takes one argument and returns
# a frozen `modes.Mode` dataclass -- name, kit_switch, levers, numerics_class,
# tier, what, and four model-switch fields -- with neither `env` nor `exports`
# anywhere on it. That is a FIFTH resolve() shape for the record: boltz2's
# returns a mapping with `env`, openfold3's a Resolution with `exports`,
# esmfold2's a Resolution with neither, boltzgen applies its row to itself, and
# this one returns a lever table. Its deployment variables live in
# `configs/<card>.env`, shipped for h100, h200 and a100 and not for this card,
# so there is nothing to read even with the right call. What the provider
# therefore supplies itself is in launch.py and listed at the end of this file.
env_row = "none"
env_row_reason = "modes.resolve(name) returns a frozen modes.Mode lever table with neither env nor exports; this kit's deployment variables live in configs/<card>.env and it ships none for a GB10"
# `fast` is the kit's own DEFAULT_MODE and the composition its speed claims are
# made for: the exact lever set plus the tier-2 Triton / CUDA kernels for the
# pair trunk's triangle multiplication, transition and LayerNorm backward UNDER
# GRAD, a bf16 confidence head, and the memory plan that fills the card.
# `exact` is bit-identical to stock under `--det 1` and is the mode to pick when
# outputs must not move. `big` is `fast` at the memory floor. `off` runs the
# upstream cookbook file unchanged -- and unlike rosettafold3, `off` IS
# reachable from this provider: the kit patches nothing on disk, so this one
# interpreter serves every mode. What `off` would need is a worker started with
# `--mode off`, which skips fastkit.install and runs the recipe as shipped.
mode = "fast"
# Two steps in one line, and the first is not the kit's own -- it is the kit's
# route C, which needs the upstream recipe before the pin check can pass.
#
# stock esm 3.4.0 is an EDITABLE git checkout, not a wheel: the cookbook file
# this whole provider runs ships in the repository
# (`<esm package dir>/../cookbook/tutorials/binder_design.py`) and
# `stock/check_pins.py` resolves it through PEP 610 direct_url.json
# `dir_info.editable`, refusing anything else. So the install step clones
# github.com/Biohub/esm at stock/PINS.json `upstream.commit` (d0207ea3) and
# installs it editable, into TOOLUNIVERSE_EF2INV_ESM or
# ~/.cache/tooluniverse/ef2inv/esm. It is idempotent: an existing checkout is
# checked out to the pin again and reinstalled in place.
#
# `bash run.sh install` is then the kit's usual step -- the shared core and the
# kit installed editable into the python on PATH, then
# `stock/check_pins.py --checks software`, which refuses by name (exit 3) if
# esm is not that editable checkout, if transformers is not the fork at
# ef32577f, or if any of the ten pinned fork modelling files differs. No
# `--weights` here: the weights step is the weights step's job.
install = "ESM_DIR=\"$TOOLUNIVERSE_EF2INV_ESM\"; test -n \"$ESM_DIR\" || ESM_DIR=\"$HOME/.cache/tooluniverse/ef2inv/esm\"; test -d \"$ESM_DIR/.git\" || git clone https://github.com/Biohub/esm \"$ESM_DIR\" && git -C \"$ESM_DIR\" checkout -q d0207ea3c8cbf072679ece3bb332787d25e06852 && {python} -m pip install -q --no-deps -e \"$ESM_DIR\" && bash run.sh install"
# NOTHING IS DECLINED AND NOTHING IS SWITCHED OFF, and that is a statement
# about this kit's failure style rather than about this card.
#
# Four of `fast`'s levers cannot serve on compute capability 12.1 and all four
# say so themselves, by name, with the stock path serving in their place and
# the run completing (exit 0). They are ASIDES in the kit's vocabulary, not
# refusals, and `levers_off` would be the wrong instrument:
#   * ef2_t16_transition -- its forward is a prebuilt sm_90a cubin
#     (k/ef2_t16/sm_90a/ef2_transition_cute.cubin, the kit's ONE prebuilt
#     object and a CUDA ELF rather than a host one, so `kit_foreign_objects`
#     has nothing to refuse). `fastkit.enable` records a card it cannot serve
#     and K-D3's own forward serves.
#   * ef2_esmc_hoist -- installs only on a compute capability in its own
#     PROVEN_CC set, because it needs row-count invariant GEMMs from
#     TransformerEngine; elsewhere `stepped_aside=cc_unproven:sm_<cc>`.
#   * ef2_kd3_gemmswiglu -- its launch table carries one tile entry per
#     compute capability and none for this one (`cc_untuned:sm_<cc>`).
#   * ef2_trimul_nosave -- picks the first kernel row the stack serves and
#     names the reason when no row serves.
# Whether that is exactly what happens here is the kit's `check` verb's
# answer, which needs the weights in place; it is a dry run that loads no
# model. Fill the list from its LEVER lines rather than from this comment.
#
# `MODEL_OPT_LEVERS_OFF` DOES reach this kit, unlike boltzgen's: the launcher
# documents it as a kit arm's second allowed variable, `fastkit.install`
# resolves it once per process by name, and an unknown or foreign lever name is
# a LeversOffError rather than a silent no-op. So the door is open if a lever
# ever has to be closed.
levers_declined = []
levers_off = []

# Settings this provider states for the kit, applied before the process starts.
# EMPTY on purpose. Two knobs were considered and rejected:
#   * EF2_FAST_KIT_CKPT would override the checkpoint policy and make `fast`'s
#     memory bounded -- but `evidence.collect_after` checks the installed
#     composition word for word against `fastkit.COMPOSITION` and a composition
#     that is not the kit's is a REFUSAL, so the bounded mode is `big`, by
#     name, not `fast` with a knob.
#   * EF2INV_REQUIRE_FAST_ENV is a CLI-side variable the launcher never passes
#     into an arm, and `EF2INV_` is a forbidden prefix in an arm process
#     anyway. The worker passes the same intent as `--require-fast-env`, off by
#     default: with flash-attn and TransformerEngine absent (see the lock) it
#     would word a difference on one info line and change nothing.
[kit.env]

# What a run of this kit normally gets from `configs/<card>.env`, which is not
# shipped for this card, and where each piece comes from here instead:
#   * HF_HOME                  -- launch.py, from [weights] root_env
#   * HF_HUB_OFFLINE,
#     TRANSFORMERS_OFFLINE     -- launch.py sets both: nothing is fetched at
#                                 run time, which is the configs' own policy
#   * PYTHONDONTWRITEBYTECODE  -- launch.py, as the kit's own arm_env does
#   * EF2_FAST_KIT             -- launch.py, from [kit] mode; the arm's one
#                                 allowed variable
#   * PYTORCH_CUDA_ALLOC_CONF  -- launch.py sets expandable_segments:True
#                                 exactly as the kit's launch.KIT_ALLOCATOR
#                                 does for a kit arm, and only when the
#                                 operator has not set it
#   * MODEL_OPT                -- launch.py, the kit tree
#   * MODEL_OPT_JIT_ROOT,
#     TRITON_CACHE_DIR,
#     TORCHINDUCTOR_CACHE_DIR  -- launch.py keys the Triton and Inductor caches
#                                 under <jit root>/<stack key>/ the way
#                                 configs/h100.env does, so a worker restart
#                                 does not recompile. The stack key is read
#                                 from the kit (modes.jit_cache_key()).
#   * EF2INV_GPU, EF2INV_GPU_MIB -- NOT set, and cannot be: `EF2INV_` is a
#                                 forbidden prefix in an arm process. The
#                                 kit's hardware check is CLI-side; an arm
#                                 words any card on one NOTE line and runs.
