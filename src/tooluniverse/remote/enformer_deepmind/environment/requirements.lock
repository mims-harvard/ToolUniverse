# enformer_deepmind — the official DeepMind Enformer TF-Hub SavedModel.
#
# THIS LOCK HAS NO DEVIATION, which is a first on this standard. Every pin of
# the kit's own environment/requirements.lock that this provider installs is
# installed AT THAT VERSION, byte for byte: 41 of 53. The other 12 are the
# `nvidia-*-cu12` CUDA runtime wheels, which TensorFlow declares under its
# `and-cuda` extra and a CPU TensorFlow loads none of; 10 of the 12 do publish
# aarch64 wheels, so they are omitted because they are unused here, not because
# they are unavailable.
#
# Counted by comparing this file against the kit's, not asserted:
#   byte-identical 41 · differing 0 · not installed 12 (all nvidia-*-cu12)
#
# One thing the index cannot tell you and this file can. At `tensorflow==2.15.1`
# the aarch64 wheel on PyPI carries NO CODE -- a RECORD of 6 dist-info lines and
# `Requires-Dist: tensorflow-cpu-aws ==2.15.1 ; platform_machine == "aarch64"`,
# so `--no-deps` installs a package that cannot be imported. At 2.17.1, the
# version pinned here, the aarch64 wheel is the real library (13,509 RECORD
# lines) and is installed as pinned. Check the wheel's contents, not its
# existence.
#
# Python 3.11 (the kit's `python` pin). Install with --no-deps: the set is the
# kit's own resolved closure.
