# AlphaProtein Novo -- the model environment, frozen from a working install.
#
# PROVENANCE: resolved with `uv pip compile` from upstream's own pyproject.toml
# at commit e7ce276cb4a1f68c2ba7d5aa793192cfcb4845c8 for CPython 3.12 on
# aarch64 (72 packages, 13 of them nvidia-*-cu12 at CUDA 12.9.x with cuDNN
# 9.27.0.42), then installed --no-deps into a venv verified to drive this
# card (jax.default_backend() == "gpu", CudaDevice NVIDIA GB10, cc 12.1).
#
# TWO THINGS TO KNOW BEFORE INSTALLING THIS.
#
# 1. `alphafold3` is a git dependency with a C++ extension, and its build
#    fetches Eigen from gitlab.com DURING the build. A first attempt here
#    failed three retries with "GitLab is currently unable to handle this
#    request"; an unchanged retry succeeded. Retry before diagnosing.
#    (Constraining cmake<4 was tried first and changed nothing -- the
#    deprecated-FetchContent_Populate theory was wrong.)
#
# 2. Pinning by version, not by URL: none of the 13 nvidia-*-cu12 wheels is
#    named by an x86-64 direct link, which is why this kit installs natively on
#    aarch64 where about twenty of the surveyed kits do not.
#
# `alphaprotein_novo` itself is NOT listed: it is installed from the pinned
# upstream checkout that [kit] names, editable, by the kit step.
