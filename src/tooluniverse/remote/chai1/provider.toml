[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "chai1"
sparse = ["chai1", "common"]
package = "chai1_opt"
mode = "fast"
install = "bash run.sh install --weights {weights_root}"
# The kit replaces chai1.load_exported with its own loader, and refuses to
# activate if anything else has replaced it first (stack.py's check). So the
# worker must not memoise that function itself while the kit is on -- the kit
# is what holds the modules between folds.
levers_declined = []
# The one lever this provider asks the kit not to attempt, and the reason is a
# race it cannot win rather than a preference. `alloc` exports
# PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True, and opt_core checks "CUDA
# already initialised in this process" BEFORE it checks "the variable already
# holds exactly this value" (mem/torch_alloc.py export(), lines 153-163). The
# kit's trigger is `chai_lab.chai1`, whose own module body initialises CUDA, so
# by the time the lever runs the answer is always yes and one opt-in refusal
# takes the whole mode to NOT ACTIVE.
#
# Nothing is lost by turning it off: kit_launch puts the variable in the
# environment before the process starts, which is what the policy needs, and
# the kit's own EXIT line then reads `alloc_effective=true
# alloc_source=snapshot`. What changes is the bookkeeping, and the kit records
# the run as PARTIAL, which is accurate.
levers_off = ["alloc"]
