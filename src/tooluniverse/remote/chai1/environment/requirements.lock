# Chai-1's model environment — the exact stack the measurements in
# ../provider.toml were taken on, as `pip freeze --all` of it.
#
# The third distinct stack in this repository and it coexists with neither of
# the others: Chai-1 pins torch 2.13.0+cu130 on Python 3.11.5, Boltz-2 pins
# torch 2.12.0+cu130, Enformer torch 2.13.0 with numpy 2.4.6. One model, one
# environment, one socket each.
#
# Worth knowing: the kit installs this stack deliberately outside the range
# chai_lab itself declares (`torch<2.7,>=2.3.1`), and says so on its own install
# line -- `torch 2.13.0+cu130: declared range torch<2.7,>=2.3.1 -> False`. That
# is the kit's choice, stated rather than hidden, and it is why the pin check
# passes anyway: the pin is the installed chai_lab tree, not what its metadata
# asks for.
#
# Rebuild (Python 3.11, an NVIDIA driver the stack's CUDA build needs, a C
# compiler on PATH):
#
#   uv venv --seed --managed-python --python 3.11.5 ~/chai1-venv
#   . ~/chai1-venv/bin/activate
#   python -m pip install --no-deps -r requirements.lock
#   bash <kit>/chai1/run.sh install --weights ~/.chai
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (chai1_opt) and its shared core install editable on top and are not here.
