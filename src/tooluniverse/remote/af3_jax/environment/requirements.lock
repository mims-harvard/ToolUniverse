# by scripts/genlock (see provider.toml [env]); 81 packages, installed --no-deps.
#
# ONE DEVIATION from the kit's lock, and it is a substitution of the same
# version and the same build flavour:
#
#   torch 2.7.1+cpu -- the kit's line names PyTorch's own x86-64 wheel by URL
#   and sha256. This host is aarch64. The line below names the aarch64 file of
#   the same version on the same index (download.pytorch.org/whl/cpu), with its
#   own sha256 read from that index. Same release, same CPU-only flavour, other
#   architecture. This is STANDARD.md section 16's "a lock can pin an
#   architecture by URL", and the kit's own STOCK.md Stack section says the
#   pinned recipe is for "Linux x86-64", so the deviation is expected rather
#   than surprising.
#
#   torch is in this list only because the kit's weights converter imports it
#   (requirements.lock header: "the weights converter's only extra") and
#   because stock/check_pins.py lists `torch` in check_packages, where a MISSING
#   package is PINS NOT MET (exit 3) while another version is only PINS drift.
#   Nothing in this provider's prediction path imports torch.
#
# EVERYTHING ELSE IS THE KIT'S PIN, UNCHANGED, and every one of them publishes
# an aarch64 wheel at that exact version -- checked against PyPI before
# installing, not discovered during it: jax / jaxlib / jax-cuda12-plugin /
# jax-cuda12-pjrt 0.10.2 (manylinux_2_27_aarch64), every nvidia-*-cu12
# (CUDA 12.9.x, cuDNN 9.17.1.4), rdkit 2025.9.4, gemmi 0.7.3, numpy 2.4.1,
