# OpenFold3's model environment — `pip freeze --all --exclude-editable` of the
# interpreter this provider's [env] python names, on Python 3.11.12
# (uv-managed CPython), linux-aarch64.
#
# The fourth distinct stack in this repository and it coexists with none of the
# others: OpenFold3 pins torch 2.10.0+cu128 / triton 3.6.0 / numpy 2.4.6, where
# Boltz-2 pins torch 2.12.0+cu130 and Chai-1 and Enformer torch 2.13.0+cu130.
# One model, one environment, one socket each.
#
# Rebuild (an NVIDIA driver that runs CUDA 12.8 — 570 or newer — and a C
# compiler on PATH for Triton and for the FlashPairformer extension the kit
# builds at first use):
#
#   uv python install 3.11
#   "$(uv python find --managed-python 3.11)" -m venv ~/openfold3-venv
#   ~/openfold3-venv/bin/python -m pip install --no-deps -r requirements.lock
#   export TOOLUNIVERSE_OPENFOLD3_PYTHON=~/openfold3-venv/bin/python
#   tu remote setup openfold3            # the kit and the weights
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (openfold3_opt) and its shared core (opt_core) install editable on top and
# are not here.
#
# NOT `uv venv`, and this one is not a style preference. `uv venv` seeds
# `_virtualenv.pth`, which puts a class literally named `_Finder` on
# sys.meta_path — and `_Finder` is one of the four names in the kit's
# HOOK_FINDER_CLASSES (openfold3/opt/openfold3_opt/env.py:22). The kit then
# reads it as a rival kit hook and every mode refuses:
#
#   a kit hook is already installed in this process (_Finder on sys.meta_path:
#   the kit's own PYTHONPATH route); one route per process
#
# The kit's own STOCK.md says so in its Stack recipe, and the stdlib `venv`
# module run by a uv-managed interpreter gives the same released CPython 3.11
# without the hook. The other three providers use `uv venv` and are unaffected;
# this one cannot.
#
# THREE DEVIATIONS from the kit's own environment/requirements.lock, all forced
# by linux-aarch64 and none of them a version change:
#
#  1. torch is pinned as `torch==2.10.0+cu128` against
#     `--extra-index-url https://download.pytorch.org/whl/cu128` rather than
#     the bare `torch==2.10.0` the kit writes. Same version, same CUDA build:
#     on x86-64 PyPI's own torch 2.10.0 IS the +cu128 build, but PyPI's
#     linux-aarch64 wheel for 2.10.0 is `2.10.0+cpu` — it reports
#     `torch.version.cuda = None` and an empty `get_arch_list()`, so the stack
#     installs perfectly and cannot drive the card. The aarch64 +cu128 wheel is
#     published on PyTorch's own index; nothing else changes. It carries
#     sm_80/sm_90/sm_100/sm_120, and an sm_120 cubin runs on this box's sm_121.
#
#     The extra index is additive and pip prefers no index over another, so a
#     handful of entries that exist on both resolve from PyTorch's rather than
#     PyPI's: on a rebuild here that was torch, triton, cuda-python, Jinja2,
#     MarkupSafe, colorama and the fifteen nvidia-*-cu12 runtime wheels (which
#     PyTorch's index links to pypi.nvidia.com, NVIDIA's own). Same names, same
#     pinned versions; what a version pin guarantees is unaffected, and it is
#     written down here rather than left to be discovered.
#
#  2. Seven distributions of the kit's lock are omitted because they publish no
#     linux-aarch64 wheel at all: intel-cmplr-lib-ur, intel-openmp, mkl,
#     onemkl-license, tbb, tcmlib and umf. They are torch's Intel MKL/oneAPI
#     runtime on x86-64; the aarch64 torch wheel does not link against them and
#     does not require them. Without them removed the install stops at
#     `No matching distribution found for intel-cmplr-lib-ur==2026.0.0`.
#
#  3. `pip==24.0` appears here and not in the kit's lock, which subtracts the
#     interpreter's bundled pip. `--all` keeps it and `tu remote setup`
#     installs pip and wheel first, so it is left in.
#
# Everything else is the kit's lock pin for pin: 108 of its 115 entries at the
# version it names. The kit's lock pins nothing by URL, so no name substitution
# was needed.
--extra-index-url https://download.pytorch.org/whl/cu128
