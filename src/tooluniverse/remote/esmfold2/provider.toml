[kit]
# This kit keeps NO mode environment row, and that is a fact about the kit
# rather than a gap in the probe: `modes.resolve(mode, variant, kit_home)`
# returns a Resolution with no `env` and no `exports` attribute at all. Its
# deployment variables live in `configs/<card>.env`, shipped for h100, h200 and
# a100 and not for this one, so there is nothing here to read even with the
# right call. What the provider therefore supplies itself is listed below.
env_row = "none"
env_row_reason = "modes.resolve(mode, variant, kit_home) returns a Resolution with neither env nor exports; the kit's variables live in configs/<card>.env and it ships none for GB10"
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "esmfold2"
# The checkout is shared with every provider pinning this commit; the sparse
# set is the union of what its providers declare.
sparse = ["esmfold2", "common"]
package = "esmfold2_opt"
# Activation is the common form -- the mode variable ESMFOLD2_OPT plus the
# kit's own esmfold2_opt_autoload.pth -- not boltz2's worker_launch. The
# variable's name is read off the kit (_autoload.ENV; this kit's modes module
# defines no ENV), never guessed from the slug. kit_launch detects which form
# the kit uses; nothing about it is declared here.
mode = "fast"
# run.sh install installs the shared core and the kit editable, runs the pin
# check and verifies the shipped cubin manifest. Weights are the weights step's
# job, so no --weights here.
install = "bash run.sh install"
# Declined on THIS card, by the kit's own name for it. `bash run.sh check
# --variant fast --mode fast` on the GB10 exits 0 and prints
#   DRY-RUN mode=fast variant=fast server_mode=opt14_msa gpu=NVIDIA GB10(sm121)
#   levers=fused,t3,t5,t10,tx,ax,af,fz,tg,sg,eg,ec,fc,pb,ls,rg,t15,xln,ro,kd,
#          dit,x2b,x3,x6,x7,x8,x10
#   not_for_variant=msa,m15,m16,m17,mh,t15msa  not_for_class=t16
#   kernel_key=12.1|3.7  flash_attn=2.8.3.post1
#   transformer_engine=2.15.0+42b8400  xformers=0.0.35+03b91d7.d20260904
# so 27 levers resolve here and one, t16, declines by class: it is a
# compute-capability-9.0 kernel (the kit ships its cubins for sm_90a only) and
# the portable statement serves in its place. The six `not_for_variant` names
# are the MSA levers, absent because [runtime] worker_args picks --variant fast
# (ESMFold2-Fast has no MSA module), not because of the card.
#
# That is a DRY RUN: it loads no model, so it is not the smoke step. The smoke
# has since run on the same card and its numbers are in `verified_on`.
levers_declined = ["t16"]
#
# THIS KIT HAS NO MODE ENVIRONMENT ROW, and that is a fact about the kit rather
# than a gap in the probe. kit_launch reads `modes.resolve(mode)["env"]` where a
# kit keeps one; here `resolve` takes (mode, variant, kit_home) and returns a
# `Resolution` object with no `env` attribute at all, so the probe records a
# row_error and applies nothing. Nothing is lost by that: what a run of this kit
# normally gets from the environment is configs/<card>.env, which `run.sh
# --config` sources and which the kit ships only for h100, h200 and a100. There
# is no config for a GB10, so this provider supplies the pieces itself:
#   * HF_HOME        - kit_launch exports it from [weights] root_env;
#   * MODEL_OPT_STACK_KEY - the probe reads it from the kit
#                      (torch2.13.0-cu130-sm121 on this box);
#   * HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE - the worker sets both, because
#                      run.sh would have and the worker is not run through it;
#   * ESMCFOLD_CCD_PATH - the kit derives it from HF_HOME when unset;
#   * ESMFOLD2_VARIANT - the worker sets it from --variant before the trigger
#                      import, which is when the kit reads it;
#   * TRITON_CACHE_DIR - NOT set. The configs point it inside MODEL_OPT_JIT_ROOT;
#                      here Triton uses its own default cache directory, so a
#                      worker restart recompiles kernels that a card config
#                      would have kept.
#   * ESMFOLD2_OPT_REQUIRE_FAST_ENV - NOT set, so it is off. Every shipped
#                      config sets it to 1, which makes every route refuse
#                      (exit 3) unless flash-attn and TransformerEngine are
#                      live. Both are installed with their kernels here (see
#                      the lock's deviations), so the switch would be a guard
#                      rather than a blocker -- set it to 1 once the smoke step
#                      has shown the accelerated words on this card.
