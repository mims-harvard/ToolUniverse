# ESMFold2 — protein complex structure prediction from sequence, held resident.
#
# The fourth provider on the standard and the largest: the three pinned
# snapshots are 25.6 GiB in sixteen files, and every variant loads the 6B-
# parameter ESMC language model beside its folding trunk. The kit's own README
# measures roughly 25 s of start-up per process in EVERY mode -- interpreter,
# checkpoint load and digest -- which a per-request process pays on every call
# and a held worker pays once. Its `exact` and `fast` modes additionally
# capture CUDA graphs of the trunk, the encoders and the sampler, and a graph
# captured on one request is only collectable by a process that survives to the
# next.
#
# Every number below was measured on the card named in `verified_on`. Holding
# this one costs more than the other five put together -- 25.6 GiB of weights,
# 14.2 GiB resident -- and buys the largest relative saving: a fold of the
# smoke drops from 2.7 s to 1.1 s once the weights are read, and they are read
# once per process rather than once per request.

[provider]
slug = "esmfold2"
description = "ESMFold2 protein complex structure prediction from sequence (mmCIF + pLDDT/PAE)"
operations = ["esmfold2_fold"]
status = "verified"
verified_on = """NVIDIA GB10 (aarch64, cc 12.1, 130.6 GB unified, driver 580.173.02),
venv route, kit mode fast, variant fast. Three folds of the 89-residue smoke in
one held worker: 2.7 s, 1.1 s, 1.1 s after a 6.2 s build -- the 25.6 GiB of
weights are read once. The VRAM ladder under [gpu] was measured in one further
held worker on the same card."""

[runtime]
mode = "resident"
worker = "resident/esmfold2_resident_worker.py"
launch = "tooluniverse.remote_resident.kit_launch:build_command"
# --variant is the kit's own rule, not ours: one variant per process, never
# two. `fast` is ESMFold2-Fast (24-layer trunk, no MSA module); full_msa /
# full_nomsa load ESMFold2 with / without MSAs from the other snapshot.
worker_args = ["--socket", "{socket}", "--slug", "{slug}", "--variant", "fast"]
# Sixteen files, 25.6 GiB, and the 6B language model among them.
start_timeout_s = 1800.0
request_timeout_s = 3600.0
# What a run that actually worked leaves behind; the smoke step refuses if no
# file matched.
outputs = ["*.cif"]
idle_timeout_s = 900.0
smoke = "smoke/input.json"
smoke_timeout_s = 3600.0

[gpu]
policy = "required"
# MEASURED. The derived estimate this line replaced -- ESMC-6B at bf16
# (~11.8 GiB) plus the Fast trunk plus one small input -- came to 16 GiB and
# was close: 89 residues costs 14.02 GiB on the first request and 14.21 GiB
# steady. Almost all of that is the 6B language model, which is why this
# provider is the most expensive of the six to hold and the flattest in
# length. Ladder, one held worker, steady state, single chain:
#
#     residues   peak reserved
#           89      14.21 GiB   (the smoke)
#          100      14.14 GiB
#          200      15.07 GiB
#          400      17.70 GiB
#          800      25.28 GiB   <- the reference this budget declares
#
# 800 residues costs 1.8x what 100 does, against openfold3's 2.9x, because the
# constant ESMC term dominates. A host that will not fold past ~200 residues
# can hold this provider in 16 GiB; one that accepts long chains budgets the
# figure below and re-measures past 800.
vram_budget_gb = 25.28
driver_min = 580
driver_min_reason = "its pinned stack is CUDA 13.0 (torch 2.13.0+cu130)"
shareable = true
isolation = "process"

[env]
kind = "venv"
python = "$TOOLUNIVERSE_ESMFOLD2_PYTHON"
lock = "environment/requirements.lock"
verify = "import torch, esm, transformers, esmfold2_opt; assert esm.__version__ == '3.3.0' and transformers.__version__ == '4.57.6'"

[weights]
# Hugging Face's own cache in its own layout, which is what the kit's
# weights.py writes and what upstream reads offline: HF_HOME/hub/models--<org>--<name>/
# snapshots/<commit>/<file>, at the snapshot commits stock/PINS.json pins.
root_env = "HF_HOME"
root_default = "~/.esmfold2"
# The kit's own downloader (opt/esmfold2_opt/weights.py, which run.sh install
# --weights calls and which documents itself as `python -m esmfold2_opt.weights
# DIR`). It goes through huggingface_hub at the pinned commits and checks every
# sha256 itself. No URL is restated in ToolUniverse. run.sh is not used here
# because the weights step, unlike the kit step, does not put the model
# environment's bin on PATH -- {python} is how that environment is named.
fetch = "{python} -m esmfold2_opt.weights {weights_root}"

# The sixteen entries below are generated from the kit's own stock/PINS.json
# "weights" (three repositories), not transcribed.
