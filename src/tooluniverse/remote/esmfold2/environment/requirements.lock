# ESMFold2's model environment -- the stack this provider was built against, as
# `pip freeze --all --exclude-editable` of it.
#
# The fourth distinct stack in this repository and it coexists with none of the
# others: ESMFold2 pins torch 2.13.0+cu130 on Python 3.12.10 with numpy 2.3.5,
# Chai-1 torch 2.13.0+cu130 on Python 3.11.5, Boltz-2 torch 2.12.0+cu130 with
# numpy 1.26.4, Enformer torch 2.13.0 with numpy 2.4.6. One model, one
# environment, one socket each.
#
# Rebuild (Python 3.12.10, an NVIDIA driver >= 580, the CUDA 13.0 toolkit's
# nvcc on PATH, git and a C++ compiler -- three CUDA extensions are compiled
# from source; network for the index and for github.com):
#
#   uv venv --seed --managed-python --python 3.12.10 ~/esmfold2-venv
#   export TOOLUNIVERSE_ESMFOLD2_PYTHON=~/esmfold2-venv/bin/python
#   grep -E '^pip==' requirements.lock | xargs $TOOLUNIVERSE_ESMFOLD2_PYTHON -m pip install --no-deps
#   grep -v -E '^(#|(flash_attn|transformer_engine|xformers)==)' requirements.lock > /tmp/ef2.txt
#   $TOOLUNIVERSE_ESMFOLD2_PYTHON -m pip install --no-deps -r /tmp/ef2.txt
#   cd <kit>/esmfold2 && PATH=$(dirname $TOOLUNIVERSE_ESMFOLD2_PYTHON):$PATH \
#       TORCH_CUDA_ARCH_LIST=<this card's compute capability> \
#       bash environment/build_wheels.sh              # the three extensions, from source
#   cd <kit>/esmfold2 && PATH=$(dirname $TOOLUNIVERSE_ESMFOLD2_PYTHON):$PATH bash run.sh install
#   $TOOLUNIVERSE_ESMFOLD2_PYTHON -m esmfold2_opt.weights ~/.esmfold2
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (esmfold2_opt) and its shared core (opt_core) install editable on top and are
# not here -- `--exclude-editable` leaves them out by construction.
#
# DEVIATIONS from the kit's own esmfold2/environment/requirements.lock, which
# its header describes as the freeze of an x86-64 image:
#
# 1. NONE IN THE PINS. Every line below is the kit's line: this file and the
#    kit's lock are identical distribution for distribution and version for
#    version (128 lines each). Nothing had to be substituted by name, because
#    no pin in the kit's lock is a direct `name @ https://...x86_64...whl` URL
#    -- it names only three git URLs (dockq, esm, the transformers fork), which
#    are architecture-neutral and are reproduced here exactly.
#
# 2. THREE LINES NAME WHEELS THAT EXIST ON NO INDEX -- flash_attn 2.8.3.post1,
#    transformer_engine 2.15.0+42b8400 and xformers 0.0.35+03b91d7.d20260904.
#    The kit says so in its own header and ships environment/build_wheels.sh as
#    the step that compiles them from their public sources at pinned commits
#    (the flash-attn sdist checked by sha256); its container image does the same
#    at build time. `pip install -r` of this file alone WILL FAIL on those three
#    lines on any machine -- run build_wheels.sh, as the recipe above does.
#    `pip freeze` wrote them here as local `file:///...whl` URLs naming this
#    box's wheel directory; they are written back to the version form the kit's
#    own lock uses, since the path is not a fact about the stack.
#
# 3. The compute capability those three were built for is NOT the kit's
#    default. build_wheels.sh targets 9.0 (H100 / H200) unless
#    TORCH_CUDA_ARCH_LIST says otherwise, and the kit ships configs only for
#    h100, h200 and a100. This environment was built on aarch64 with
#    TORCH_CUDA_ARCH_LIST=12.0 for an NVIDIA GB10 (compute capability 12.1); an
#    sm_120 cubin runs on sm_121, which is the same rule that lets torch's own
#    sm_120 build drive this card. A host of another architecture or card must
#    re-run build_wheels.sh, not copy these wheels.
#
# 4. xformers built WITHOUT its CUDA extension here: build_wheels.sh produced
#    `xformers-0.0.35+03b91d7.d20260904-py39-none-linux_aarch64.whl`, 1.3 MB and
#    tagged py39-none, where the kit's x86-64 image has a cp312 wheel carrying
#    compiled kernels. The version is the pinned one, so the kit's own pin check
#    passes and `import xformers.ops` succeeds; what is absent are its fused
#    kernels. ESMFold2 does not require them -- the kit's fast-environment rule
#    (attn.REQUIRED) asks only for flash-attn and TransformerEngine, and both
#    built with their kernels here -- but a run that reaches an xformers kernel
#    on this box would find none.
#
# 5. `pip check` at the end of build_wheels.sh reports
#    `nvidia-cusparselt-cu13 0.8.1 is not supported on this platform`. That is
#    the pinned distribution's own metadata about aarch64, not a missing
#    install; torch imports and reports arch_list ['sm_80', 'sm_90', 'sm_100',
#    'sm_110', 'sm_120'] on this box. It is recorded here rather than silently
#    passed over.
