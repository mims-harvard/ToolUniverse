# mosaic optimization kit -- the pinned stack, for THIS architecture.
#
# This is the kit's own environment/requirements.lock (mosaic/environment/
# requirements.lock at commit f4f62fa6...) with TWO LINES CHANGED and no
# others. Installed with `pip install --no-deps`, one pass: nothing here
# resolves, and the three upstream packages (mosaic, joltz, boltz) install
# from the pinned commits the kit's own `stock/check_pins.py` asserts.
#
# THE TWO LINES, and why each is the same release rather than a different one:
#
#   torch        the kit names
#                download.pytorch.org/whl/cpu/torch-2.7.1+cpu-cp312-cp312-
#                manylinux_2_28_x86_64.whl by direct URL. The same index, the
#                same release and the same CPU build publishes
#                ...-manylinux_2_28_aarch64.whl
#                (sha256 3bf2db5adf77b433844f080887ade049c4705ddf9fe1a32023ff
#                84ff735aa5ad), and that is what this line names. torch is
#                CPU-ONLY here BY THE KIT'S DESIGN, not by a limitation of
#                this host: it reads the Boltz-2 checkpoint and the
#                ProteinMPNN .pt weights and converts them to JAX arrays
#                (joltz.from_torch). JAX drives the card. The torch-below-2.7
#                question that closes six other kits on this architecture
#                therefore does not arise at all -- this pin is 2.7.1 and it
#                is +cpu on both architectures.
#   torchvision  same index, same release, same reason. The aarch64 file at
#                the cpu index is named `torchvision-0.22.1-cp312-cp312-
#                manylinux_2_28_aarch64.whl` (no `+cpu` local version in the
#                filename, which is upstream's naming, not a different build)
#                sha256 964414eef19459d55a10e886e2fca50677550e243586d1678f65e
#                3f6f6bac47a. Nothing in this provider imports torchvision; it
#                is in the kit's freeze because `boltz` depends on it.
#
# Every other one of the 154 pins is the kit's, unchanged (156 lines, two substituted). jax 0.10.2 plus
# jax-cuda12-plugin / jax-cuda12-pjrt 0.10.2 publish aarch64 wheels and drive
# this card: measured in a throwaway interpreter before any of this was
# written -- backend `gpu`, CudaDevice(id=0), device_kind "NVIDIA GB10",
# compute capability 12.1.
