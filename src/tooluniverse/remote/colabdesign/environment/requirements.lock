# ColabDesign provider -- the ColabDesign optimisation kit's pinned stack, translated to PyPI for aarch64.
# Installed with --no-deps. Python 3.10.18 (stock/PINS.json `python`).
#
# WHY THIS FILE IS NOT THE KIT'S OWN requirements.lock: the kit's lock lists TWO
# distributions (colabdesign at its pinned commit, freesasa) because every other
# member of the stack is a CONDA package of `environment/conda-linux-64.lock`, a
# linux-64 lock that cannot be installed on this architecture. The pinned stack
# is expressed here as PyPI distributions, at the versions the kit pins:
#
#   jax / jaxlib / jax-cuda12-plugin / jax-cuda12-pjrt 0.6.0
#   dm-haiku 0.0.17, numpy 1.26.4, scipy 1.15.2, biopython 1.88, chex 0.1.90,
#   optax 0.2.8, ml-collections 1.0.0, colabdesign 1.1.3 @ e31a56fe, freesasa 2.2.1
#
# THE INDEX WAS CHECKED PER FILE, NOT BELIEVED. A claim had been recorded that
# cp310 has no aarch64 jaxlib; a correction to it said the opposite. Neither was
# taken: the per-file listing of the PyPI index says that jaxlib
# 0.6.0 publishes `manylinux2014_aarch64` wheels for cp310, cp311, cp312, cp313 and
# cp313t (`jaxlib-0.6.0-cp310-cp310-manylinux2014_aarch64.whl` among them); jax-cuda12-plugin 0.6.0 publishes `manylinux2014_aarch64` for the same
# interpreters; jax-cuda12-pjrt 0.6.0 publishes one `py3-none-manylinux2014_aarch64`
# wheel. So CPython 3.10 -- the kit's pin -- has every artifact it needs here.
#
# THE CUDA LIBRARIES ARE THE KIT'S OWN PINS, CARRIED AS PyPI FILES. The conda lock
# names cudart 12.9.79, cuBLAS 12.9.2.10, cuFFT 11.4.1.4, cuSOLVER 11.7.5.82,
# cuSPARSE 12.5.10.65, nvJitLink 12.9.86, cuPTI 12.9.79, NVRTC 12.9.86, cuDNN
# 9.10.2.21, NCCL 2.30.7.1 and cuda-nvcc 12.9.86 (ptxas); every one is a PyPI
# `nvidia-*-cu12` wheel with a `manylinux*_aarch64` file at that version, EXCEPT
# that conda's NCCL build suffix `.1` has no PyPI twin, so NCCL is 2.30.7 (one
# device, never loaded for a collective). A first resolver run had picked cuDNN
# 9.27.0.42 and NCCL 2.32.3 for `jax-cuda12-plugin[with-cuda]`; they were replaced
# by the kit's pins rather than left as drift, after checking that
# `nvidia_cudnn_cu12-9.10.2.21-py3-none-manylinux_2_27_aarch64.whl` exists.
# `nvidia-cuda-nvcc-cu12` is how XLA gets its `ptxas` (no host CUDA toolkit).
#
# `imageio-ffmpeg` carries an aarch64 `ffmpeg` binary; BindCraft's trajectory
# animation writes through matplotlib's ffmpeg writer. The provider turns the
# animation off (see provider.toml), so it is in the lock for a caller who runs
# the kit's own CLI against this same interpreter.
#
# The kit (`colabdesign_opt`) and its shared core (`opt_core`) are NOT in this
# file: they install editable from the pinned checkout in the kit step
# (`bash run.sh install`), which is the kit's own route.
