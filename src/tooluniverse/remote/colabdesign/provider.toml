[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "colabdesign"
sparse = ["colabdesign", "common"]
package = "colabdesign_opt"
mode = "exact"
env_row = "none"
env_row_reason = "pending"
install = """
set -u
export PATH="$(dirname {python}):$PATH"
cd {kit} || exit 1
bash run.sh install
"""

[kit.env]
XLA_PYTHON_CLIENT_PREALLOCATE = "false"
