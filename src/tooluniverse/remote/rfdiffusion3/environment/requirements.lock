# RFdiffusion3's model environment — the exact stack the provider in
# ../provider.toml was installed and verified on, as
# `pip freeze --all --exclude-editable` of it.
#
# The fourth distinct stack in this repository and it coexists with none of the
# others: Python 3.12.1 exactly, torch 2.13.0+cu130, triton 3.7.1, numpy 2.4.4.
# The kit's own check compares the interpreter's major.minor.micro against
# 3.12.1 (it reports rather than refuses, but the pinned stack is that one).
#
# Rebuild (an NVIDIA driver the stack's CUDA build needs, a C compiler on PATH,
# and — for the one source build below — nvcc 13.0 and git):
#
#   uv venv --seed --managed-python --python 3.12.1 ~/rfdiffusion3-venv
#   export TOOLUNIVERSE_RFDIFFUSION3_PYTHON=~/rfdiffusion3-venv/bin/python
#   $TOOLUNIVERSE_RFDIFFUSION3_PYTHON -m pip install --no-deps -r requirements.lock
#   tu remote setup rfdiffusion3            # the kit, the overlay and the weights
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (rfdiffusion3_opt) and its shared core (opt_core) install editable on top and
# are not in this freeze.
#
# TWO LINES ARE NOT INDEX PACKAGES, and the plain `pip install -r` above cannot
# fetch them. They are the same two the kit's own lock names, and the kit's
# STOCK.md "Stack" section is the recipe for both — it is the authority, this
# is only a pointer to it:
#
#   rc-foundry==0.2.1.dev13+g4010e3e2e  stock RFdiffusion3 (RosettaCommons
#       foundry at the pinned commit). It is built from the archive the kit
#       ships, `rfdiffusion3/stock/foundry-4010e3e.tar.gz`, which carries no
#       .git and therefore needs
#       SETUPTOOLS_SCM_PRETEND_VERSION=0.2.1.dev13+g4010e3e2e at build time.
#       The kit's pin check accepts an install from a local directory, a git
#       checkout at the commit, or that archive — and refuses an install from
#       an index, so there is no index version of this line to want.
#
#   apex==0.1  NVIDIA apex at the commit the kit's stock/PINS.json names, with
#       its C++/CUDA extensions built against this torch. No public wheel
#       exists for this torch and the kit ships none. It is not optional: at
#       this pin upstream binds apex.FusedRMSNorm for every RMSNorm of the
#       network whenever apex imports (layer_utils.py:13-23), and the kit's
#       KERNELS census REQUIRES that binding — a pass that fell back to
#       torch.nn.RMSNorm is refused, exit 5.
#
# DEVIATIONS from the kit's own environment/requirements.lock, both
# architectural, and both to do with the fact that this host is aarch64 while
# the kit's stack was tested on x86-64:
#
#   1. apex. The kit's lock pins the version and its PINS.json records the
#      sha256 of one wheel file, `apex-0.1-cp312-cp312-linux_x86_64.whl`. The
#      wheel built here is `apex-0.1-cp312-cp312-linux_aarch64.whl` and has a
#      different digest, necessarily: PINS.json says as much ("a wheel compiled
#      elsewhere has another digest"). It was built from the pinned commit the
#      way STOCK.md says to, with APEX_CPP_EXT=1 APEX_CUDA_EXT=1 and
#      TORCH_CUDA_ARCH_LIST="12.0+PTX" in place of the kit's "8.0;9.0+PTX",
#      because this card is sm_121 and a 12.0 cubin is what runs on it.
#      `pip freeze` renders it as a local `apex @ file://…` URL naming the
#      build machine's path; the line below is the version pin instead, since
#      the file URL would be meaningless anywhere else.
#
#   2. ninja==1.13.0 is present here and absent from the kit's lock. It is the
#      build tool STOCK.md's own apex line installs from pip at that version,
#      and it stayed in the environment afterwards. Nothing imports it at run
#      time.
#
# NOT a deviation, and worth recording because it is what the standard warns
# about: this kit's lock pins nothing by direct wheel URL. Every line below but
# the two named above resolved from the index for aarch64 at the pinned
# version, unchanged.
