# RoseTTAFold3's model environment -- the stack this provider was built
# against, as `pip freeze --all --exclude-editable` of the interpreter
# [env] python names, on Python 3.12.1 (uv-managed CPython), linux-aarch64.
#
# The seventh distinct stack in this repository and it coexists with none of
# the others: RoseTTAFold3 pins torch 2.13.0+cu130 / triton 3.7.1 / numpy
# 2.4.4 / cuEquivariance 0.11.1 on Python 3.12, where OpenFold3 pins torch
# 2.10.0+cu128 on 3.11 and Boltz-2 torch 2.12.0+cu130 with numpy 1.26.4.
# One model, one environment, one socket each.
#
# Rebuild (an NVIDIA driver that runs CUDA 13.0 -- 580 or newer -- git, and a
# C compiler on PATH: Triton builds the kit's kernels at first use):
#
#   uv venv --seed --managed-python --python 3.12.1 ~/rosettafold3-venv
#   export TOOLUNIVERSE_ROSETTAFOLD3_PYTHON=~/rosettafold3-venv/bin/python
#   grep -v '^#' requirements.lock > /tmp/rf3.txt
#   $TOOLUNIVERSE_ROSETTAFOLD3_PYTHON -m pip install --no-deps -r /tmp/rf3.txt
#   $TOOLUNIVERSE_ROSETTAFOLD3_PYTHON -m pip install --no-deps --force-reinstall \
#       nvidia-cudnn-cu13==9.20.0.48 nvidia-nccl-cu13==2.29.7
#   tu remote setup rosettafold3          # the kit, the add-on and the weights
#
# The second pip pass is the kit's own route-C recipe (its README.md
# "Setup", route C) and it is not optional: nvidia-cudnn-cu12/-cu13 and
# nvidia-nccl-cu12/-cu13 unpack into the SAME nvidia/cudnn and nvidia/nccl
# directories, and the tested tree holds the cu13 files there, so the cu13
# pair has to be laid down last. `pip install -r` of this file alone leaves
# whichever pair pip happened to install second.
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# (rosettafold3_opt) and its shared core (opt_core) install editable on top
# and are not here -- `--exclude-editable` leaves them out by construction.
#
# DEVIATIONS from the kit's own rosettafold3/environment/requirements.lock:
#
# 1. NONE. Not one. This file is the kit's 148 lines, distribution for
#    distribution and version for version; `diff` of the two sorted pin sets
#    is empty. Nothing had to be substituted by name, because no pin in the
#    kit's lock is a direct `name @ https://...x86_64...whl` URL -- it names
#    exactly one URL, `rc-foundry @ git+https://github.com/RosettaCommons/
#    foundry.git@4010e3e2e...`, which is a source checkout and therefore
#    architecture-neutral. It is reproduced here exactly, and it has to be:
#    the kit's pin check (stock/check_pins.py) reads pip's own
#    direct_url.json and requires `vcs_info.commit_id` to equal the pin, so
#    installing rc-foundry any other way makes every kit mode refuse.
#
# 2. `pip==26.2.1` is NOT listed, for the same reason the kit's lock omits
#    its own pip 23.3.2: the interpreter's installer is not part of the
#    stack. `uv venv --seed` puts it there. That single line is the whole
#    difference between this freeze and the kit's file.
#
# 3. Three pins that a static read of the kit says are x86-64 and are not,
#    checked rather than assumed on this box:
#      * torch==2.13.0 resolves to the manylinux_2_28_aarch64 wheel and
#        reports `2.13.0+cu130`, `torch.version.cuda == '13.0'` and
#        get_arch_list() == [sm_80, sm_90, sm_100, sm_110, sm_120]. An
#        sm_120 cubin runs on this box's sm_121. (OpenFold3 needed an
#        --extra-index-url for its version because PyPI's aarch64 build of
#        2.10.0 is +cpu; 2.13.0's is not.)
#      * triton==3.7.1 publishes manylinux_2_28_aarch64.
#      * cuequivariance-ops-cu13 / -torch-cu13 0.11.1 install and
#        `import cuequivariance_torch` succeeds here, although
#        stock/PINS.json records only the two x86-64 wheels' digests. The
#        kit's dry run reports cueq=0.11.1 on this interpreter.
#
# 4. NOT `uv venv` avoidance. OpenFold3 must use the stdlib `venv` because
#    `uv venv` seeds `_virtualenv.pth`, whose `_Finder` class is one of the
#    four names in that kit's HOOK_FINDER_CLASSES and is read as a rival kit
#    hook. rosettafold3_opt has no such check -- grep for
#    HOOK_FINDER_CLASSES / "one route per process" over
#    rosettafold3/opt/ and common/opt_core/ finds nothing -- and the only
#    .pth scan it does (run.sh's env-route gate) looks for a file named
#    `rosettafold3_opt_autoload.pth` and ignores every other .pth. The kit's
#    own README route C uses `uv venv --seed --managed-python --python
#    3.12.1`, and that is what was used here.
#
