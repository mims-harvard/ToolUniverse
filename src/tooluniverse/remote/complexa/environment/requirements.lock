# Proteina-Complexa's model environment -- the stack this provider was built against.
#
# Derived from the kit's own environment/requirements.lock (a `pip freeze --all` of
# the tested x86-64 stack: CPython 3.12.10, torch 2.7.0+cu126, 172 distributions) and
# changed in the six ways below (the third has a hole in it, and the hole is the interesting part), because that file is for one architecture and this
# host is another. Nothing was rounded up: every version of every line that remains
# is the kit's own.
#
# THE ENVIRONMENT. CPython 3.12.10 (the kit's own pin; uv publishes it for aarch64),
# made with the STDLIB venv module so site-packages carries no `_virtualenv.pth` --
# this kit activates through a `.pth` (complexa_opt_autoload.pth, laid by the kit
# step) and uv's venv has been seen to break hook detection (openfold3):
#
#   uv python install 3.12.10
#   ~/.local/share/uv/python/cpython-3.12.10-linux-aarch64-gnu/bin/python3.12 -m venv ~/complexa-venv
#   export TOOLUNIVERSE_COMPLEXA_PYTHON=~/complexa-venv/bin/python
#
# THE TORCH QUESTION, and it is the one the kit's own pin makes interesting.
# torch 2.7.0 is >= 2.7, so this host's card is NOT closed at the pin (a torch below
# 2.7 has no CUDA build for sm_121 at all -- STANDARD.md section 10). Measured here,
# not argued: torch 2.7.0+cu128 reports arch list ['sm_90', 'sm_100', 'sm_120'],
# is_available True, and runs a 2048x2048 GEMM, a LayerNorm, an SDPA call and
# torch_scatter's scatter_mean on the card (an sm_120 cubin runs on sm_121).
#
# THE SIX CHANGES.
#
#  1. torch 2.7.0 -> torch 2.7.0+cu128, from download.pytorch.org by direct URL with
#     its sha256. The SAME upstream version; only the CUDA build differs. The kit's
#     own build (+cu126) has no aarch64 file on download.pytorch.org/whl/cu126 for
#     this version, and PyPI's aarch64 wheel of 2.7.0 is CPU-only. The kit tolerates
#     it, which was read before installing rather than hoped: PINS.json calls its
#     torch line "a label check_pins reports, never a gate", and the manifest's
#     [env] verify asserts torch.__version__.startswith('2.7.0').
#  2. triton 3.3.0 from the same index (the PyPI file for this architecture is the
#     same version). Nothing on this path compiles with Triton: stock/PINS.json
#     "accelerators" says "none: no torch.compile, no CUDA graphs", and the kit's
#     levers are plain torch ops. It is pinned because torch 2.7.0 requires it, not
#     because anything here calls it.
#  3. the kit's fifteen nvidia-*-cu12 wheels (the CUDA 12.6 set) are DROPPED, and ONE
#     is added back at a different version: nvidia-cuda-nvrtc-cu12==12.9.86.
#     The aarch64 torch 2.7.0+cu128 wheel bundles its CUDA 12.8 runtime, cuDNN and
#     cuBLAS inside torch/lib (the metadata's nvidia-* requirements all carry
#     `platform_machine == "x86_64"`), so the kit's cu126 set would be a SECOND CUDA
#     runtime installed beside the one torch loads -- the collision protenix_v1's
#     lock documents. Verified: torch imports and drives the card with none of them.
#     THE ONE EXCEPTION IS NOT OPTIONAL, and it was found by running, not by reading:
#     torch 2.7.0+cu128 bundles NVRTC 12.8, which does not know sm_121, and
#     `torch.prod(x, dim=-1)` on ANY CUDA dtype (float32, float64, int32, int64,
#     bool, float16 -- all six tried) compiles its reduction through the jiterator
#     and raises `nvrtc: error: invalid value for --gpu-architecture (-arch)`.
#     Upstream calls exactly that: community_models/openfold/data/data_transforms.py
#     :980 (`pre_omega_mask = torch.prod(prev_all_atom_mask[..., 1:3], dim=-1)`), on
#     the target's side-chain torsion features, so EVERY request dies at its first
#     network call and the card's GEMMs, attention and LayerNorm all work. NVRTC
#     12.9 knows sm_121. This wheel carries libnvrtc.so.12 and
#     libnvrtc-builtins.so.12.9 under site-packages/nvidia/cuda_nvrtc/lib, and the
#     launcher puts that directory FIRST on LD_LIBRARY_PATH: torch's own copy is
#     found by RUNPATH, which LD_LIBRARY_PATH outranks. Measured: with it,
#     torch.prod gives the right answer and /proc/self/maps shows 12.9's builtins
#     mapped. NVRTC only compiles torch's jiterator sources; nothing of the model's
#     numerics moves. It is a runtime-library substitution, not a torch deviation,
#     and nothing else in this lock changes for it.
#  4. jaxlib `+cuda12.cudnn91` x86-64 URL -> jaxlib==0.4.29 from PyPI, which
#     publishes manylinux2014_aarch64 at that version (as do jax-cuda12-pjrt and
#     jax-cuda12-plugin, both already pinned by the kit at 0.4.29). jax is the
#     optional AF2 reward stage's framework; the generation stage this provider runs
#     (++generation.reward_model=null) never initialises it.
#  5. torch_cluster, torch_sparse and torch_scatter `+pt27cu126` x86-64 wheels from
#     data.pyg.org are DROPPED from this file; the first two because nothing under
#     upstream's src/ imports them (grep: only `from torch_scatter import
#     scatter_mean`, in nn/feature_factory/seq_cond_feats.py and nn/old_feature_
#     factory.py), the third because no aarch64 wheel of it exists anywhere and it
#     builds from the PyPI sdist -- which cannot be built by pip's isolated build
#     (its setup.py imports torch) and so cannot be a line of this file. It is
#     installed by `[kit] install`, in the model interpreter, with
#     `--no-build-isolation` and FORCE_ONLY_CPU=1: this host has nvcc 13 beside a
#     cu128 torch, and torch_scatter's CUDA build would refuse that mismatch. The
#     compiled extension is therefore CPU-only, and that is sufficient because
#     `scatter_mean` is torch-native (scatter_add_ and a divide) and runs on CUDA
#     tensors; every compiled op (segment_csr, gather_csr...) is unused here.
#  6. the two `-e git+...` lines (proteinfoundation and colabdesign) are kept as the
#     kit has them and moved to the END, so every runtime pin and build backend is
#     down before pip clones and installs them. They are upstream itself, editable
#     from ONE checkout of the pinned commit 916eaaed -- the form
#     stock/check_pins.py reads (a git checkout, clean under src/ and configs/).
#     pip clones into <venv>/src/. The kit's own archive omits one file, a
#     prebuilt x86-64 `sc` executable under result_analysis/, which a git clone
#     carries; nothing on the generation path executes it (SC_EXEC is stubbed).
#
# DO NOT add `tokenizers` pins by hand: 0.22.2 is the kit's and was imported here.
# `[env] verify` imports every compiled pin for the reason STANDARD.md section 14
# gives (a wheel can install and then SIGILL).
