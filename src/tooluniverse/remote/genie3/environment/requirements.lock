# Genie 3's model environment -- the stack this provider was built against.
#
# Python 3.10.13, which is OLDER than any other provider on this standard
# (3.11-3.12) and is the kit's own pin: stock/PINS.json pinned_stack.python,
# repeated in environment/requirements.lock's own header and in STOCK.md's
# Stack section. uv had the exact patch release for aarch64, so nothing was
# built from source and nothing was rounded up:
#
#   uv python install 3.10.13
#
# The venv is made with the STDLIB module, not `uv venv`, for a reason that is
# this kit's and not openfold3's `.pth`-scanning one: `run.sh install` runs
# `python -m pip install -e ../common/opt_core -e opt`, and a `uv venv` without
# `--seed` has no pip at all, so the kit's own install line cannot run in it.
# The stdlib module also leaves site-packages with no `_virtualenv.pth`, which
# matters here because this kit ACTIVATES through a `.pth`
# (genie3_opt_autoload.pth, generated by opt/_build_backend.py at install time).
#
# DEVIATIONS from the kit's own environment/requirements.lock. Three, and the
# first one is the reason the other two exist.
#
#  1. torch 2.7.1+cu126 -> torch 2.7.1+cu128. The SAME upstream version; only
#     the CUDA build differs, and two separate facts force it:
#       * download.pytorch.org/whl/cu126 publishes NO aarch64 file at 2.7.1 at
#         all, so the kit's own build cannot be installed on this host.
#       * stock/PINS.json records the pinned stack's
#         `torch.cuda.get_arch_list()` as "sm_50 ... sm_90", with "none above
#         sm_90" -- so even on x86-64 that wheel carries no code this card
#         (cc 12.1) can load. The cu128 build reports
#         ['sm_90', 'sm_100', 'sm_120'] and an sm_120 cubin runs on sm_121,
#         which is how every verified provider here drives this card.
#     The kit TOLERATES it, which was checked before anything was installed
#     rather than hoped for: stock/check_pins.py and stack.py:398 both compare
#     with the local tag stripped (`.split("+")[0]`), so 2.7.1+cu128 reads as
#     the pin. Measured -- `bash run.sh install` prints
#     "torch 2.7.1+cu128: pinned" and exits 0. (This is the evo2 precedent, not
#     the e1 one: e1's accel.expected() compares against the literal
#     "2.8.0+cu128" and no aarch64 environment can satisfy it, which is why
#     that provider is permanently on [kit] mode = "off".)
#
#  2. ALL FIFTEEN `nvidia-*-cu12` lines of the kit's lock are absent, and this
#     is not a reduction -- it is what pip resolves. The aarch64 cu128 wheel of
#     torch 2.7.1 CARRIES its CUDA runtime inside the wheel and marks every
#     `nvidia-*-cu12` requirement `platform_machine == "x86_64"`, so installing
#     `torch==2.7.1+cu128` with its dependencies on this host pulls none of
#     them. Measured: `torch.version.cuda` reads 12.8 and
#     `torch.cuda.is_available()` is True with no nvidia-* distribution in the
#     environment but `nvidia-ml-py`, which is pure Python and is kept at the
#     kit's pin.
#
#  3. `-e git+https://github.com/aqlaboratory/genie3.git@d77ae5ac...#egg=genie3`
#     is not in this file. Upstream ships no wheel, so the kit's lock installs
#     it as a VCS editable -- but a requirements file cannot carry pip's
#     `--src`, so that line would clone into whatever directory `pip` happened
#     to be run from. The checkout is therefore made in [kit] install from
#     `stock/genie3-d77ae5ac.tar.gz`, the archive the kit SHIPS and the one
#     `stock/check_pins.py` compares the checkout against -- which needs no
#     network and is byte-equal to the pin by construction. Measured: the pin
#     check reports "188 files == genie3-d77ae5ac.tar.gz".
#
# NOT A DEVIATION, recorded so it is not mistaken for one: the kit's lock pins
# nothing by direct URL, so apart from the torch line every version below is
# the kit's own, installed from PyPI with --no-deps. All 69 had a cp310
# aarch64 or pure-python wheel; nothing was compiled.
#
# Rebuild (an NVIDIA driver >= 570 for CUDA 12.8):
#
#   uv python install 3.10.13
#   ~/.local/share/uv/python/cpython-3.10.13-linux-aarch64-gnu/bin/python3.10 \
#       -m venv ~/genie3-venv
#   export TOOLUNIVERSE_GENIE3_PYTHON=~/genie3-venv/bin/python
#   $TOOLUNIVERSE_GENIE3_PYTHON -m pip install --no-deps -r requirements.lock
#   # then `tu remote setup genie3`, whose kit step extracts the shipped
#   # archive, installs it editable and runs `bash run.sh install`.
--extra-index-url https://download.pytorch.org/whl/cu128
