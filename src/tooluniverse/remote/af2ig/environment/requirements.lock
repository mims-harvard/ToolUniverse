# af2ig (AlphaFold 2 initial guess, dl_binder_design) -- the model environment,
# installed with --no-deps into the interpreter $TOOLUNIVERSE_AF2IG_PYTHON.
#
# This is the kit's own environment/requirements.lock at commit
# f4f62fa6592ae4938d49b1757bea0cfeff9f468e, line for line, WITH ONE
# SUBSTITUTION, named here because the standard asks a deviating lock to say
# which line moved and why:
#
#   tensorflow_cpu==2.21.0   ->   tensorflow==2.21.0
#
# WHY. `tensorflow-cpu` 2.21.0 publishes eight wheels and every one of them is
# `manylinux_2_27_x86_64` or `win_amd64`; there is no aarch64 wheel for that
# distribution at any version. `tensorflow` 2.21.0 -- the same release, the
# same source tree -- publishes
# `tensorflow-2.21.0-cp311-cp311-manylinux_2_27_aarch64.whl` at 281,828,020
# bytes. That wheel IS the CPU-only build: TensorFlow ships no aarch64 GPU
# artifact, which the sizes say on their own (the x86_64 `tensorflow` wheel is
# 572,440,367 bytes against `tensorflow-cpu`'s 273,829,956, and the aarch64
# one sits with the second number, not the first).
#
# MEASURED RATHER THAN ARGUED, because the property the kit pins
# `tensorflow-cpu` FOR is that TensorFlow must not touch the GPU -- AlphaFold's
# feature pipeline runs on the host while JAX holds the card, and a TF that
# grabbed device memory would be a second tenant nobody declared. In this
# interpreter:
#
#   tf 2.21.0
#   tf.config.list_physical_devices('GPU') -> []
#   tf.config.list_physical_devices('CPU') -> [PhysicalDevice(CPU:0)]
#
# so the substitution preserves the pin's intent exactly. What it does NOT
# preserve is the pin's NAME, and that is visible: the kit's own
# `stock/check_pins.py --gpu` reports `tensorflow-cpu: not installed; want
# 2.21.0`. [kit] install permits that ONE line and no other -- see the
# comment there.
#
# NOTHING ELSE MOVED. All 56 other lines installed unchanged on aarch64,
# including the whole jax 0.5.3 CUDA stack. One pass; no ordered passes are
# needed (this lock carries one CUDA generation, 12.9, so none of the
# `nvidia/{cudnn,nccl,cusparselt}` path collisions that made protenix need
# `# --- pass break ---` can arise).
#
# THE JAX LINE IS TWO YEARS OLD AND DRIVES THIS CARD. jax/jaxlib 0.5.3 was
# expected to be the blocker for an AlphaFold-2-era kit on a Blackwell-class
# part and is not: `jaxlib` publishes `manylinux2014_aarch64` from 0.4.18
# onward, 0.5.3 publishes four of them (cp310-cp313), and
# `jax-cuda12-plugin` / `jax-cuda12-pjrt` 0.5.3 publish aarch64 wheels too.
# Measured in this interpreter on an NVIDIA GB10:
#   jax 0.5.3 jaxlib 0.5.3 | default_backend() 'gpu' | [CudaDevice(id=0)]
#   device_kind 'NVIDIA GB10' | compute_capability '12.1'
#   a 2048x2048 float32 matmul returns 2048.0 | no PTX JIT message
# An old pinned framework version is a question to measure against the index
# and the card, never a conclusion to reach from the version number.
#
# The two packages that are NOT here install editable from the kit checkout in
# the kit step, as the kit's own README requires: `common/opt_core` and
# `af2ig/opt` (af2ig_opt). The pinned upstream tree (dl_binder_design at
# cafa3853, patched with the kit's 13-diff series) is not a Python
# distribution either; the kit step unpacks it.
