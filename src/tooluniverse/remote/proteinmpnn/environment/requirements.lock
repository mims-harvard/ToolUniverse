# proteinmpnn's model environment -- the stack this provider was built against.
#
# It is the kit's own `proteinmpnn/environment/requirements-mpnn.lock` with the
# deviations below and nothing else. Of its 31 pin lines, 16 are reproduced here
# byte for byte, 1 is re-pointed to the aarch64 artifact of the SAME version,
# and 14 are not installed (12 of them `nvidia-*-cu12`). Nothing is added, and
# the counts above are computed from both files rather than asserted.
#
# THIS IS A CPU STACK, ON PURPOSE AND BY MEASUREMENT -- `[gpu] policy = "none"`
# in provider.toml carries the evidence, and esm_if1 is the precedent for the
# shape. What is NOT true of this provider, and was asserted here once from a
# grep before the kit's own source was read: that a CPU host makes the kit
# inert. `mpnn_worker2.py` switches off exactly three of its eleven levers
# without a CUDA device (`--graph_rng`, `--single_graph`, `--fused_draw`) and
# runs the other eight, and `proteinmpnn_opt.modes.cpu_disabled_levers()` is the
# kit reading that line back. See [kit] in provider.toml.
#
# THE ONE RE-POINTED LINE
#
#   The kit pins torch by DIRECT URL to
#   `torch-2.5.1+cu124-cp311-cp311-linux_x86_64.whl`. That artifact cannot
#   install on aarch64 at all -- the platform tag, before any question about
#   CUDA. PyPI's `torch==2.5.1` for cp311 aarch64
#   (`torch-2.5.1-cp311-cp311-manylinux2014_aarch64.whl`) is the SAME VERSION
#   and is CPU-only; the facts read off the installed environment are in [gpu].
#
# THE THIRTEEN OMISSIONS, each with its reason (the fourteenth line not
# installed, `gemmi`, is a declaration rather than an omission -- see its line):
#
#   * the twelve `nvidia-*-cu12` pins (cublas, cuda-cupti, cuda-nvrtc,
#     cuda-runtime, cudnn, cufft, curand, cusolver, cusparse, nccl, nvjitlink,
#     nvtx) -- torch's own metadata marks every one of them
#     `platform_machine == "x86_64"`, and a CPU torch loads none of them.
#   * `triton==3.1.0` -- publishes cp310/cp311/cp312 manylinux x86_64 wheels and
#     NOTHING for aarch64, at any version of the 3.x line. It is imported by the
#     kit's `--fused_draw` lever only, which is one of the three the worker
#     switches off without a CUDA device.
#
# KEPT, AND WHY IT IS NOT AN OMISSION:
#
#   * `nvidia-ml-py==12.560.30` is `nvidia_ml_py-...-py3-none-any.whl`, the pure
#     Python NVML binding. It is not one of the twelve CUDA payload wheels, it
#     installs on any platform, and the kit's reporting reads it. Dropping it
#     for its name would be a guess.
