# borzoi_calico — calico/borzoi variant scoring (borzoi_sad.py), TensorFlow 2.15.
#
# Counted by comparing this file against the kit's environment/requirements.lock
# and against the live interpreter, not asserted:
#   byte-identical 81 · differing 0 · not installed 17 · added 1
#
# THE ONE ADDITION IS THE ONE THING THE INDEX CANNOT TELL YOU. The kit pins
# `tensorflow==2.15.1`, and on aarch64 that wheel on PyPI CARRIES NO CODE: its
# RECORD is six dist-info lines and
#   Requires-Dist: tensorflow-cpu-aws ==2.15.1 ; platform_system == "Linux" and (platform_machine == "aarch64")
# hands the real library to another distribution of the SAME version. Installed
# with --no-deps, that redirect is never followed: `pip list` shows
# `tensorflow 2.15.1` and `import tensorflow` raises ModuleNotFoundError. So the
# pin below is kept AND `tensorflow-cpu-aws==2.15.1` is added beside it -- the
# same version, re-pointed to the artifact that holds the code, which is the
# deviation class this standard already takes for torch. (The kit's TensorFlow
# 2.17.1 sibling, enformer_deepmind, needs no such line: at 2.17.1 the aarch64
# `tensorflow` wheel is the real library.)
#
# THE FIVE OMISSIONS ARE NOT ON THE PATH THIS PROVIDER SERVES, and that was read
# out of the import graph rather than off the dependency list. `borzoi_sad.py`
# imports h5py, numpy, pandas, pysam, scipy, tensorflow, tqdm and
# `baskerville.{dataset,seqnn,stream,vcf}`; those close over
# `baskerville.{blocks,layers,metrics,dna}` and need natsort and nothing else.
#   intervaltree       only baskerville/gene.py
#   pybedtools         only baskerville/{snps,gene}.py, scripts/hound_isd_bed.py
#   pyBigWig           only scripts/hound_predbed.py
#   ncls, sorted_nearest   transitive deps of pyranges, itself only
#                          scripts/hound_eval_genes.py
# All five build from sdist and four need a C/C++ compiler; none is imported by
# anything this provider calls, so each is declared missing here with its reason
# instead of being compiled to sit unused. `bedtools` -- the binary pybedtools
# drives -- is likewise not required, and is not installed on this host.
#
# The twelve `nvidia-*-cu12` pins are TensorFlow's `and-cuda` extra: x86-only in
# TensorFlow's own metadata, and a CPU TensorFlow loads none of them.
#
# Python 3.10 (the kit's `python` pin: 3.10.17 tested, 3.10.20 here, recorded as
# drift by the kit's own NOTE line). Install with --no-deps.
