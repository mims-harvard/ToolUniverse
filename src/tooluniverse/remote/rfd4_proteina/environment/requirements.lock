# RFD4-Proteina's model environment — the exact stack the provider in
# ../provider.toml was installed and verified on, as
# `uv pip freeze --exclude-editable` of it.
#
# Python 3.12.13, torch 2.14.1+cu132, numpy 2.2.6. This stack coexists with none
# of the other providers' and none of ToolUniverse's, which is the whole reason
# for the two-environment split in STANDARD section 2.
#
# THE FIRST PROVIDER HERE WITH NOTHING EDITABLE ON TOP. The others install a
# kit (`<slug>_opt`) and often `opt_core` over the frozen list, and those are
# deliberately absent from their freezes. There is no kit for this model, so
# this list is the whole environment.
#
# Rebuild (an NVIDIA driver the stack's CUDA build needs; no compiler and no
# source build — every line below has a wheel, aarch64 included):
#
#   uv venv --seed --managed-python --python 3.12.13 ~/rfd4-proteina-venv
#   export TOOLUNIVERSE_RFD4_PROTEINA_PYTHON=~/rfd4-proteina-venv/bin/python
#   $TOOLUNIVERSE_RFD4_PROTEINA_PYTHON -m pip install --no-deps \
#       --extra-index-url https://download.pytorch.org/whl/cu132 \
#       -r requirements.lock
#   tu remote setup rfd4_proteina          # the weights
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured.
#
# TWO THINGS A RESOLVER GETS WRONG HERE, recorded because both cost a run:
#
#  1. `uv pip install "rfd4-proteina[all-cuda13]"` with the extra index
#     upstream documents fails to resolve. uv considers only the first index
#     that carries a package at all, and download.pytorch.org carries `idna`
#     and `cuda-python` at versions below what atomworks and rfd4-proteina
#     require. The fix is `--index-strategy unsafe-best-match`; plain pip
#     does not have the behaviour. `--no-deps` above sidesteps it entirely.
#  2. Upstream's quickstart names the extra `[metrics-cuda13]`. The published
#     wheel declares `all-cuda12`, `all-cuda13` and `docs`, and nothing else.
#
# NOT IN THIS LIST, DELIBERATELY: the AlphaFold2/AlphaFold3 refolding oracles.
# They are a separate download with their own environment and weights, and
# this provider computes no oracle-backed metrics (the worker passes
# `~metrics`). Upstream's hosted deployment makes the same choice and says so:
# "Oracle-backed refolding metrics require an operator-mounted
# structure-prediction model and are not part of the default deployment."
#
