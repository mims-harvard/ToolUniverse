[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "e1"
# e1/opt declares no dependency on common/ at all (opt/pyproject.toml:
# `dependencies = []`), and `grep -rn opt_core e1/opt/` finds the word only in
# _build_backend.py's note about where its template came from -- the kit tree
# imports nothing from the shared core. So unlike rosettafold3 there is no second
# editable install. "common" is named here because the checkout is shared with
# every provider pinning this commit and the sparse set is the union of what its
# providers declare.
sparse = ["e1", "common"]
package = "e1_opt"
#
# ENV ROW: NONE, AND FOR A FIFTH REASON -- the function does not exist.
# The probe's record, read from this box:
#
#   KITROW {"model_opt": ".../e1", "env": {}, "opts": [], "activation":
#   "autoload", "mode_env": "E1_OPT", "modes": ["off", "exact"], "row_errors":
#   ["resolve(mode): AttributeError: module 'e1_opt.modes' has no attribute
#   'resolve'", "resolve(mode, home): AttributeError: module 'e1_opt.modes' has
#   no attribute 'resolve'"], "stack_key_error": "AttributeError: module
#   'e1_opt.modes' has no attribute 'jit_cache_key'"}
#
# The four shapes recorded so far were all signature mismatches of a `resolve`
# that existed. This kit's modes.py has no `resolve` at all: it is a pure mode
# TABLE (MODES, DEFAULT_MODE, MODE_TABLE, kernels_expected, check_mode, entry,
# plus an AST reader for the kit tree's own KIT/MODE constants) and nothing in it
# produces an environment row. The kit's deployment variables live in
# configs/<card>.env, which ship for h100, h200 and a100 and not for this card,
# and the NAMES live in a module of their own -- e1_opt/_names.py, `ENV,
# ENV_VARIANT, ENV_DET = "E1_OPT", "E1_VARIANT", "E1_OPT_DET"`. A correct call
# would yield nothing either, so nothing is lost by declaring it.
env_row = "none"
env_row_reason = "e1_opt.modes has no resolve() at all -- it is a pure mode table; the kit's deployment variables live in configs/<card>.env (h100|h200|a100 only) and its variable NAMES in e1_opt/_names.py, which _autoload imports, so the probe reads mode_env=E1_OPT from _autoload.ENV"
#
# THE MODE VARIABLE'S NAME is E1_OPT, read off the kit and not derived from the
# slug. It is NOT in modes.py -- the probe's first place -- and it is not in
# _autoload.py's own body either; _autoload does
# `from ._names import ENV, ENV_VARIANT, ENV_DET`, which binds it into that
# module, which is how the probe's second place answers. A fifth spelling for
# the record: the names module is `_names.py` and the canonical reference is
# `e1_opt._names.ENV`.
#
# ACTIVATION is the common form: the mode variable plus the kit's own
# e1_opt_autoload.pth, which imports e1_opt._autoload at interpreter start and
# installs a meta-path finder on `E1.predictor` / `E1.scorer`. Verified: the
# editable install puts e1_opt_autoload.pth in the venv's site-packages beside
# setuptools' own __editable__.e1_opt-0.2.1.pth. With E1_OPT unset or "off"
# `install()` returns None and NO finder is installed, which is what this
# provider runs.
#
# ------------------------------------------------------------------------------
# MODE = "off", FOR TWO INDEPENDENT REASONS. `off` is a documented mode of this
# kit -- "stock e1, exactly as released" -- and the kit's README names it first
# of the two. It is not a workaround and nothing degrades silently.
#
# REASON A -- `exact` requires flash-attn ENGAGED and refuses without it.
# modes.py names all three of the stock's accelerators for every mode
# (`KERNELS_ALL = ("flash_attn", "hub_layernorm", "flex_attention")`) and
# accel.py's `proof()` compares each one's word in the process against
# `engaged:<impl>@<pinned version>`; under a kit mode any mismatch raises
# SystemExit(3) before the first forward:
#
#   NOT ACTIVE: mode exact: accelerator(s) not engaged in this process --
#   flash_attn=absent(flash_attn_not_installed) (the pinned stack engages
#   engaged:flash_attn@2.8.3.post1) -- the mode's levers run on them, so the mode
#   cannot run here (mode off runs the stock's own fallback route); exit 3
#
# flash-attn 2.8.3.post1 publishes no aarch64 wheel for torch 2.8 / CUDA 12
# (lock DEVIATION 3), and the one aarch64 build of that version on this host --
# esmfold2's -- needs libcudart.so.13 and was built against torch 2.13 / CUDA
# 13.0. Under `off` the same absence is upstream's OWN documented fallback:
# E1/model/flash_attention.py catches the ImportError and
# E1/model/attention.py L299-311 sends the within-sequence layers to
# `varlen_flex_attention_func`, the route upstream itself takes under
# USE_FLASH_ATTN=0.
#
# REASON B -- `exact` would refuse on the torch version string even WITH
# flash-attn. `accel.expected()` builds the flex_attention word from
# `pins.STACK["torch_version_str"]`, which is the literal "2.8.0+cu128", and this
# environment is necessarily 2.8.0+cu129 (REASON 1 at the top of this file; there
# is no cu128 aarch64 build of torch 2.8.0). So the word read would be
# `engaged:torch.compile@2.8.0+cu129` against an expected
# `engaged:torch.compile@2.8.0+cu128` and the mode would refuse by name again.
# THIS ONE DOES NOT GO AWAY IF FLASH-ATTN IS EVER BUILT: `exact` is unreachable
# on aarch64 for as long as the kit's pin names a CUDA minor that PyTorch does
# not publish for this architecture. Worth stating because the obvious next move
# after reading REASON A -- build flash-attn -- would not change the outcome.
#
# WHAT IS GIVEN UP, and it is more than esmc gave up. `exact` is seventeen levers
# (sixteen on the a100 class), listed in CHANGES.md, and their claimed gain is
# entirely in model forward time: the RMSNorm autotune pin, a bf16 weight
# pre-cast, four fused Triton elementwise kernels, flash-attn varlen packing,
# two flex-attention levers, int64 offsets, an any-length flex route, three
# multi-sequence/KV-cache levers for the retrieval-augmented path, and a host-side
# tokenisation memo. Residency still buys this provider what the kit's own README
# says is the larger share for a small assay: "Every `score` process also spends
# ~15 s on interpreter start and checkpoint read in either mode, so the small Run
# example gains little end to end".
mode = "off"
#
# NO `levers_off` HERE, AND THAT IS DELIBERATE -- the eighth question answered
# rather than assumed. `MODEL_OPT_LEVERS_OFF` does not appear anywhere in the e1
# kit (`grep -rn 'LEVERS_OFF\|levers_off' e1/` returns nothing; the only hits in
# the repository are under common/opt_core, which this kit does not import). The
# kit says so itself, in CHANGES.md's own words: "There is no per-lever switch:
# the set applies whole or the mode refuses by name." So setting the variable
# would do nothing at all, which is worse than saying so -- this is the boltzgen
# finding repeated with a different mechanism: boltzgen HAS a row and ignores the
# variable, this kit has neither.
#
# `levers_declined` is omitted rather than empty for the honest reason: no lever
# has declined, because `exact` has never been attempted on this card. Nothing
# has succeeded either.
#
# INSTALL: the kit package editable, then the kit's own PACKAGE pin check.
# `bash run.sh install` is NOT used, and the reason is specific rather than
# stylistic: run.sh runs `stock/check_pins.py --checks package,stack` and exits 3
# on any drift, and the stack check drifts here by construction --
#
#   check_pins: DRIFT (4): stack.torch: torch 2.8.0+cu129 installed, pin 2.8.0 |
#   stack.flash_attn: flash_attn is not installed, pin 2.8.3.post1 |
#   stack.torch_build: torch 2.8.0+cu129 cuda 12.9, pin 2.8.0+cu128 cuda 12.8 |
#   stack.flash_attn_import: flash_attn does not import (ModuleNotFoundError)
#
# -- all four being the lock's own declared deviations, and all four NAMED rather
# than refused by every route the kit actually runs (pins.stack_report puts them
# in the ACTIVE line's notes=). The PACKAGE check is the one that matters and is
# run: it reads the PEP 610 direct_url.json the git install wrote and holds the
# installed E1 to the pinned commit, which is the kit's one hard refusal. It
# passes here:
#
#   check_pins: ok package.version: version=1.0.0
#   check_pins: ok package.commit: commit=bfd2620a602248499f3d2583d85a7ecddf0b6e02, route=vcs
#   check_pins: ok package.source: files=15, package_dir=.../site-packages/E1
#   check_pins: ok (package: every pin checked matches)
#
# --no-build-isolation keeps the editable install off the network (setuptools
# 80.9.0 is in the lock), and `-e` is required: opt/pyproject.toml says the kit
# tree "is resolved from the package location, so the install must stay
# editable". No --weights here: the weights step owns that.
install = """
{python} -m pip install -q --no-build-isolation --no-deps -e opt &&
{python} -I stock/check_pins.py --checks package
"""
#
# WHAT HAS BEEN RUN HERE, AND WHAT IT IS AND IS NOT EVIDENCE FOR.
# The kit's own dry run loads no model and scores nothing. It passes, for BOTH
# modes, and the second of those is a warning rather than a reassurance.
#
#   bash run.sh check --variant 600m --mode off     # rc 0
#   [e1-opt] weights=Profluent-Bio/E1-600m@52d959fb87a6 sha256=cfc108d4b98b (pinned)
#   [e1-opt] DRY-RUN mode=off variant=600m kit=v2.0 kit_mode=None gpu=NVIDIA GB10
#     stack=torch2.8.0-cu129-sm121 package=0.2.1 card=untested mib=124546
#     sm=sm121 det=0 pins=drift route=check notes="stack: torch 2.8.0+cu129 (pin
#     2.8.0); stack: flash_attn absent (pin 2.8.3.post1); flash_attn does not
#     import (ModuleNotFoundError ...): upstream takes its varlen-flex fallback,
#     the levers on the flash route cannot engage; card 'NVIDIA GB10' (cc 12.1,
#     124546 MiB) is outside the tested classes (a100|h100|h200) ..."
#     would_refuse=none
#
# Three things in that line are worth reading. The weights gate re-derives the
# snapshot path and the sha256 independently of this manifest and words it
# `(pinned)`. The GPU is found -- which was NOT the prediction made before
# running it, and the reason is instructive: stack.probe_gpu() tries nvidia-smi
# first because it is torch-free, and `--query-gpu=memory.total` returns `[N/A]`
# on this card's unified memory, so `int(float("[N/A]"))` raises and that probe
# returns None. It still works because `gates()` calls `pins.stack_report()`,
# which imports torch, BEFORE it calls probe_gpu(), so the torch probe -- tried
# last and only when torch is loaded -- answers `{'name': 'NVIDIA GB10', 'mib':
# 124546, 'cc': '12.1', 'sm': 'sm121', 'source': 'torch'}`. The same ordering is
# why the JIT cache key reads `torch2.8.0-cu129-sm121` and not `...-smNA`, and
# why the worker asks for it only after importing torch. And `card=untested`
# with the note is the card gate doing exactly what it documents: named, never
# refused.
#
# THE WARNING. `--mode exact` ALSO prints `would_refuse=none` and exits 0 on this
# box, with `kit_mode=eager` and the identical notes. It is wrong -- not about
# the gates it ran, but as a predictor. The KERNELS proof that refuses `exact`
# here (accel.py, REASON A above) fires at the first E1Predictor construction in
# a real model process, which a dry run never reaches, so the kit's own `check`
# cannot see a refusal that is certain. This is the openfold3 lesson in another
# shape: `check` exiting 0 is not evidence that the thing it checked will run.
# Do not read that line as grounds for setting mode = "exact".
#
# THAT IS A DRY RUN PLUS A TOOLCHAIN PROBE. Together with the triton and
# flex-attention compiles at the top of this file they say the environment can
# emit and launch code for this card, and that the weights are the pinned ones.
# They load no weights into the model, run no forward, and are not evidence that
# E1 produces correct scores on sm121 -- the Boltz-2 bring-up found a Triton
# kernel that compiled and then reported OutOfResources on this exact compute
# capability.
#
# FOR WHOEVER RUNS THE SMOKE. Export, in the model environment's own terms:
#   TOOLUNIVERSE_E1_PYTHON=$HOME/e1-venv/bin/python
#   HF_HOME=$HOME/.e1
# Everything else the worker sets itself (HF_HUB_OFFLINE, TRANSFORMERS_OFFLINE,
# PYTHONDONTWRITEBYTECODE, TRITON_PTXAS_PATH, TRITON_CACHE_DIR,
# TORCHINDUCTOR_CACHE_DIR) and MODEL_OPT / E1_OPT / MODEL_OPT_JIT_ROOT come from
# kit_launch.build_command. The acceptance test is FOUR CONSECUTIVE IDENTICAL
# requests and then a mixed-shape sequence, not one smoke: openfold3 passed a
# one-request smoke and failed deterministically on the second request of the
# same shape.
