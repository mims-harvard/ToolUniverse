# E1 (Profluent E1 1.0.0) -- the pinned stack for ToolUniverse's `e1` remote provider,
# installed into ~/e1-venv with `pip install --no-deps -r` (one pass, no resolver).
#
# PROVENANCE. This is the E1 optimization kit's own
# e1/environment/requirements.lock at commit f4f62fa6592ae4938d49b1757bea0cfeff9f468e,
# whose header reads: "`python -m pip freeze --all` of its interpreter, Python 3.12.10
# (/usr/local/bin/python, the CPython of the official python:3.12.10-slim-bookworm
# image: Debian 12, gcc 12.2), less this kit (e1/opt) and the shared core
# (common/opt_core) -- those two install editable on top".
#
# Of its 87 lines, 84 are reproduced here BYTE FOR BYTE. `pip freeze --all` of the
# built environment differs from the kit's file in exactly three lines, and all three
# are below with their reason. Everything else -- numpy 2.3.4, transformers 4.56.2,
# tokenizers 0.22.1, kernels 0.11.0, polars 1.35.2, the fourteen nvidia-*-cu12 12.8
# wheels, pip 25.1.1, the git install of stock E1 at commit bfd2620a and the
# debugpy direct-URL pin -- is the kit's pin unchanged.
#
# THE TORCH PIN IS NOT A RANGE, AND THAT IS WORTH STATING FIRST. Upstream E1's own
# pyproject declares `torch >=2.7.0,<2.9.0` (stock/PINS.json
# upstream.E1.declared_ranges.torch), which is why this kit looks like the one kit
# of the ten that does not pin torch exactly. It does. The RANGE is the upstream
# PACKAGE's dependency metadata; the KIT's lock pins `torch==2.8.0` and
# stock/PINS.json pins `pinned_stack.torch = "2.8.0"`,
# `torch_version_str = "2.8.0+cu128"`. And `--no-deps` means the range is never
# consulted by anything: the lock is the whole answer. Nothing resolved.
#
# ---------------------------------------------------------------------------------
# DEVIATION 1 -- torch==2.8.0 -> torch==2.8.0+cu129, from download.pytorch.org.
#
#   The kit's `torch==2.8.0` means, on x86-64, PyPI's CUDA 12.8 build:
#   torch.__version__ == "2.8.0+cu128". On linux-aarch64 PyPI's `torch==2.8.0`
#   is `torch-2.8.0-cp312-cp312-manylinux_2_28_aarch64.whl`, 102 MB, whose
#   torch/version.py reads
#
#       __version__ = '2.8.0+cpu'
#       cuda: Optional[str] = None
#
#   -- a CPU-ONLY build. There is no cu128 aarch64 wheel of torch 2.8.0 anywhere:
#   download.pytorch.org/whl/cu128/torch/ lists no aarch64 file at that version,
#   and the only CUDA aarch64 build of 2.8.0 that exists is +cu129. So this lock
#   takes that one. Same version, same source project, one CUDA minor newer, and
#   it is the narrowest substitution available rather than a choice.
#
#   What it changes, measured in the built environment:
#     torch.__version__  2.8.0+cu129   (kit: 2.8.0+cu128)
#     torch.version.cuda 12.9          (kit: 12.8)
#     get_arch_list()    ['sm_80', 'sm_90', 'sm_100', 'sm_120']
#   The fourteen nvidia-*-cu12 runtime wheels are left at the kit's 12.8 pins and
#   torch loads them (CUDA 12 minor-version compatibility; the sonames are
#   libcudart.so.12, libcublas.so.12 and so on). A bf16 matmul and a
#   torch.compile(flex_attention) call both run on this card -- see DEVIATION 3's
#   note on what that took.
#
#   The kit NAMES this and does not refuse it: pins.stack_report() compares the
#   distribution version against STACK["torch"] = "2.8.0" and puts
#   `stack: torch 2.8.0+cu129 (pin 2.8.0)` in the ACTIVE line's notes=.
#   `stock/check_pins.py --checks stack`, which `run.sh install` runs, DOES exit 3
#   on it; the provider's [kit] install therefore runs the package check only and
#   provider.toml says so.
#
# ---------------------------------------------------------------------------------
# DEVIATION 2 -- nvidia-cuda-nvcc-cu12==12.9.86 ADDED (87 lines, one of them new).
#
#   NOT A COSMETIC ADDITION: without it this provider cannot compile a single
#   kernel on a GB10, in either kit mode, and nothing the standard already checks
#   would have said so.
#
#   triton 3.4.0 -- the kit's pin, installed here at exactly that version --
#   generates PTX at run time and shells out to the `ptxas` inside its own wheel.
#   That binary is
#
#       Cuda compilation tools, release 12.8, V12.8.93
#
#   and CUDA 12.8 has no sm_121 of any spelling. Triton asks for one anyway
#   (backends/nvidia/compiler.py sm_arch_from_capability appends "a" above
#   capability 90, so cc 12.1 becomes sm_121a) and the result, measured here, is
#
#       ptxas fatal : Value 'sm_121a' is not defined for option 'gpu-name'
#       triton.runtime.errors.PTXASError: PTXAS error: Internal Triton PTX codegen error
#
#   sm_121 first appears in CUDA 12.9. triton 3.7.1 -- which four other providers
#   on this box run -- solves this by shipping a SECOND binary, `ptxas-blackwell`
#   from CUDA 13.1, and selecting it for the newer architectures; triton 3.4.0's
#   backends/nvidia/bin/ holds only cuobjdump, nvdisasm and the one 12.8 ptxas.
#
#   This wheel supplies a CUDA 12.9 ptxas that lists sm_120, sm_120a, sm_121 and
#   sm_121a, and the worker points TRITON_PTXAS_PATH at it when -- and only when --
#   triton's own does not list this card's target (resident/e1_resident_worker.py
#   `_point_triton_at_a_usable_ptxas`). With it in place, measured on this card:
#
#       OK triton 3.4.0 kernel compiled+launched on sm_121 in 0.6s max|err|=0.0e+00
#       OK torch.compile(flex_attention) on sm_121 in 1.9s out=(1, 4, 128, 64)
#
#   The 12.9 choice is also the vendor's. triton 3.6.0 and 3.7.1 solve the same
#   gap by bundling a SECOND binary beside the 12.8 one -- `ptxas-blackwell`,
#   which is release 12.9 in triton 3.6.0 and 13.1 in 3.7.1 -- and triton 3.4.0
#   simply predates that. So this wheel supplies one version earlier exactly what
#   Triton itself started shipping one version later.
#
#   NOTE THE STAGE. This is the ptxas stage. Triton's OTHER sm_121 failure is at
#   the LLVM stage and belongs to triton 3.3.x, whose libtriton.so does not carry
#   sm_121/sm_121a at all; it presents as `LLVM ERROR: Cannot select: intrinsic
#   %llvm.nvvm.shfl.sync.bfly.i32` and cannot be caught. triton 3.4.0 DOES carry
#   both targets, which is why the pinned version is the right side of that
#   boundary -- see provider.toml point 2b, where it is verified by running a
#   block reduction and the real hub RMSNorm kernel rather than by reading
#   strings.
#
#   It must be 12.9 and NOT the CUDA 13.0 toolkit at /usr/local/cuda-13.0, even
#   though that ptxas knows sm_121a: triton 3.4.0's `ptx_get_version` is a hard
#   table that ends at CUDA 12 and raises
#   `RuntimeError: Triton only support CUDA 10.0 or higher, but got CUDA version: 13.0`.
#   Measured, not guessed.
#
#   87 MB on disk. Nothing else in this environment imports it; it exists to be
#   exec'd by triton.
#
# ---------------------------------------------------------------------------------
# DEVIATION 3 -- flash_attn 2.8.3.post1 REMOVED (its line is the x86-64 wheel).
#
#   The kit pins it by direct link to the Dao-AILab release asset:
#   `flash_attn-2.8.3.post1+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl`.
#   That release publishes no aarch64 file, and no aarch64 build of flash-attn
#   2.8.3.post1 for torch 2.8 / CUDA 12 exists on any index. The only
#   flash-attn 2.8.3.post1 aarch64 wheel on this host is the one the ESMFold2 kit
#   ships (esmfold2/stock/wheels/), and it is not usable here: its
#   flash_attn_2_cuda extension has `libcudart.so.13` in its DT_NEEDED and was
#   built against torch 2.13 / CUDA 13.0, while this environment is torch 2.8 /
#   CUDA 12.9.
#
#   CONSEQUENCES, both of which provider.toml acts on:
#
#   * Stock E1 degrades on its own, by design, and says what it did.
#     E1/model/flash_attention.py L5-9 catches the ImportError, sets
#     flash_attn_varlen_func = None, and `is_flash_attention_available()` then
#     returns False, so E1/model/attention.py L299-311 sends the within-sequence
#     layers to `varlen_flex_attention_func` instead. That is the same route
#     upstream takes under its own `USE_FLASH_ATTN=0`. The kit calls it "a
#     different stock" (stock/PINS.json stock_environment.reads.USE_FLASH_ATTN)
#     and it is a supported one.
#
#   * The kit's `exact` mode REFUSES rather than degrades, which is why this
#     provider ships [kit] mode = "off". modes.py names all three accelerators
#     for every mode (KERNELS_ALL = flash_attn, hub_layernorm, flex_attention) and
#     accel.py's proof raises SystemExit(3) under a kit mode for any one of them
#     whose word in the process is not `engaged:<impl>@<pinned version>`:
#     "the mode's levers run on them, so the mode cannot run here (mode off runs
#     the stock's own fallback route)". flash_attn absent is such a word. See
#     provider.toml [kit] for the second, independent reason `exact` cannot
#     engage here even with flash-attn present.
#
#   pins.stack_report() names it -- `flash_attn absent (pin 2.8.3.post1)` -- and
#   stack_imports() adds "flash_attn does not import ... upstream takes its
#   varlen-flex fallback, the levers on the flash route cannot engage". Named,
#   not refused.
#
# ---------------------------------------------------------------------------------
# NOT DEVIATIONS, but worth recording because they look like ones.
#
#   triton==3.4.0 is BYTE-IDENTICAL to the kit's pin, and had to come from
#   somewhere else. PyPI's `triton` publishes aarch64 wheels only from 3.5.0
#   ("Could not find a version that satisfies the requirement triton==3.4.0 (from
#   versions: 3.5.0, 3.5.1, 3.6.0, 3.7.0, 3.7.1, 3.8.0)"), and
#   download.pytorch.org publishes
#   triton-3.4.0-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl.
#   Same distribution name, same version, so importlib.metadata.version("triton")
#   == "3.4.0" and the kit's pin check sees no drift at all.
#
#   biotite==1.5.0 and biotraj==1.2.2 publish no aarch64 wheel and are built from
#   their sdists here. Same versions; a C compiler is needed at install time,
#   which route C requires anyway (STOCK.md's Stack section).
#
#   debugpy's `@ https://files.pythonhosted.org/.../debugpy-1.8.17-py2.py3-none-any.whl`
#   is kept verbatim. It is a URL pin, but to a `py2.py3-none-any` wheel, so it is
#   architecture-independent and needs no substitution -- the kit's header explains
#   why it is pinned by URL ("by version alone pip would take the cp312 manylinux
#   build").
#
#   `E1 @ git+https://github.com/Profluent-AI/E1.git@bfd2620a...` is kept verbatim
#   and is the route the kit's pin check requires: it writes a PEP 610
#   direct_url.json carrying the commit id, which pins.assert_stock_commit() reads
#   and which an archive or path install cannot provide. Verified in the built
#   environment:
#     {"url": "https://github.com/Profluent-AI/E1.git", "vcs_info":
#      {"commit_id": "bfd2620a602248499f3d2583d85a7ecddf0b6e02", ...}}
#
#   The kit package itself (e1/opt, `e1_opt`) is NOT in this file. It installs
#   editable on top, in the kit step, because its own pyproject says "the install
#   must stay editable". e1/opt declares `dependencies = []` and the kit tree
#   imports nothing from common/opt_core, so unlike rosettafold3 there is no
#   second editable install.
#
#   pip builds stock E1 (hatchling) and biotite/biotraj in isolated build
#   environments and fetches those backends from PyPI at install time, so this
#   step needs the network even though every runtime pin here is exact.
#
# The ~/e1-venv this was measured in was made with `uv venv --seed
# --managed-python --python cpython-3.12.10`, which is the kit's own route-C
# recipe and gives the 3.12.10 its lock was frozen on. uv is used rather than the
# stdlib `python -m venv` deliberately: uv writes a `_virtualenv.pth`, which
# broke OpenFold3's kit-hook detection, but THIS kit scans no .pth files and has
# no rival-hook check -- `grep -rn 'pth' e1/opt/e1_opt/*.py` finds only its own
# e1_opt_autoload.pth in docstrings, and the kit's only meta-path finders are its
# own (e1_opt/_autoload.py Finder, e1_opt/accel.py install), neither of which
# inspects what else is on sys.meta_path.
--extra-index-url https://download.pytorch.org/whl/cu129
