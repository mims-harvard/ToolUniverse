[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "gpnstar"
# gpnstar/opt declares `dependencies = []` but its install step (`run.sh install`) pip-
# installs the shared core from ../common/opt_core editable, so `common` is needed. The
# checkout is shared by every provider pinning this commit; the sparse set is the union.
sparse = ["gpnstar", "common"]
package = "gpnstar_opt"
#
# ACTIVATION is the common form (30 of 36 kits): the mode variable plus the kit's own
# `opt/gpnstar_opt_autoload.pth`. THE VARIABLE IS `GPNSTAR_OPT`, read off the kit
# (`_autoload.ENV = "GPNSTAR_OPT"`, opt/gpnstar_opt/_autoload.py:15; the .pth's own guard
# header says `env=GPNSTAR_OPT` too), and kit_launch's probe found it there. With it set
# to `exact` a meta-path finder waits for the first import of `gpn.star.inference` and arms
# the three wrapper constructors (MLMforVEPModel, MLMforLogitsModel, ModelCenterEmbedding)
# so that every model one builds is placed on the GPU with the levers applied. Nothing is
# modified or shadowed; with the variable unset NOTHING of the kit is imported.
mode = "exact"
#
# THE KIT HAS ONE MODE. `exact`: outputs bitwise equal to stock's under whatever numerics the
# caller runs. Measured here, the kit CLI (`GPNSTAR_OPT=exact gpn star vep`) and stock
# `gpn star vep` write byte-identical parquet on the 8-variant example, and this worker's
# scores_sha256 over the same 8 variants is the same digest as both
# (06efcb8415129e2c39165cfb8034d2d08c1da5867201efee28718627e386cf9c, sha256 over the
# big-endian float64 of each score).
#
# NO ENVIRONMENT ROW, and this is the "absence" case rather than the "failed to read" one:
# there is no gpnstar_opt.modes, so there is no resolve() of any shape, and STOCK.md
# Variables says the package "reads GPNSTAR_OPT and HF_HOME ... and nothing else; it sets no
# variable and no torch flag". The probe will record `modes_error` and return {}.
env_row = "none"
env_row_reason = "gpnstar_opt has no modes module and so no resolve() of any shape; _autoload.ENV = GPNSTAR_OPT is the whole switch, and STOCK.md Variables says the kit reads only GPNSTAR_OPT and HF_HOME and sets no variable of its own"
#
# `graph` IS DECLINED, AND NOT BY `levers_off`. This kit NEVER READS MODEL_OPT_LEVERS_OFF
# (`grep -rn LEVERS_OFF opt/` returns nothing, exactly as for boltzgen and evo2), so
# `levers_off = ["graph"]` would export a variable the kit ignores and look like a
# decision. The worker instead calls the kit's own public `unpatch_graphs(model)`
# (gpnstar_opt.accel.api), which releases the graphs and puts `model.forward` back to the
# function the runner wrapped. The argument, all of it measured on this card with the
# same 29 batch shapes (B x L for B in 2..16 at L=128, and L in 64 / 256 / 512):
#
#                                     peak reserved after the 29 shapes
#     graph on  (the kit as shipped)    24.34 GiB   (~0.8 GiB per distinct shape)
#     graph off (declined)               4.36 GiB   (flat after the largest shape)
#
# The lever captures one whole-forward CUDA graph per distinct (batch, window) shape up to
# 2048 tokens and keeps every graph's activation pool; nothing in the kit bounds the
# number of shapes, and a request chooses its own batch_size and window_size, so the VRAM a
# held worker needs would be a function of how many different shapes anyone had ever asked
# it for. No [gpu] vram_budget_gb can state that, and a number a host cannot add up is not
# a tenant. What it costs: per-forward launch overhead at small batches (the kit's own
# note: ~1,450 launches a forward, GPU ~half idle at B=8). Measured here, graph-off wall
# times were not slower than graph-on over the same shapes on a contended card -- which
# says the card was not launch-bound, NOT that the lever is worthless on a quiet one. A
# host that wants it sets TOOLUNIVERSE_GPNSTAR_GRAPHS=on and measures its own memory.
# `gpnstar_opt`'s ACTIVE line still names `graph` and its LEVER line still reads
# state=on: both are written before the worker declines it, and the worker's own ready
# line and every reply carry `levers_declined = ["graph"]`.
levers_declined = ["graph"]
#
# NO [kit.env] TABLE, deliberately. The knobs this kit documents are GPNSTAR_OPT (supplied)
# and HF_HOME (the weights root, supplied) and Triton's TRITON_CACHE_DIR, which is left at
# its default under ~/.triton and persists across worker lifetimes. There is no size gate
# or cap of the openfold3 kind to state: the ceilings live in the worker, where a reviewer
# of this provider reads them, and in the tool.
#
# NO TF32. Stock's speed flag is `--tf32` and the kit follows whatever the caller sets;
# this worker sets nothing, so the numerics are PyTorch's defaults (fp32, matmul TF32
# off), and launch.py REMOVES NVIDIA_TF32_OVERRIDE and TORCH_ALLOW_TF32_CUBLAS_OVERRIDE
# from the child so that an operator's shell cannot move them (verified in
# /proc/<worker pid>/environ with both exported).
#
# `run.sh install` is two steps: `pip install -e ../common/opt_core -e opt` (the shared
# core and the kit with its autoload .pth), then `stock/check_pins.py`, which compares
# the installed gpn module by module against the carried archive and refuses by name any
# gpn, transformers or stack pin off its pin. No --weights here: the weights step owns that.
install = "bash run.sh install"
