# GPN-Star's model environment -- the stack this provider was built against.
#
# This is the optimization kit's own environment/requirements.lock (gpnstar/environment/
# requirements.lock at commit f4f62fa6592ae4938d49b1757bea0cfeff9f468e): `pip freeze --all`
# of the kit's tested interpreter, 86 distributions, less the kit (gpnstar/opt) and the
# shared core (common/opt_core), which `[kit] install` puts on top editable. Every one of
# the 85 distribution pins below is the kit's, unchanged.
#
# ONE DEVIATION, in form and not in version: the kit's lock names stock gpn by the path of
# the byte-frozen archive it carries (`./gpnstar/stock/gpn-6f28c81b.tar.gz`, relative to the
# bundle's top directory). This step runs BEFORE the kit is checked out, and pip reads a
# relative path against whatever directory it runs in, so that line cannot be honoured
# here. It is replaced by the byte-equivalent line the kit's own STOCK.md and PINS.json
# (upstream.gpn.install) both name:
#     gpn @ git+https://github.com/songlab-cal/gpn@6f28c81bcbfe7d65cb6d8ece9ce88f87ca583791
# the same commit. `[kit] install` runs `run.sh install`, whose stock/check_pins.py then
# compares the installed gpn module by module with the archive and refuses a difference by
# name, so the replacement is checked, not trusted. pip builds it with hatchling in an
# isolated environment fetched from the index: network and git are needed at this step.
#
# Python 3.13 (upstream requires >=3.13,<3.14). The kit measured 3.13.15; uv here has 3.13.14.
#
# torch 2.13.0 is PyPI's CUDA 13.0 build (2.13.0+cu130). Its aarch64 wheel carries an
# sm_120 cubin, which runs on this card's sm_121 -- the same way boltz's 2.12.0+cu130 does.
# That puts this provider on the >= 2.7 side of STANDARD section 10's torch question, so
# the GPU is open: [gpu] policy = "required".
#
# Rebuild:
#   uv venv --seed --managed-python --python 3.13 ~/gpnstar-venv
#   export TOOLUNIVERSE_GPNSTAR_PYTHON=~/gpnstar-venv/bin/python
#   tu remote setup gpnstar --only environment
