# Enformer's model environment — the exact stack the measurements in
# ../provider.toml were taken on, as `pip freeze --all` of it.
#
# NOT ToolUniverse's, and not Boltz-2's either: this pins torch 2.13.0 and
# numpy 2.4.6 where Boltz-2 pins 2.12.0 and 1.26.4. Two models, two
# environments, one socket each — that is what the separation is for.
#
# ONE DEVIATION from the kit's own lock, and it is architectural. The kit pins
#
#   nvidia-cudnn-frontend @ https://files.pythonhosted.org/.../
#       nvidia_cudnn_frontend-1.27.0-cp311-cp311-manylinux_2_27_x86_64...whl
#
# by direct URL to the x86_64 wheel — its README states Linux x86-64 for this
# route. The same version publishes a cp311 aarch64 wheel, so this file pins it
# by version instead and pip resolves the right one. Nothing else changed, and
# `run.sh install`'s own pin check still passes. On x86_64 the kit's own lock is
# the one to use.
#
# Rebuild (Python 3.11, an NVIDIA driver the stack's CUDA build needs, a C
# compiler on PATH):
#
#   uv venv --seed --managed-python --python 3.11.12 ~/enformer-venv
#   . ~/enformer-venv/bin/activate
#   python -m pip install --no-deps -r requirements.lock
#   PYTHON=$(which python) bash <kit>/enformer/run.sh install
#
# --no-deps is deliberate: the list is complete, and letting a resolver
# re-derive it is how a stack stops being the one that was measured. The kit
# itself (enformer_opt) installs editable on top and is not in the freeze.
