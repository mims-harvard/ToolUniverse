[kit]
upstream = "https://github.com/anthropics/uplifting-biomolecular-modeling"
commit = "f4f62fa6592ae4938d49b1757bea0cfeff9f468e"
subdir = "atlasfold"
# The kit's kernels come from common/opt_core, which this checkout shares with
# the boltz, enformer, chai1, openfold3, rosettafold3, esmfold2, esmc, boltzgen
# and af3_torch providers; the sparse set is the union of what its providers
# declare.
sparse = ["atlasfold", "common"]
package = "atlasfold_opt"
#
# ACTIVATION is the common form, shape 1 of the four: `opt/atlasfold_opt_autoload.pth`
# imports `atlasfold_opt._autoload` at interpreter start, and with the mode
# variable set a meta-path finder waits for the first import of
# `atlasfold.model`, `atlasfold.runner`, `atlasfold.runner_multimer` or
# `atlasfold.pretrained` and calls `atlasfold_opt.enable(word)` before letting
# that module's body run. No `worker_launch`, no replacement entry script, no
# patched tree on disk.
#
# THE MODE VARIABLE'S NAME IS READ, NOT DERIVED. `atlasfold_opt.modes` has no
# module-level `ENV` (and no `resolve()` either -- see env_row), so
# `kit_launch`'s probe falls through to `_autoload.ENV`, which is
# "ATLASFOLD_OPT". The generated `.pth`'s own header line states the same three
# facts for a reader: `package=atlasfold_opt env=ATLASFOLD_OPT tag=atlasfold-opt
# exit=3`.
#
# `off` IS THIS KIT'S DOCUMENTED DEFAULT, which is unusual and is worth
# understanding before choosing anything else. It is not a soft default: under
# `--mode off` the kit runs `python -c "from atlasfold.cli import main;
# main()"` in a CLEAN SUBPROCESS with no ATLASFOLD_OPT / AFO_ / FPF_ /
# OPT_CORE_ variable in its environment and `opt/` off its PYTHONPATH
# (`atlasfold_opt.stock_pred`, `PINS.json:stock_environment`), so that "off"
# cannot accidentally mean "a kit mode that failed to engage". For a RESIDENT
# provider that makes `off` the one mode that cannot be used at all: it is a
# fresh process per prediction by construction, which is the opposite of
# holding the model. A provider here either runs a kit mode or is not resident.
#
# WHY `big`, AND IT IS A MEASURED-CONTEXT DECISION RATHER THAN A PREFERENCE.
# The kit's four modes are `off` (stock), `exact` (bit-identical outputs under
# --det 1), `fast` (the fused pair kernels, bf16/TF32 in the LM and diffusion
# module, and the denoiser replayed as a CUDA graph) and `big` (= `fast` minus
# `denoiser_graph` and `graph_reuse`, same numerics, lowest peak memory). Both
# `fast` and `big` resolve on this card: `run.sh check --config h100 --mode
# <m>` returns rc 0 for all three kit modes, and a plain `import
# atlasfold.model` under either word prints the kit's ACTIVE line with
# `skipped=none`. `big` is what ships, for three reasons in descending order of
# weight.
#
#  1. `alloc_expandable` is ON under `big` and OFF under `fast`, and the kit
#     says so itself. Its rule is that beside a CUDA-graph lever in the row it
#     steps aside by name, "the core does not compose its allocator policy with
#     graph capture by default". Measured on this host, same process, same
#     everything else:
#
#       ATLASFOLD_OPT=big   LEVER name=F7.expandable_segments state=on
#                           via=runtime_api conf=expandable_segments:True
#                           effective=true source=snapshot
#       ATLASFOLD_OPT=fast  LEVER name=F7.expandable_segments state=skipped
#                           reason=graph_lever_in_row:denoiser_graph
#
#     So `fast` pays the graph pool's reserved memory AND loses the allocator
#     policy that would have offset it. For the provider whose declared budget
#     is the headline number, that is the wrong side of the trade. (The kit
#     offers `AFO_ALLOC_EXPANDABLE=graphs` to compose the two under `fast`; it
#     is deliberately NOT set here, because the core's own note is that graph
#     private pools are not returned under expandable segments, and composing
#     them on an unmeasured card is not a thing to do blind.)
#
#  2. `graph_reuse` is designed for a BATCH run and a resident worker is not
#     one. Under `fast` it keeps the last item's graph, its private pool, its
#     static input buffers AND every tensor the captured kernels read by
#     reference -- `pair_bias`, the `sampler_hoist` leaves, the batch dict --
#     alive until an item of a DIFFERENT (B, L) arrives. Between two folds of
#     one length that is exactly the win residency exists for. Between two
#     REQUESTS it means an idle provider holds `kept_gib` of a shared card with
#     nobody asking, for as long as the next caller takes, which is the one
#     thing a `shareable = true` provider must not do quietly. The kit reports
#     the amount (`kept_gib` / `kept_gib_max` on its LEVER line) and offers
#     `AFO_GRAPH_REUSE=0`; `big` removes both levers by definition.
#
#  3. `denoiser_graph`'s one unexpected failure is unrecoverable IN A LONG-LIVED
#     PROCESS, by its own account: on `capture_failed` "torch (2.7) keeps the
#     CUDA RNG generator and the caching allocator in capture state after a
#     failed stream capture, so the process cannot draw noise, empty its cache
#     or capture again -- the item ends there, loudly". For a per-request
#     subprocess that costs one prediction. For a worker held for hours it
#     costs every prediction after it, and the standard's own section 12 is the
#     story of a graph lever that passed a smoke and died on request two. The
#     kit's dry run does report `KERNEL cuda_graph ok=True routed=True
#     resolved=torch.cuda.graphs@2.7.1` on this card, so this is a
#     tail-risk argument and not a known failure -- which is why it is third.
#
# WHAT `big` GIVES UP, stated plainly: the denoiser is issued as ~600 kernel
# launches per step instead of one replayed graph, which is the kit's own
# description of what `denoiser_graph` buys. Every other lever of the `fast`
# line is still in the row -- `trimul_v4`, `flash_triattn`, `triatt_block`,
# `triattn_core`, `lm_sdpa`, `pair_transition`, `pair_block_residual`,
# `dit_apb`, `atom_tf32/kdedup/rows/bf16`, `diffusion_bf16`, `sampler_hoist`,
# `sampler_hostsync` -- and `big`'s numerics are `fast`'s, not `exact`'s.
# Changing this line to "fast" is a one-word change and the two should be
# measured against each other on the ladder; the kit's own guidance is the
# reverse of the usual ("Use `big` when `fast` runs out of memory"), and if
# `fast` turns out to cost little more here it is the better default.
mode = "big"
#
# THE ONE LEVER OF THE `big` LINE THAT CANNOT WIN ON THIS CARD, switched off
# through the kits' own ablation door rather than patched. `atom_sdpa` routes
# the denoiser's windowed atom attention through torch's fused SDPA kernels,
# and on compute capability 12.1 under torch 2.7.1 no fused backend accepts the
# call. The kit's own dry run says so before anything runs:
#
#   [atlasfold-opt] KERNEL sdpa_fused_fp32_window ok=False routed=False
#   resolved=None reason=RuntimeError: No available kernel. Aborting execution.
#
# and torch's own warnings name each refusal in turn: "Mem Efficient Attention
# only supports gpu architectures in the range [sm50, sm120]. Attempting to run
# on a sm 12.1 gpu", "Flash Attention does not support non-null attn_mask",
# "Expected query, key and value to all be of dtype: {Half, BFloat16}. Got
# Query dtype: float". The operands are fp32 with an additive bias, so the
# mem-efficient kernel is the only candidate and its architecture ceiling is
# one minor version below this card.
#
# The lever DOES degrade -- its wrapper catches the RuntimeError and runs the
# stock statement -- but `no_fused_backend` is deliberately NOT in its expected
# set ("a torch whose fused kernels decline the call: stock statement, gate
# refused"), so its gate would refuse at exit and `atlasfold_opt.cli.cmd_pred`
# folds a refused gate into exit code 3. Left alone, this provider would
# produce correct structures and report failure on every single request.
#
# `atom_sdpa` is THE ONLY lever of the row in that position, which was checked
# rather than hoped: every other kernel lever treats a card it has no measured
# row for as an EXPECTED fallback -- `arch:`, `no-cell:`, `no_row:`,
# `stock_row:`, `refused:` are all in their expected prefixes
# (`registry.LEVERS[*]["expected"]`) -- so `triatt_block` serving from
# `cells=10.3|*;inherited_cc:unmeasured(12.1->10.3)` and `triattn_core` reading
# `triattn_native=cc_12.1:_measured_on_9.0_/_8.0_only` are both fine and both
# counted. This is the same inherited-cell situation that cost OpenFold3 its
# first five folds, and it is harmless here for one reason: this kit has no
# equivalent of `OPENFOLD3_OPT_PAIR_STRICT=1`. There is no STRICT knob anywhere
# in `atlasfold_opt`, so a fallback is a fallback.
#
# The ablation is the kit's sanctioned move and it reads MODEL_OPT_LEVERS_OFF
# itself (`atlasfold_opt.ablation.ENV`), unlike boltzgen's kit which ignores it.
# Verified on this host, `ATLASFOLD_OPT=big MODEL_OPT_LEVERS_OFF=atom_sdpa`:
#
#   ACTIVE mode=big n_gpu=1 gpu=NVIDIA GB10(sm121) levers=<29 names>
#   skipped=none ablated=atom_sdpa stock=atlasfold@992067e cueq=0.10.0
#   torch=2.7.1+cu128 core=0.5.228.0 kit=0.2.44 det=0 fill=na
#   EXIT ... gates_refused=none
#   LEVER name=LOCAL.atlasfold.atom_sdpa state=off reason=levers_off
#
# Note what the ablation does NOT do here: it does not make the activation
# PARTIAL. This kit's `stack.activate` computes `partial` from
# `levers_skipped`, and an ablated lever is never installed, so it is not
# skipped -- the ACTIVE line simply gains `ablated=atom_sdpa`. Nothing else
# comes off with it: `ablation.reasons("big", ["atom_sdpa"])` returns exactly
# `{'atom_sdpa': 'levers_off'}` because no lever of this kit `requires` it
# (only `triattn_core`, `pair_block_residual` and `graph_reuse` have
# requirements, and none names atom_sdpa).
#
# The alternative door, `AFO_ATOM_SDPA=0` in [kit.env], also works and is
# arguably cheaper -- `disabled` IS in the lever's expected set, so the gate
# passes and the mode's row stays intact. It is not what ships because
# `levers_off` is a first-class field of this manifest that a reviewer reads,
# and it puts the ablation on the kit's own ACTIVE line instead of leaving an
# installed-but-inert wrapper in the call path.
#
# AND THEN THE REAL WALL: TRITON 3.3.1 CANNOT EMIT CODE FOR THIS CARD, so every
# Triton-backed lever of the row comes off as well. The first smoke died here,
# after a clean activation and a model load, at `Starting monomer inference`:
#
#   'sm_121a' is not a recognized processor for this target (ignoring processor)  [x12]
#   LLVM ERROR: Cannot select: intrinsic %llvm.nvvm.shfl.sync.bfly.i32
#
# reported by the supervisor as `smoke_protocolerror -- peer closed the
# connection mid-message`, which is the correct description of a worker that
# died without speaking: `abort()` is not an exception.
#
# `triton==3.3.1` is in the KIT'S lock beside torch 2.7.1+cu128. Its bundled
# LLVM does not know `sm_121a`; it ignores the processor, falls back to a default
# subtarget, and cannot lower the warp shuffle every block reduction emits.
# Measured on this machine, the same `tl.sum` kernel on the same card:
#
#   triton 3.3.1 (this provider)   LLVM ERROR: Cannot select: ... shfl.sync.bfly
#   triton 3.6.0 (openfold3-venv)  OK
#   triton 3.7.1 (esmfold2-venv)   OK
#
# Two fixes that do NOT work, measured so nobody repeats them:
#
#   * A newer ptxas. The failure is UPSTREAM of ptxas. A one-add kernel with no
#     shuffle does reach ptxas and fails there
#     (`ptxas-blackwell fatal : Value 'sm_121a' is not defined for option
#     'gpu-name'`), and pointing Triton at a CUDA 12.9 ptxas fixes exactly that
#     one -- `OK elementwise` -- while the shuffle kernel still aborts,
#     identically, with and without it. Note also that triton 3.3.1 reads
#     `TRITON_PTXAS-BLACKWELL_PATH`, not `TRITON_PTXAS_PATH`, for a card at
#     cc >= 10.0, because `get_ptxas(arch)` picks the binary NAME first and
#     `_path_to_binary` derives the variable from it. (For the 3.4-3.5 band a
#     12.9 ptxas IS the whole fix; triton 3.6.0 ships a `ptxas-blackwell` at
#     exactly release 12.9, so that workaround is the vendor's own answer one
#     version early.)
#   * `TRITON_OVERRIDE_ARCH`. It does reach `options.arch` (verified:
#     `parse_options({}).arch == 'sm120'`), but the target string LLVM complains
#     about is set on the MLIR module, and forcing `sm_arch_from_capability` to
#     return `sm_120a` -- or even `sm_90a` -- leaves the abort in place.
#
# Raising triton above 3.3.1 would be a deviation from the kit's pinned stack,
# which `stock/check_pins.py` and this provider's own lock both exist to
# prevent. It is not done here.
#
# WHICH LEVERS, MEASURED RATHER THAN GUESSED. `triton.runtime.jit.JITFunction.run`
# was trapped during a fold -- made to record and raise a Python error instead of
# reaching LLVM -- so the process survived and named every Triton kernel the row
# reaches. Under mode `big` at 35 residues, seven kit cells did:
#
#   trimul_v4         opt_core.kernels.fpf_trimul.kernels:_k_ln_rows
#   flash_triattn     flash_triattn:_bias_prep, flash_triattn_k2:_bias_prep,
#                     triatt_k2b:_bias_prep
#   pair_transition   opt_core.kernels.fpf_transition_v2.kernel:_pair_transition_kernel
#   transition_exact  fpf_transition.transition:_fused_transition_kernel
#   exactln           opt_core.kernels.ln_proj:_ln_rows_kernel,
#                     opt_core.kernels.lnl_fused:_fused_transition_kernel
#   atom_rows         opt_core.kernels.dtk_kernels:_ln_mod_kernel
#
# The other five below are ablated as well, and that is the most important line
# in this file: EVERY KERNEL LEVER OF THIS KIT IS GATED AT 512 TOKENS
# (`min_tokens=512` on their own LEVER lines), so a 35-residue smoke exercises
# NONE of them. A smaller ablation list passes the smoke and aborts on the first
# real request. Measured exactly that way: the 13-name list below folds 35 AND
# 600 residues with zero Triton launches, while stopping at the seven observed
# names folds 35 and aborts at 600.
#
# WHAT IS LEFT IS STILL WORTH HAVING, and that was measured too rather than
# asserted. 17 levers survive -- `pae_stream`, `pae_stream_m`,
# `conf_transition_chunk`, `pair_transition_chunk`, `distogram_offload`,
# `relpos_lazy`, `alloc_expandable`, `sampler_hoist`, `sampler_hostsync`,
# `atom_kdedup`, `atom_tf32`, `atom_bf16`, `ln_bf16`, `diffusion_bf16`,
# `lm_sdpa`, `output_overlap`, `lever_report` -- and they are precisely the
# MEMORY levers, which is this kit's stated selling point. One target, 1 sample /
# 1 recycle / 2 steps, `--kernel torch` throughout, peak reserved:
#
#                                   35 residues        600 residues
#   stock AtlasFold, no kit         12.45 GiB          24.24 GiB
#   this configuration              12.06 GiB          19.64 GiB
#
# 4.60 GiB (19%) less at 600 residues, with every fused kernel forgone. That is
# the kit's memory half doing its job without its kernel half.
levers_off = [
    "atom_sdpa",
    "trimul_v4",
    "flash_triattn",
    "triattn_exact",
    "triatt_block_exact",
    "triatt_block",
    "triattn_core",
    "transition_exact",
    "pair_transition",
    "pair_block_residual",
    "exactln",
    "dit_apb",
    "atom_rows",
]
# The kit accepts all thirteen by name and reports them: the ACTIVE line reads
# `levers=<17 names> skipped=none ablated=atom_sdpa,trimul_v4,flash_triattn,
# triattn_exact,triatt_block_exact,triatt_block,triattn_core,transition_exact,
# pair_transition,pair_block_residual,exactln,dit_apb,atom_rows` and the exit
# census reads `gates_refused=none` -- so this is an ablation the kit records,
# not a configuration it tolerates silently.
#
# A HOST WHOSE TRITON KNOWS ITS CARD SHOULD DELETE TWELVE OF THESE. Only
# `atom_sdpa` is forced by the GPU itself (torch's fused SDPA architecture
# ceiling); the other twelve are forced by triton 3.3.1 and nothing else. The
# worker decides which case it is at start-up with a child-process probe -- it
# compiles one `tl.sum` kernel, because that is the construct that emits the
# shuffle -- and REFUSES TO START, by name, if the probe fails while a
# Triton-backed lever is still in the row. An LLVM abort cannot be caught, so
# the decision has to be made before the first compile; the alternative is a
# worker that passes the smoke and dies on the first request past 512 tokens.
#
# ONE MORE THING THE KIT CANNOT BE BLAMED FOR, and it is the harshest finding
# here: the PINNED STACK CANNOT FOLD A USEFUL SIZE ON THIS CARD EVEN WITH THE
# KIT OFF. `atlasfold.utils.kernel.cuequiv_available` resolves upstream's default
# `--kernel auto` to `cuequiv` whenever `cuequivariance_torch` merely imports,
# and cuEquivariance 0.10.0 ships its own Triton kernels. Measured with no kit
# word in the environment at all:
#
#   stock, --kernel auto,   35 residues   FOLD OK, 2 cif
#   stock, --kernel auto,  200 residues   ABORT (cuequivariance_ops.triton.
#   stock, --kernel auto,  400 residues   ABORT   fused_layer_norm_triton:
#   stock, --kernel auto,  500 residues   ABORT   layer_norm_transpose_
#   stock, --kernel auto,  600 residues   ABORT   forward_kernel)
#   stock, --kernel torch, 600 residues   FOLD OK, 2 cif, 24.24 GiB
#
# So `--kernel torch` is not an optimization choice, it is the only backend that
# folds. The worker passes it -- a stock CLI flag, not a lever -- whenever its
# Triton probe fails, and passes upstream's `auto` when it succeeds. The cost is
# the cuEquivariance triangle kernels, which are where upstream's own speed comes
# from; the benefit is a provider that answers.
#
# And it means the 35-residue smoke is the ONE length that would have worked
# under `auto`. A green smoke here would have been the most misleading result
# this provider could produce.
#
# THIS KIT KEEPS NO ENVIRONMENT ROW, and the declaration is required because an
# absence and a failed read look identical from the launcher.
# `atlasfold_opt.modes` has no `resolve()` AT ALL -- it is 30 lines holding
# `MODE_NAMES`, four literal lever rows, `PLANNED` and `levers_of(mode)` -- so
# both shapes `kit_launch`'s probe tries raise AttributeError, `modes.MODES`
# comes back as the four mode names, and `env` comes back empty. There is also
# no `alloc.env_row()` (this kit's allocator lever is `hooks/alloc_expandable`,
# which applies the policy to its own live allocator through
# `torch.cuda.memory._set_allocator_settings` rather than handing a variable to
# a child) and no `modes.jit_cache_key()`.
env_row = "none"
env_row_reason = """atlasfold_opt.modes has no resolve() and no ENV: it holds
only MODE_NAMES, the four literal lever rows, PLANNED and levers_of(). This
kit's deployment variables live in per-card `configs/<card>.env` files that
`run.sh` sources -- h100, h200, a100 and b300 -- exactly as esmfold2's, esmc's
and rosettafold3's do, and it ships none for sm121. Those files set only three
things and all three are already supplied: ATLASFOLD_WEIGHTS_DIR by [weights]
root_env, MODEL_OPT_JIT_ROOT by kit_launch, and AFO_TARGET_GPU / KMP_AFFINITY
by [kit.env] below. The mode word itself is never in a config file -- every one
of them says so in its first comment line, "Never the mode" -- so nothing about
the mode is lost by having no row."""
#
# `run.sh install` is two editable installs plus the stock tree's digest check.
# THE FIRST LINE IS NOT THE KIT'S and has to be here: unlike boltz2's and
# chai1's, this kit's `run.sh install` does NOT install `common/opt_core` -- it
# puts it on PYTHONPATH instead (`export PYTHONPATH="$HERE/opt:$HERE/stock/src/src:$HERE/../common/opt_core"`),
# which reaches the processes run.sh starts and not a worker the launcher
# starts directly. Without it the first `import atlasfold.model` refuses by
# name, from the core pin gate that every kit entry runs first:
#
#   [atlasfold-opt] NOT ACTIVE: reason=core_missing:opt_core (pinned >=
#   v0.5.134.2 at ../../common/opt_core; nothing importable as opt_core on
#   sys.path)
#
# The kit's own README names this exact route: "For the `ATLASFOLD_OPT=` route
# without `run.sh` (Run), `pip install -e ../common/opt_core` or export the same
# PYTHONPATH first." The editable install is taken because it survives into any
# interpreter invocation, where a PYTHONPATH does not. rosettafold3's install
# line does the same thing for the same reason.
#
# ATLASFOLD_WEIGHTS_DIR is set on the command line because the kit step does
# not export [weights] root_env (only the weights step does), and run.sh needs
# it twice: `check_pins.py --weights` reads the variable, and the
# `atlasfold_opt install --weights` line is guarded on it. Neither gates: the
# kit's own words are that a weights comparison is "information; not a gate",
# and exit 1 comes only from a modified `stock/src` tree.
#
# `python3` on PATH is what run.sh drives -- it reads no PYTHON variable -- and
# `tu remote setup` puts the manifest's interpreter first on PATH for exactly
# this step, so the plain form is the correct one.
install = """
{python} -m pip install -q --no-build-isolation --no-deps -e ../common/opt_core &&
ATLASFOLD_WEIGHTS_DIR={weights_root} bash run.sh install --weights {weights_root}
"""

# The kit's own documented knobs, applied before the process starts. Both come
# from `configs/<card>.env`, which a resident worker never sources because it
# does not go through `run.sh`.
[kit.env]
# What the four shipped config files set for Intel OpenMP, verbatim and for the
# same reason. There is no aarch64 config file to copy it from, and this value
# is identical in h100.env, h200.env and a100.env.
KMP_AFFINITY = "disabled"
# The card a config targets, which the kit prints and uses for nothing else on
# this path -- `AFO_TARGET_GPU` is a label, while every kernel route is chosen
# per call from the live `torch.cuda.get_device_properties` (the ACTIVE line's
# own `gpu=NVIDIA GB10(sm121)` is read, not configured). Set to the truth
# rather than borrowed from h100.env, because borrowing "H100(sm90)" would put
# a false card name in the kit's report for no gain.
AFO_TARGET_GPU = "GB10(sm121)"
#
# NOT SET, and each omission is a decision:
#   AFO_DENOISER_GRAPH_MAX_TOKENS -- `big` carries no graph lever; nothing to gate.
#   AFO_GRAPH_REUSE=0             -- likewise.
#   AFO_ALLOC_EXPANDABLE=graphs   -- only meaningful under `fast`; see mode above.
#   AFO_DET=1                     -- upstream seeds its RNG per record itself and
#                                    the deterministic recipe costs TF32 and pins
#                                    the cuBLAS workspace. A caller who needs
#                                    bit-reproducibility needs `exact --det 1`,
#                                    which is a different provider configuration,
#                                    not a request option.
#   AFO_ALLOW_PARTIAL=1           -- deliberately absent. A partial activation is
#                                    what this provider wants to hear about, not
#                                    to proceed through; with `atom_sdpa` ablated
#                                    the row activates whole and `skipped=none`.
#
