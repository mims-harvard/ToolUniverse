# AtlasFold — all-atom protein and complex structure prediction, held resident.
#
# The eleventh provider on the standard, and the first whose kit's SELLING POINT
# is GPU memory rather than speed: AtlasFold v1.0.0's optimization kit ships
# four modes (`off`, `exact`, `fast`, `big`) whose own README says `big` / `fast`
# "reach 4,000 tokens on one GPU (stock 2,000)" and that the kit modes are
# "faster than stock from mid-size inputs up, slower on small ones". So the
# number that matters here is [gpu] vram_budget_gb and the ladder under it, and
# a ladder that stopped at 400 residues would miss the whole point of the kit.
#
# WHAT RESIDENCY BUYS HERE, and it is not graphs. Stock AtlasFold's entry point
# is `atlasfold monomer|multimer`, whose `run()` calls `load_model(...)` ->
# `atlasfold.pretrained.load_model` INSIDE the call, every time. That reads
# 6,128,042,331 bytes of AtlasLM-3B plus an 859,549,307-byte folding head from
# disk and puts both on the card before the first residue is folded. The kit's
# own README prices the per-run overhead at "≈11 s start-up and model load:
# ≈15 s per Run example". A resident worker pays it once. Nothing in the kit
# replaces that loader -- `registry.LEVERS` has no site on
# `atlasfold.pretrained` -- so the WORKER is what memoises it, and the ready
# line and every reply say `weights_held_by = "worker"`.
#
# THE FOOTPRINT IS CONSTANT-DOMINATED EVEN THOUGH THE ARCHITECTURE IS N^2.
# This is the prediction this manifest makes before measurement, and it is the
# interesting one. OpenFold3 and RoseTTAFold3 cost 3.6x and 3.7x going from 100
# to 800 residues because an N^2 pair track is almost all of their footprint.
# AtlasFold has the same N^2 pair track -- channel_z = 128 over 48 trunk blocks
# -- but 6.51 GiB of it is a 3-billion-parameter language model that does not
# grow with the input at all. So the expected shape is ESMFold2's (1.8x over
# the same span, where ESMC-6B dominates), not OpenFold3's. The arithmetic is
# written out under [gpu] precisely so that whichever term is wrong is
# identifiable rather than absorbed.

[provider]
slug = "atlasfold"
description = "AtlasFold v1.0.0 all-atom structure prediction for a protein monomer or a multimer complex"
operations = ["atlasfold_predict"]
# VERIFIED, and the word was earned twice over because the first attempt was
# not. The first smoke died after a clean activation and a model load with
# `LLVM ERROR: Cannot select: intrinsic %llvm.nvvm.shfl.sync.bfly.i32`, which
# the supervisor reported as `smoke_protocolerror -- peer closed the connection
# mid-message`: the worker aborted without speaking. The cause, the measurements
# that found it and the configuration that answers it are under [kit].
status = "verified"
verified_on = """NVIDIA GB10 (aarch64, cc 12.1, driver 580.173.02), host zgx,
venv route, Python 3.11.12, torch 2.7.1+cu128, triton 3.3.1, kit mode `big`
with THIRTEEN levers ablated through the kit's MODEL_OPT_LEVERS_OFF door and
the stock triangle backend forced to `--kernel torch` -- neither of which is a
preference; see [kit] for the measurements that force both.

VERIFIED ON TWELVE REQUESTS IN ONE HELD WORKER, not on one fold, following
STANDARD.md section 12. Every request asserted to have produced structures:

  * ladder, ascending, first:   100, 200, 400, 800 residues  -> 4/4
  * mixed shapes:               100, 100, 400, 100           -> 4/4
  * FOUR CONSECUTIVE IDENTICAL: the 35-residue smoke x4       -> 4/4
                                3.6 / 3.5 / 3.5 / 3.5 s

and then `tu remote setup atlasfold --only smoke` on its own: OK, one
prediction, six mmCIF files (five diffusion samples plus upstream's ranked
copy), peak reserved 12.06 GiB.

RESIDENCY, measured here: the model load is 8.7-11.7 s and the 35-residue fold
is 2.9-3.6 s, so a per-request process would spend about four fifths of its
wall clock on the load this worker pays once. That is the whole of the gain --
there are no CUDA graphs in `big` and the kit's compile caches are empty,
because every lever that would have compiled anything is ablated.

WALL TIMES HERE WERE TAKEN ON A CONTENDED CARD (one or two sibling jobs holding
3-9 GiB throughout) and are upper bounds. Peaks are not: they are this process's
own allocator bookkeeping and reproduce under contention, which is the standing
rule in STANDARD.md section 12.

WHAT THIS DOES NOT CLAIM. It does not claim the kit's optimizations work on this
card -- twelve of the thirteen ablated levers are ablated precisely because they
cannot run here, and what is verified is the provider's remaining memory half.
It does not claim any configuration works on a host with a different Triton;
such a host should delete twelve names from `levers_off`, let the worker's probe
choose `--kernel auto`, and re-measure the ladder, which will be a different and
better one."""

[runtime]
mode = "resident"
worker = "resident/atlasfold_resident_worker.py"
launch = "tooluniverse.remote_resident.kit_launch:build_command"
worker_args = ["--socket", "{socket}", "--slug", "{slug}"]
# The build imports the stack, activates the kit's mode and reads 6.51 GiB of
# weights onto the card. The first REQUEST additionally compiles every
# first-use Triton/NVRTC kernel of the mode and runs the shared core's one-time
# numerical self-check of its fused kernels on this GPU, which the kit's own
# README prices at "seconds on H100; up to ~30 s on A100" and which has never
# been run on an sm121 card. Generous on purpose: a deadline that fires during
# a first-run compile reports a stall that is not one.
start_timeout_s = 1800.0
request_timeout_s = 7200.0
idle_timeout_s = 900.0
# What a run that actually worked leaves behind, as `atlasfold.cli.monomer`'s
# nested `write_outputs` writes it into `<out_dir>/<target>/`:
#
#   <target>_seed-<s>_sample-<i>_model.cif     one per (seed, sample)
#   <target>_seed-<s>_sample-<i>_confidence.json
#   <target>_ranked_model.cif                  a copy of the best sample
#   <target>_ranked_confidence.json
#   <target>_summary.csv                       seed,sample_index,avg_plddt,ptm
#   done.txt                                   touched LAST, after everything
#
# An EXTENSION SET for the same reason openfold3's is one: the structure count
# is a request option (upstream's default is 5 samples x 1 seed), so the only
# count true of every request is "at least one", which a glob already asserts,
# and an exact name would be a second copy of upstream's naming. `--format`
# chooses between cif and pdb per request, so both are declared.
#
# What this separates a fold from: upstream writes the .cif FIRST inside
# write_outputs, so a target that reached write_outputs at all has one. A
# target that raised earlier leaves the output directory holding nothing with
# either extension -- not even `done.txt`, which is touched last.
outputs = ["*.cif", "*.pdb"]
# And the reply-side half. The worker raises when its own structure list is
# empty, so this is belt and braces; it costs nothing and it catches the other
# direction, a worker that wrote files and reported none.
output_keys = ["structures"]
smoke = "smoke/input.fasta"
# Raised from 2400 s for a reason specific to this card: the Triton finding
# under [kit] forces `--kernel torch` for the triangle operations, and the torch
# backend is where upstream's own speed was NOT measured. A 600-residue fold at
# one sample and two steps takes 81 s here; at upstream's defaults (5 samples, 4
# recycles, 20-30 steps) a long chain is tens of minutes rather than minutes. A
# deadline that fires on a slow-but-working backend reports a stall that is not
# one.
smoke_timeout_s = 5400.0
#
# THERE IS NO DATA LOADER ON THIS PROVIDER'S PATH, which is worth stating
# because `num_workers = 0` is otherwise unconditional on this standard (and is
# what openfold3's first crash cost). Checked rather than assumed:
# `torch.utils.data.DataLoader` appears nowhere under
# `stock/src/src/atlasfold/` except `train/{monomer,multimer}/datamodule.py`,
# which inference never imports; `atlasfold.cli.monomer.run` iterates
# `FoldingRunner.fold_iter_batch` on the calling thread. So there is no
# `num_workers` to force to zero.
#
# What this kit has INSTEAD, and both are handled:
#
#  1. `--gpu-ids` makes `atlasfold.cli.multigpu` `torch.multiprocessing.spawn`
#     one interpreter per id -- on a one-GPU box included -- and the kit's
#     `workers.py` rebinds `worker_entry` so each child activates the mode
#     itself. The worker never passes `--gpu-ids` and refuses a request that
#     asks for it: spawning model-sized children out of a process that already
#     holds the card is the fork hazard with a different start method, and a
#     resident worker has nothing to gain from it (it already owns the GPU).
#
#  2. The kit's `output_overlap` lever DOES start a child process -- and it
#     does it correctly, which is why it is left alone. It is one
#     `multiprocessing` SPAWN-context process started at activation with
#     `CUDA_VISIBLE_DEVICES=""` and `ATLASFOLD_OPT` removed, niced +10, that
#     does only host work (numba SASA, gemmi, the confidence dicts) on pickled
#     copies of host arrays. Spawn, not fork, so the parent's CUDA context and
#     kit threads are not copied; and the lever nulls `__main__.__spec__` and
#     deletes `__main__.__file__` for the instant of the spawn so this worker
#     script is not re-run as `__mp_main__`. Verified started on this host: its
#     LEVER line reads `worker=process worker_start=started`. The lever serves
#     only the MULTIMER runner; for a monomer request it steps aside by name
#     (`runner:monomer`), which is in its expected set.

[gpu]
policy = "required"
# MEASURED, on one held worker, ascending, upstream's defaults (5 diffusion
# samples, 1 seed, 4 recycles, auto steps), `peak_reserved_gib` as this
# process's own allocator reports it:
#
#     residues   peak reserved   fold
#           35       12.06 GiB     2.9 s   (the smoke)
#          100       12.06 GiB    12.5 s
#          200       12.06 GiB    33.0 s
#          400       13.84 GiB   122.3 s
#          800       38.63 GiB   609.6 s   <- the figure declared
#
# THE ENVELOPE: 3.2x from 100 to 800 residues, and the shape of that curve is
# the single most useful thing this provider measured. It is flat to 200
# residues and then turns over hard, because 12.06 GiB of it is a floor --
# AtlasLM-3B plus the folding head plus the CUDA context, none of which grows
# with the input -- and above about 400 residues the triangle track overtakes
# that floor completely.
#
# THE PREDICTION MADE BEFORE MEASURING WAS WRONG, AND THE WAY IT WAS WRONG IS
# THE POINT. It read: "800 residues is expected to cost 1.4x what 100 does, not
# 3.6x ... that makes this provider ESMFold2-shaped rather than OpenFold3-shaped,
# and it is the one number in this file most worth checking: if the measured
# ratio comes out near 3x, the pair working-set row is far too small." It came
# out at 3.2x and the pair working-set row was far too small. Two separate
# errors, in the same direction:
#
#   * the constant floor was estimated at 7.6 GiB and measures 12.06 -- 1.6x
#     low, which is exactly ESMFold2's miss, repeated;
#   * the N^2 row assumed the kit's FUSED pair kernels. They are all ablated
#     here (see [kit]), and the triangle attention runs upstream's torch
#     statement, which materialises what cuEquivariance's kernel never does.
#     That is where the 25 GiB between 400 and 800 residues went.
#
# So the ladder measures a provider running on its SLOW path, and the number
# below is honest for this host and pessimistic for any host whose Triton can
# compile for its card. On such a host the kit's own fused kernels come back and
# this should be re-measured rather than inherited; `tu remote setup` records
# the per-host figure in ~/.cache/tooluniverse/measured/atlasfold.json and a
# scheduler should read that one.
#
# ONE PROPERTY A HOST MUST KNOW: THIS RESERVE RATCHETS AND DOES NOT COME BACK.
# Every rung after the 800-residue fold still reports 38.63 GiB -- a 100-residue
# request taking 12.6 s and a 35-residue one taking 3.5 s both read 38.63 --
# because the figure is `torch.cuda.max_memory_reserved` and the caching
# allocator keeps the segments it grew. `alloc_expandable` is on (`effective=true`
# on the kit's own LEVER line) and does not return them either. So a worker that
# has served ONE long chain holds the long chain's reserve for the rest of its
# life, until `idle_timeout_s` retires it. A host that folds mostly short chains
# and occasionally a long one should budget the long one, or run with a shorter
# idle timeout; a host that caps requests at 400 residues can hold this provider
# in 14 GiB rather than 39.
vram_budget_gb = 38.63
driver_min = 570
driver_min_reason = "its pinned stack is CUDA 12.8 (torch 2.7.1+cu128); the 580 floor belongs to the cu130 providers, not to this one"
shareable = true
isolation = "process"

[env]
kind = "venv"
python = "$TOOLUNIVERSE_ATLASFOLD_PYTHON"
lock = "environment/requirements.lock"
# `atlasfold` carries no module-level __version__, so the installed
# distribution is what is asked. atlasfold_opt is the kit and opt_core its
# shared core: both are installed editable from the checkout on top of the
# lock and are deliberately absent from it. opt_core is named here because this
# kit's own `run.sh install` does NOT install it -- see [kit] install.
verify = "import torch, atlasfold, atlasfold_opt, opt_core; from importlib.metadata import version; assert version('atlasfold') == '1.0.0'"

[weights]
# The kit's own variable (`atlasfold_opt.weights.ENV_DIR`), which every
# `configs/<card>.env` sets with `${ATLASFOLD_WEIGHTS_DIR:-/weights/atlasfold}`
# -- so exporting it, as the launcher does, wins over the kit's default without
# editing anything. `/weights/atlasfold` is the kit's documented default and
# not a path a user owns, so this provider's default follows the house
# convention instead.
root_env = "ATLASFOLD_WEIGHTS_DIR"
root_default = "~/.atlasfold"
# NOTHING IN THIS KIT FETCHES WEIGHTS. `run.sh install --weights DIR` only
# compares what is on disk with stock/PINS.json and prints it: its own words
# are "--weights: sha256-checks DIR only (read-only ok), no fetch", and
# `atlasfold_opt.cli.cmd_install` returns 0 either way because "weights are
# never pinned or gated". So the fetch is declared here -- and it is derived
# from the kit's own PINS.json rather than restating a URL: the command reads
# the pin file out of the checkout `{kit}` and asks huggingface_hub for each
# (repo, file, revision) it names, into the <root>/<hf-repo>/<file> layout
# `atlasfold_opt.weights.paths` requires. Add a file to PINS.json upstream and
# this fetches it; move the hub and nothing here has to change.
#
# 7.33 GiB over three repositories, no credential and no licence acceptance:
# MIT, as the three model cards and upstream's README both state.
fetch = "{python} -c \"import json,sys;from huggingface_hub import hf_hub_download as d;p=json.load(open(sys.argv[1]));[d(repo_id=w['repo'],filename=w['file'],revision=w['revision'],local_dir=sys.argv[2]+'/'+w['repo'].split('/')[1]) for w in p['weights']]\" \"{kit}/atlasfold/stock/PINS.json\" \"{weights_root}\""

# GENERATED from the kit's stock/PINS.json by a script, never transcribed --
# see the report accompanying this provider. PINS.json's `weights` is a LIST of
# {repo, file, revision, bytes, sha256, url, license}, a tenth distinct shape,
# and `name` below is `<repo-basename>/<file>` because that is the layout
# `atlasfold_opt.weights.FILES` resolves against the root. All nine files the
# three repositories hold are declared, not just the three checkpoints the kit
# itself compares: the three `config.json` files are three bytes each and share
# a digest, which is correct and not a copy-paste.
# 9 files, 7.33 GiB.

[[weights.files]]
