# Boltz-2's model environment — the exact stack the measurements in
# ../provider.toml were taken on, as `pip freeze --all` of it.
#
# This environment is NOT ToolUniverse's and must not be installed into it:
# torch 2.12.0+cu130 / triton 3.7.0 / numpy 1.26.4 conflict with what the rest
# of the package needs. That separation is the reason the MCP server talks to
# this model over a socket instead of importing it.
#
# Rebuild (Python 3.11, an NVIDIA driver of the 580 series or newer, a C
# compiler on PATH for Triton; no CUDA toolkit — the CUDA 13.0 libraries are the
# nvidia-* wheels below):
#
#   uv venv --seed --managed-python --python 3.11.12 ~/boltz2-venv
#   . ~/boltz2-venv/bin/activate
#   grep -E '^(pip|wheel)==' requirements.lock > /tmp/pip.txt
#   python -m pip install --no-deps -r /tmp/pip.txt
#   printf 'setuptools==82.0.1\n' > /tmp/bc.txt
#   grep -v -E '^(#|pip==|wheel==)' requirements.lock > /tmp/stack.txt
#   python -m pip install --no-deps --build-constraint /tmp/bc.txt -r /tmp/stack.txt
#   export LD_LIBRARY_PATH=$(python -c 'import site; print(site.getsitepackages()[0])')/nvidia/cu13/lib
#
# --no-deps is deliberate: the list is complete, and letting a resolver re-derive
# it is how a stack stops being the one that was measured. Then install the
# optimization kit into it (its own README's `run.sh install`), which adds the
# two editable packages the freeze below deliberately omits: boltz2_opt and
# opt_core, whose versions are pinned in ../provider.toml under [kit].
#
# Every distribution here resolves on linux-aarch64 as well as x86_64; four of
# them (antlr4-python3-runtime, fairscale, ihm, modelcif) are pure-Python source
# distributions and build anywhere.
