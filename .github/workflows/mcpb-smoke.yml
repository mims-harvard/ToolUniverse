name: MCPB bundle smoke test

# Builds the Claude Desktop bundle and actually starts it.
#
# Everything else that guards this bundle reads files in the repo:
# tests/unit/test_mcpb_bundle.py checks the manifest, build.sh checks version
# drift and runs the MCPB schema validator. None of them launch the artifact we
# publish. A bundle that could not boot at all therefore reached the release
# page: its launcher told uv to skip installing the bundle's dependencies, so
# the server died on its first third-party import. Manifest valid, versions
# matched, unit tests green.
#
# This job unpacks the built .mcpb and launches it with the command recorded in
# the manifest, then completes an MCP initialize handshake. A launcher change
# that breaks startup breaks this too.
#
# It is slow -- the first launch resolves and installs the bundle's whole
# dependency set -- so it runs on changes that can affect the bundle rather
# than on every push.
#
# The bundle is built once and then started on both Linux and Windows, because
# the same failure happened again on a platform this job could not see. Every
# workflow in this repository ran only on ubuntu-latest, so a launcher that
# worked on POSIX and could never start on Windows reached the release page:
# os.exec* there joins argv without quoting, and Desktop installs the bundle
# under "Claude Extensions" (issue #684). The smoke test now also unpacks under
# a path containing a space, which is what made that bug invisible rather than
# merely untested.
#
# Only the launch is platform-specific; the artifact is a zip. build.sh stays
# POSIX-only -- it drives uv, npx and python3 with shell paths, and under the
# Git Bash on windows-latest those reach a native Windows python as
# "/d/a/.../manifest.json", which it cannot open. So the build runs once on
# Linux and both legs start the identical artifact, which is also closer to
# what users install than a separately built one would be.

on:
  push:
    branches: [main]
    paths:
      - "mcpb/**"
      - "src/tooluniverse/**"
      - "pyproject.toml"
      - ".github/workflows/mcpb-smoke.yml"
  pull_request:
    paths:
      - "mcpb/**"
      - "src/tooluniverse/**"
      - "pyproject.toml"
      - ".github/workflows/mcpb-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpb-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the bundle
        run: bash mcpb/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tooluniverse-mcpb
          path: dist/tooluniverse.mcpb
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: Start it (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: tooluniverse-mcpb
          path: dist

      # smoke_test.py unpacks the bundle under a directory with a space in its
      # name and launches it with the command out of the manifest, exactly as
      # Desktop would. Plain `python` rather than `python3`: the Windows runner
      # has no python3 on PATH.
      - name: Start it and complete an MCP handshake
        run: python mcpb/smoke_test.py dist/tooluniverse.mcpb --timeout 1500
