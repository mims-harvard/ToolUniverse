name: LAB-Bench reproduction checks
on:
  pull_request:
    paths:
      - 'examples/benchmarks/labbench/**'
      - '.github/workflows/labbench-reproduction.yml'
  push:
    branches: [main]
    paths:
      - 'examples/benchmarks/labbench/**'
      - '.github/workflows/labbench-reproduction.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s examples/benchmarks/labbench/tests -v
