name: BixBench reproduction checks
on:
  pull_request:
    paths:
      - 'benchmarks/bixbench/**'
      - 'skills/devtu-benchmark-harness/scripts/run_eval.py'
      - '.github/workflows/bixbench-reproduction.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/bixbench/**'
      - 'skills/devtu-benchmark-harness/scripts/run_eval.py'
      - '.github/workflows/bixbench-reproduction.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s benchmarks/bixbench/tests -v
